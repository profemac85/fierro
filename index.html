/* la imagen sola, sin el desplegable: acá el visual es el protagonista */
function visualPB(k){
  if(!k || !LIB[k]) return "";
  const e = LIB[k];
  if(e.img) return '<img src="media/ejercicios/' + e.img + '" alt="" onerror="imgFallo(this,\'' + k + '\')">';
  return esquemaSVG(k);
}

function enfocarReps(paso){
  /* el foco va en el mismo gesto del toque, que es lo que deja a iOS abrir el
     teclado; si se retrasa con un setTimeout, el teclado no sube */
  const el = esTiempo(paso.k) ? $("#pbSeg") : $("#pbReps");
  if(el){ el.focus(); el.select(); }
}

/* ---------- playback: acciones ---------- */
function pbCheck(){
  const e = pbEstado(); if(!e) return;
  const {s, ses} = e;
  const {pasos, i, paso} = pasoActual(s, ses);
  if(!paso) return;
  iniciarAudio();
  if(paso.tipo === "prep"){ pbIr(i + 1); return; }
  /* deja anotado el sugerido (o el tiempo real si venía corriendo) y descansa */
  const val = valorSugerido(ses.id, paso);
  if(esTiempo(paso.k) && s.ejIniISO){
    const corrido = Math.round((Date.now() - new Date(s.ejIniISO).getTime()) / 1000);
    if(corrido > 0) val.seg = corrido;
  }
  const previo = (logDe(ses.id, paso.k) || {rondas:[]}).rondas[paso.ronda];
  if(!rondaValida(previo)){
    if(chequearRecord(paso.k, val)) val.rec = 1;
    setRonda(ses.id, paso.k, paso.ronda, val);
  }
  vibrar(60);
  const s2 = sa();
  s2.ejIniISO = null; saGuardar(s2);
  /* la última serie no lleva descanso de despedida */
  if(i + 1 >= pasos.length){ pbIr(i + 1); return; }
  sincronizarTramo(paso.tramo);
  iniciarDescanso(60);
  pintarPlayback();
}
function pbEmpezarEj(){
  const s = sa(); if(!s) return;
  iniciarAudio();
  s.ejIniISO = hoyISO(); saGuardar(s);
  pintarPlayback();
}
function pbListo(){
  const s = sa(); if(!s) return;
  const {pasos, i} = pasoActual(s, sesionDe(s.sesionId));
  s.finDescansoISO = null; s.estado = "trabajo"; saGuardar(s);
  pbIr(i + 1);
}
function pbAtras(){
  const s = sa(); if(!s) return;
  const {i} = pasoActual(s, sesionDe(s.sesionId));
  s.finDescansoISO = null; s.estado = "trabajo"; saGuardar(s);
  pbIr(Math.max(0, i - 1));
}
function pbSaltar(){
  const s = sa(); if(!s) return;
  const {i} = pasoActual(s, sesionDe(s.sesionId));
  s.finDescansoISO = null; s.estado = "trabajo"; saGuardar(s);
  pbIr(i + 1);
}
function pbIr(idx){
  const s = sa(); if(!s) return;
  const ses = sesionDe(s.sesionId);
  const pasos = pasosSesion(ses);
  s.idx = Math.max(0, Math.min(pasos.length, idx));
  /* moverse de paso siempre corta el descanso: si no, queda uno corriendo
     por detrás y el reloj vuelve a mostrarlo cuando no corresponde */
  s.finDescansoISO = null; s.estado = "trabajo";
  s.ejIniISO = null; s.avisoEj = 0;
  const paso = pasos[s.idx];
  /* el reloj de la serie parte solo, salvo en los de tiempo (ahí se aprieta Empezar) */
  if(paso && paso.tipo === "serie" && !esDeTiempo(paso)) s.ejIniISO = hoyISO();
  if(paso && paso.tipo === "prep") s.ejIniISO = hoyISO();
  saGuardar(s);
  if(paso && paso.tipo === "serie") sincronizarTramo(paso.tramo);
  pintarPlayback();
}
/* El tramo del cronómetro sigue al paso en que va el playback, pero solo hacia
   adelante: si vuelves atrás a corregir una serie, el tiempo ya transcurrido no
   se devuelve. */
function sincronizarTramo(tramo){
  const s = sa(); if(!s || !tramo) return;
  if(tramo > s.tramo){ s.tramo = tramo; s.tramoIniMs = saElapsed(s); s.av60 = false; s.av0 = false; saGuardar(s); }
}
function pbGuardarCampos(){
  const e = pbEstado(); if(!e) return;
  const {s, ses} = e;
  const {paso} = pasoActual(s, ses);
  if(!paso || paso.tipo !== "serie") return;
  const k = paso.k;
  let val;
  if(esTiempo(k)) val = {seg: num(($("#pbSeg") || {}).value)};
  else val = {kg: num(($("#pbKg") || {}).value), reps: num(($("#pbReps") || {}).value)};
  if(!rondaValida(val)) return;
  const previo = (logDe(ses.id, k) || {rondas:[]}).rondas[paso.ronda] || {};
  /* al corregir el valor puede aparecer un récord que antes no estaba */
  if(chequearRecord(k, val) || previo.rec) val.rec = 1;
  setRonda(ses.id, k, paso.ronda, val);
  const caja = $(".pb-hecho");
  if(caja && val.rec && !caja.querySelector(".pb-rec"))
    caja.innerHTML += ' <span class="pb-rec">● récord</span>';
}

/* los relojes se refrescan cada tick sin repintar, para no botar el teclado */
function refrescarPB(){
  const e = pbEstado(); if(!e || verLista) return;
  const {s, ses} = e;
  const {pasos, i, paso} = pasoActual(s, ses);
  const firma = i + "|" + (s.finDescansoISO && paso && paso.tipo === "serie" ? "d" : "t") + "|" + (s.ejIniISO ? "1" : "0");
  if(firma !== pbFirma){ pintarPlayback(); return; }
  const rel = $("#pbReloj"); if(!rel || !paso) return;
  if(s.finDescansoISO){
    const falta = Math.max(0, new Date(s.finDescansoISO).getTime() - Date.now());
    rel.textContent = fmtReloj(falta);
    return;
  }
  if(!s.ejIniISO) return;
  const corrido = Date.now() - new Date(s.ejIniISO).getTime();
  if(paso.tipo === "prep"){
    const falta = TRAMOS[0].min * 60000 - corrido;
    rel.textContent = fmtReloj(Math.abs(falta));
    rel.classList.toggle("pasado", falta < 0);
    return;
  }
  const est = estimadoSerie(paso);
  const falta = est - corrido;
  rel.textContent = fmtReloj(Math.abs(falta));
  /* al llegar a cero no pasa nada: es un referente, no un plazo. En los de
     tiempo sí avisa, porque ahí el tiempo es el ejercicio. */
  rel.classList.toggle("pasado", falta < 0);
  if(esDeTiempo(paso) && falta <= 0 && !s.avisoEj){
    const s2 = sa(); s2.avisoEj = 1; saGuardar(s2);
    beep(1); vibrar(150);
  }
}

function pintarHoy(){
  const act = sa();
  /* al recargar a mitad de sesión, sesionSel vuelve a null: se recupera de la
     sesión activa antes de cualquier salida temprana */
  if(act && act.semana === semana) sesionSel = act.sesionId;
  if(enPlayback()){ pintarPlayback(); return; }
  const f = faseActual();
  if(!sesionSel) sesionSel = sesionSugerida();
  const ses = sesionDe(sesionSel);
  const hecha = sesionHecha(semana, sesionSel);
  const racha = calcRacha();
  const ultima = todasLasSesiones().filter(s => s.hecha).pop();
  const ausente = ultima && (Date.now() - ultima.fecha.getTime()) / 86400000 > 10;

  let h = '<div class="fila-marca"><span class="marca">FIERRO</span>' + minimapaHTML() + "</div>";
  h += '<div class="fila-semana">' +
    '<button class="btn-flecha" onclick="cambiarSemana(-1)" aria-label="semana anterior">◀</button>' +
    '<div class="sem-centro"><div class="sem-titulo">Semana ' + semana + ' de 12</div>' +
    '<div class="etq">Fase ' + f + " · rondas " + FASES[f].rondas + " · RIR " + FASES[f].rir + "</div></div>" +
    '<button class="btn-flecha" onclick="cambiarSemana(1)" aria-label="semana siguiente">▶</button></div>';

  if(pbEstado() && verLista)
    h += '<button class="btn-grande btn-acento" style="margin-bottom:12px" onclick="verLista=false;pintar()">‹ Volver a la sesión guiada</button>';
  h += '<div class="pills">' + SESIONES.map(s =>
    '<button class="pill' + (s.id === sesionSel ? " sel" : "") + (sesionHecha(semana, s.id) ? " ok" : "") +
    '" onclick="elegirSesion(\'' + s.id + '\')"><b>' + s.id + "</b><small>" + s.n + "</small></button>").join("") + "</div>";
  h += interruptorHTML(ses);

  if(ausente && !sa()){
    h += '<div class="tarjeta"><span class="etq">De vuelta</span><p style="font-size:13.5px;margin-top:4px">El bloque quedó esperando en la semana ' +
      (Math.floor(ordenSesion(ultima.w, ultima.sid) / 4) + 1) + ". Retoma donde ibas, sin drama. La racha se recupera terminando la próxima sesión.</p></div>";
  }
  if(racha.pausa){
    h += '<div class="tarjeta"><span class="etq">Racha en pausa</span><p style="font-size:13.5px;margin-top:4px">Quedó una sesión pendiente más atrás. La racha se recupera si terminas la siguiente sesión dentro de 10 días.</p></div>';
  }
  h += criteriosHTML();

  /* botón de sesión */
  const s = sa();
  if(hecha){
    h += '<div class="tarjeta" style="border-color:var(--acento)"><span class="etq" style="color:var(--acento)">Sesión terminada</span>' +
      '<div style="font-size:13.5px;margin-top:4px">' + (hecha.seriesTotales || 0) + " series · " +
      (hecha.duracionReal ? hecha.duracionReal + " min · " : "") + fmtFecha(hecha.fecha) + "</div></div>";
  } else if(!s || s.sesionId !== sesionSel || s.semana !== semana){
    h += '<button class="btn-grande btn-acento" style="margin-bottom:12px" onclick="empezarSesion()">Empezar sesión · 30 min</button>';
  }

  h += '<div class="tarjeta"><div class="tarjeta-cab"><span class="etq">Preparación · 3 min</span></div>' +
    '<div class="aviso-suave">Movilidad de hombros y cadera, más una o dos series de aproximación livianas del primer par. El cronómetro avanza solo al bloque 1.</div></div>';

  h += bloqueHTML(sesionSel, ses, 1);
  h += bloqueHTML(sesionSel, ses, 2);
  h += bloqueHTML(sesionSel, ses, 3);

  h += '<button class="btn-grande btn-acento" id="btnTerminar" onclick="terminarSesion()"' +
    (hecha ? " disabled" : "") + ">" + (hecha ? "Sesión terminada ✓" : "Terminar sesión") + "</button>";

  $("#app").innerHTML = h;
  actualizarBotonTerminar(sesionSel);

}

/* criterios de cambio de fase */
function criteriosHTML(){
  const f = faseActual();
  if(f >= 3) return "";
  const decisiones = lget("criterios", {});
  const semanaLlena = SESIONES.every(s => sesionHecha(semana, s.id));
  const finDeFase = semanaLlena || semana === 12;
  if(!finDeFase || decisiones["s" + semana]) return "";
  /* se muestra al cerrar una semana completa, típicamente la última de la fase */
  return '<div class="tarjeta"><span class="etq">Semana completa · cambio de fase</span>' +
    '<p style="font-size:13.5px;margin:6px 0 10px">Para pasar a la fase ' + (f + 1) + ' confirma los tres criterios: agujetas resueltas en menos de 48 horas, sin molestia articular ni tendinosa, y techo del rango alcanzado en la mayoría de los ejercicios. Si alguno falla, repite la fase: la racha no se toca.</p>' +
    '<button class="btn-grande btn-acento" style="min-height:48px;margin-bottom:8px" onclick="decidirFase(true)">Cumplo los tres · fase ' + (f + 1) + "</button>" +
    '<button class="btn-grande btn-borde" style="min-height:48px" onclick="decidirFase(false)">Todavía no · repito fase ' + f + "</button></div>";
}
function decidirFase(avanza){
  const dec = lget("criterios", {});
  dec["s" + semana] = avanza ? "avanza" : "repite";
  lset("criterios", dec);
  if(avanza) lset("fase", Math.min(3, faseActual() + 1));
  aviso(avanza ? "Fase " + faseActual() + " activada." : "Fase " + faseActual() + " se repite. Bien pensado.");
  pintarHoy();
}

/* ---------- progreso ---------- */
let curvaSel = null;
function pintarProgreso(){
  const todas = todasLasSesiones().filter(s => s.hecha);
  const nSes = todas.length;
  let h = '<div class="fila-marca"><span class="marca">FIERRO</span></div>';
  if(!nSes){
    h += '<div class="tarjeta"><p style="font-size:14px">Acá va a aparecer tu bloque. Termina la primera sesión para pintar la primera celda.</p></div>';
    h += '<div class="tarjeta">' + mapaHTML() + "</div>";
    $("#app").innerHTML = h; return;
  }
  const series = todas.reduce((a, s) => a + (sesionHecha(s.w, s.sid).seriesTotales || 0), 0);
  const ton = todas.reduce((a, s) => a + (sesionHecha(s.w, s.sid).tonelaje || 0), 0);
  const racha = calcRacha();
  h += '<div class="tarjeta"><div class="tarjeta-cab"><span class="etq">Mapa del bloque</span><span class="etq">' + nSes + " de 48</span></div>" + mapaHTML() + "</div>";
  h += '<div class="kpis">' +
    '<div class="kpi"><div class="etq">Sesiones</div><div class="num">' + nSes + "</div></div>" +
    '<div class="kpi"><div class="etq">Series completadas</div><div class="num">' + series + "</div></div>" +
    '<div class="kpi"><div class="etq">Tonelaje total</div><div class="num">' + fmtNum(Math.round(ton)) + "<small> kg</small></div></div>" +
    '<div class="kpi"><div class="etq">Racha' + (racha.pausa ? " · en pausa" : "") + '</div><div class="num">' + racha.n + "</div></div></div>";

  /* curva por ejercicio */
  /* los del programa siempre, más cualquiera con registro: si entrenó en
     calistenia, esos ejercicios también tienen curva propia */
  const claves = [];
  SESIONES.forEach(s => [].concat(s.b1, s.b2, s.cierre.ej).forEach(it => { if(!claves.includes(it.k)) claves.push(it.k); }));
  Object.keys(LIB).forEach(k => {
    if(claves.includes(k)) return;
    const hay = SESIONES.some(s => { for(let w = 1; w <= 12; w++) if(logDe(s.id, k, w)) return true; return false; });
    if(hay) claves.push(k);
  });
  if(!curvaSel || !claves.includes(curvaSel)) curvaSel = claves[0];
  h += '<div class="tarjeta"><div class="tarjeta-cab"><span class="etq">Curva por ejercicio</span></div>' +
    '<select onchange="verCurva(this.value)">' +
    claves.map(k => '<option value="' + k + '"' + (k === curvaSel ? " selected" : "") + ">" + LIB[k].n + "</option>").join("") +
    "</select><div id='curvaCont'>" + curvaHTML(curvaSel) + "</div></div>";

  /* barras últimas 8 semanas */
  const wIni = Math.max(1, semana - 7);
  h += '<div class="tarjeta"><span class="etq">Sesiones por semana</span><div class="barras8">';
  for(let w = wIni; w <= Math.min(12, wIni + 7); w++){
    const n = SESIONES.filter(s => sesionHecha(w, s.id)).length;
    h += '<div class="col"><div class="palo' + (n ? "" : " cero") + '" style="height:' + (n ? n * 25 : 3) + '%"></div><small>S' + w + "</small></div>";
  }
  h += "</div></div>";

  /* logros */
  const logros = lget("logros", {});
  h += '<div class="tarjeta"><span class="etq">Logros</span><div class="logros" style="margin-top:8px">' +
    LOGROS.map(l => '<div class="logro ' + (logros[l.id] ? "si" : "no") + '"><b>' + l.n + "</b><small>" +
      (logros[l.id] ? "Desbloqueado el " + fmtFecha(logros[l.id]) : l.c) + "</small></div>").join("") + "</div></div>";

  /* récords */
  const recs = Object.keys(LIB).filter(k => lget("pr_" + k, null));
  if(recs.length){
    h += '<div class="tarjeta"><span class="etq">Récords por ejercicio</span><div class="lista-rec" style="margin-top:6px">' +
      recs.map(k => {
        const p = lget("pr_" + k, {});
        const v = esTiempo(k) ? (p.seg || 0) + " s" :
          p.volumen ? fmtNum(p.kg) + " kg × " + p.reps : (p.reps || 0) + " reps";
        return "<div><span>" + LIB[k].n + "</span><b>" + v + " <span style='color:var(--suave);font-weight:600'>· sem " + (p.semana || "?") + "</span></b></div>";
      }).join("") + "</div></div>";
  }
  $("#app").innerHTML = h;
}
function verCurva(k){ curvaSel = k; const c = $("#curvaCont"); if(c) c.innerHTML = curvaHTML(k); }
/* La cadena completa a la que pertenece un ejercicio, de la versión más fácil a
   la más difícil: la escalera de flexiones entera, o el par con su variante de
   fase 3. Se recorre hacia atrás y hacia adelante para que la línea de progreso
   no se corte, se entre por donde se entre. */
function cadenaDe(k){
  let raiz = k;
  for(let i = 0; i < 8 && LIB[raiz].progresaDe; i++) raiz = LIB[raiz].progresaDe;
  const cadena = [raiz];
  for(let i = 0; i < 8; i++){
    const sig = Object.keys(LIB).find(x => LIB[x].progresaDe === cadena[cadena.length - 1]);
    if(!sig) break;
    cadena.push(sig);
  }
  return cadena;
}
function curvaHTML(kBase){
  /* mejor ronda (reps o segundos) por semana, encadenando las progresiones */
  const cadena = cadenaDe(kBase);
  const puntos = [];
  for(let w = 1; w <= 12; w++){
    let mejor = 0, esl = 0;
    SESIONES.forEach(ses => {
      cadena.forEach((kk, iCad) => {
        const log = logDe(ses.id, kk, w);
        if(log) log.rondas.forEach(r => {
          const v = esTiempo(kk) ? num(r.seg) : num(r.reps);
          if(v > mejor){ mejor = v; esl = iCad; }
        });
      });
    });
    if(mejor > 0) puntos.push({w, v:mejor, esl});
  }
  /* la línea vertical marca la semana en que subió de eslabón, no la posición
     dentro de la cadena: entrar directo por el peldaño 3 no es un cambio */
  let semCambio = null;
  for(let i = 1; i < puntos.length; i++)
    if(puntos[i].esl > puntos[i - 1].esl && semCambio == null) semCambio = puntos[i].w;
  if(!puntos.length) return '<div class="curva-nota">Sin registros todavía. La curva parte con la primera sesión que anotes.</div>';
  const maxV = Math.max(...puntos.map(p => p.v)) + 2;
  const X = w => 16 + (w - 1) * (308 / 11);
  const Y = v => 92 - (v / maxV) * 78;
  let svg = '<svg class="curva-svg" viewBox="0 0 340 112">';
  svg += '<line x1="14" y1="92" x2="326" y2="92" stroke="var(--linea)" stroke-width="1"/>';
  for(let w = 1; w <= 12; w++) svg += '<text x="' + X(w) + '" y="104" text-anchor="middle" font-size="8" fill="var(--suave)">' + w + "</text>";
  if(semCambio != null) svg += '<line x1="' + X(semCambio) + '" y1="8" x2="' + X(semCambio) + '" y2="92" stroke="var(--marca)" stroke-width="1" stroke-dasharray="3 3"/>';
  if(puntos.length > 1)
    svg += '<polyline fill="none" stroke="var(--acento)" stroke-width="2" points="' +
      puntos.map(p => X(p.w) + "," + Y(p.v)).join(" ") + '"/>';
  puntos.forEach(p => {
    svg += '<circle cx="' + X(p.w) + '" cy="' + Y(p.v) + '" r="3.5" fill="var(--acento)"/>';
    svg += '<text x="' + X(p.w) + '" y="' + (Y(p.v) - 7) + '" text-anchor="middle" font-size="9" font-weight="700" fill="var(--tinta)">' + p.v + "</text>";
  });
  svg += "</svg>";
  const uni = esTiempo(kBase) ? "segundos" : "repeticiones";
  const ultimoEsl = puntos[puntos.length - 1].esl;
  const sigue = cadena[ultimoEsl + 1] ? LIB[cadena[ultimoEsl + 1]].n.toLowerCase() : null;
  return svg + '<div class="curva-nota">Mejor ronda de cada semana, en ' + uni + "." +
    (semCambio != null ? " La línea ámbar marca la semana en que pasaste a la versión más difícil." : "") +
    (sigue ? " Cuando pases a " + sigue + ", la curva sigue acá misma." : "") + "</div>";
}

let filtroEj = "";
function pintarEjercicios(){
  let h = '<div class="fila-marca"><span class="marca">FIERRO</span></div>' +

    '<div id="listaEj">' + listaEjHTML() + "</div>";
  $("#app").innerHTML = h;
}
function normalizar(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function buscarEj(v){ filtroEj = v; $("#listaEj").innerHTML = listaEjHTML(); }
/* uno busca "espalda" y las fichas dicen "dorsal": sin esto el buscador queda
   pidiendo el nombre técnico del músculo */
const SINONIMOS = {
  espalda:["dorsal","romboides","trapecio"], pecho:["pectoral"], pectorales:["pectoral"],
  pierna:["cuadriceps","isquiotibiales","gluteos"], piernas:["cuadriceps","isquiotibiales","gluteos"],
  cuadriceps:["cuadriceps"], isquios:["isquiotibiales"], femoral:["isquiotibiales"],
  brazo:["biceps","triceps"], brazos:["biceps","triceps"],
  hombro:["hombro","deltoides"], hombros:["hombro","deltoides"],
  gemelos:["gemelo"], pantorrilla:["gemelo"], poto:["gluteos"], abdomen:["core"], guata:["core"]
};
function listaEjHTML(){
  const q = normalizar(filtroEj.trim());
  const alternativas = q ? [q].concat(SINONIMOS[q] || []) : [];
  const claves = Object.keys(LIB).filter(k => {
    if(!q) return true;
    const e = LIB[k];
    const texto = normalizar(e.n) + " " + normalizar(e.m);
    return alternativas.some(a => texto.includes(a));
  });
  if(!claves.length) return '<div class="tarjeta aviso-suave">Nada con ese nombre. Prueba por músculo: espalda, glúteo, tríceps...</div>';
  return claves.map(k => {
    const e = LIB[k];
    return '<div class="tarjeta"><b style="font-size:15px">' + e.n + "</b>" +
      '<div class="aviso-suave" style="margin:2px 0 4px">' + e.m + "</div>" +
      '<span class="chip">' + (PATRONES[e.patron] || e.patron) + '</span> <span class="chip">' + (TIPOS[e.tipo] || e.tipo) + "</span>" +
      comoSeHace(k) + "</div>";
  }).join("");
}

/* exportar y borrar */
function exportar(){
  let txt = "FIERRO · registro de entrenamiento\nExportado el " + fmtFecha(hoyISO()) + "\n";
  for(let w = 1; w <= 12; w++){
    let bloque = "";
    SESIONES.forEach(ses => {
      const dato = sesionHecha(w, ses.id);
      let lineas = "";
      /* por casilla se exporta lo que haya de cualquiera de sus versiones:
         la del programa, la variante de fase 3 y la de calistenia */
      [].concat(ses.b1, ses.b2, ses.cierre.ej).forEach(item => {
        const vars = [item.k, VARIANTES[item.k], SIN_PESO[item.k],
                      VARIANTES[item.k] ? SIN_PESO[VARIANTES[item.k]] : null];
        [...new Set(vars.filter(Boolean))].forEach(kk => {
          const log = logDe(ses.id, kk, w);
          if(!log) return;
          const vals = log.rondas.filter(rondaValida).map(r =>
            esTiempo(kk) ? num(r.seg) + " s" : (num(r.kg) ? fmtNum(num(r.kg)) + " kg x " : "") + num(r.reps) + (r.rec ? "*" : "")).join(", ");
          if(vals) lineas += "    " + LIB[kk].n + ": " + vals + "\n";
        });
      });
      if(dato || lineas){
        bloque += "  Sesión " + ses.id + " (" + ses.n + ")" +
          (dato ? " · terminada el " + fmtFecha(dato.fecha) +
            (dato.duracionReal ? " · " + dato.duracionReal + " min" : "") +
            " · " + (dato.seriesTotales || 0) + " series · " + fmtNum(Math.round(dato.tonelaje || 0)) + " kg" +
            (dato.modo && dato.modo !== "normal" ? " · sin mancuernas" : "")
          : " · sin terminar") + "\n" + lineas;
      }
    });
    if(bloque) txt += "\nSEMANA " + w + "\n" + bloque;
  }
  const recs = Object.keys(LIB).filter(k => lget("pr_" + k, null));
  if(recs.length){
    txt += "\nRÉCORDS (* = serie récord)\n";
    recs.forEach(k => {
      const p = lget("pr_" + k, {});
      txt += "  " + LIB[k].n + ": " + (esTiempo(k) ? (p.seg || 0) + " s" : p.volumen ? fmtNum(p.kg) + " kg x " + p.reps : (p.reps || 0) + " reps") + " (semana " + (p.semana || "?") + ")\n";
    });
  }
  const logros = lget("logros", {});
  const conL = LOGROS.filter(l => logros[l.id]);
  if(conL.length){
    txt += "\nLOGROS\n" + conL.map(l => "  " + l.n + " (" + fmtFecha(logros[l.id]) + ")").join("\n") + "\n";
  }
  if(navigator.share){ navigator.share({text:txt}).catch(() => copiar(txt)); }
  else copiar(txt);
}
function copiar(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(() => aviso("Registro copiado al portapapeles."), () => aviso("No se pudo copiar."));
  } else aviso("Este navegador no deja copiar directo.");
}
function borrarTodo(){
  abrirModal("Borrar todo", "Se borra el registro completo: sesiones, récords y logros. No hay vuelta.",
    [["Cancelar", cerrarModal],
     ["Sí, borrar todo", () => {
        cerrarModal();
        abrirModal("¿Seguro?", "Última confirmación. Después de esto no queda nada.",
          [["Cancelar", cerrarModal],
           ["Borrar definitivamente", () => {
              const claves = [];
              for(let i = 0; i < localStorage.length; i++){
                const k = localStorage.key(i);
                if(k && k.startsWith("fz_")) claves.push(k);
              }
              claves.forEach(k => localStorage.removeItem(k));
              cerrarModal(); semana = 1; sesionSel = null; curvaSel = null;
              document.body.classList.remove("con-sesion");
              aviso("Borrado. Empezamos de cero.");
              pintar();
           }]]);
     }]]);
}

/* ============ arranque ============ */
function init(){
  const est = document.createElement("style");
  est.textContent = cssEsquemas();
  document.head.appendChild(est);
  if(lget("fase", null) == null) lset("fase", 1);
  document.body.classList.toggle("con-sesion", !!sa());
  pintar();
  revisarSesionColgada();
  if(tickInt) clearInterval(tickInt);
  tickInt = setInterval(tick, 500);
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
init();
</script>
