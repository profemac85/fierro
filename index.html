  plancha_lateral:{rig:rigPlanchaLateral},
  burpees:        {rig:() => rigFlex({yMano:170, caida:26})}
};
function encuadre(caja, ancho, alto, margen){
  const m = margen == null ? 6 : margen;
  const w = caja[2] - caja[0], h = caja[3] - caja[1];
  const zoom = Math.min((ancho - 2*m) / w, (alto - 2*m) / h);
  return {zoom, dx:(ancho - w * zoom) / 2 - caja[0] * zoom, dy:(alto - h * zoom) / 2 - caja[1] * zoom};
}
/* Ojo con los dos formatos: el atributo transform de SVG va sin unidades y con
   espacios, y el transform de CSS exige px y deg. Mezclarlos deja el keyframe
   vacío y la animación quieta, sin error visible. */
function escalaDe(p){ return (p.escX || p.escY) ? [p.escX || 1, p.escY || 1] : null; }
function trSVG(p){
  const e = escalaDe(p);
  return 'transform="translate(' + p.pivote[0] + " " + p.pivote[1] + ") rotate(" + p.ang + ")" +
    (e ? " scale(" + e[0] + " " + e[1] + ")" : "") + " translate(" + (-p.pivote[0]) + " " + (-p.pivote[1]) + ')"';
}
function trCSS(p){
  const e = escalaDe(p);
  return "translate(" + p.pivote[0] + "px," + p.pivote[1] + "px) rotate(" + p.ang + "deg)" +
    (e ? " scale(" + e[0] + "," + e[1] + ")" : "") + " translate(" + (-p.pivote[0]) + "px," + (-p.pivote[1]) + "px)";
}
function piezasSVG(piezas, modo, clave){
  return piezas.map(p => {
    const attr = modo === "anim" ? 'class="pz-' + clave + "-" + p.id + '"' : modo === "fin" ? trSVG(p) : "";
    return "<g " + attr + ">" + p.d + piezasSVG(p.hijos || [], modo, clave) + "</g>";
  }).join("");
}
function rigSVG(def, modo, clave){ return def.fijo + piezasSVG(def.piezas, modo, clave); }
function cssEsquemas(){
  let css = "";
  const recorrer = (piezas, clave) => piezas.forEach(p => {
    const n = "pz-" + clave + "-" + p.id;
    css += "@keyframes kf-" + n + "{0%,14%,88%,100%{transform:none}46%,58%{transform:" + trCSS(p) + "}}" +
      "." + n + "{animation:kf-" + n + " 2.5s ease-in-out infinite}";
    recorrer(p.hijos || [], clave);
  });
  Object.keys(ESQ).forEach(k => recorrer(ESQ[k].rig().piezas, k));
  return css;
}
function esquemaSVG(k){
  const e = ESQ[k]; if(!e) return "";
  const def = e.rig(), caja = def.caja;
  const prop = (caja[3] - caja[1]) / (caja[2] - caja[0]);
  const altoLienzo = Math.round(Math.max(96, Math.min(200, 200 * prop)));
  const a = encuadre(caja, 200, altoLienzo);
  const altoPose = Math.round(Math.max(56, Math.min(120, 100 * prop)));
  const p = encuadre(caja, 98, altoPose, 3);
  const altoEst = altoPose + 22;
  return '<svg class="esq animado" viewBox="0 0 200 ' + altoLienzo + '" aria-hidden="true">' +
      '<g transform="translate(' + a.dx.toFixed(1) + " " + a.dy.toFixed(1) + ") scale(" + a.zoom.toFixed(3) + ')">' + rigSVG(def, "anim", k) + "</g></svg>" +
    '<svg class="esq estatico" viewBox="0 0 200 ' + altoEst + '" aria-hidden="true">' +
      '<g transform="translate(' + p.dx.toFixed(1) + " " + p.dy.toFixed(1) + ") scale(" + p.zoom.toFixed(3) + ')">' + rigSVG(def, "ini", k) + "</g>" +
      '<g transform="translate(' + (p.dx + 101).toFixed(1) + " " + p.dy.toFixed(1) + ") scale(" + p.zoom.toFixed(3) + ')">' + rigSVG(def, "fin", k) + "</g>" +
      '<text class="etq-esq" x="49" y="' + (altoEst - 6) + '">inicio</text><text class="etq-esq" x="150" y="' + (altoEst - 6) + '">fin</text></svg>';
}
/* demostración visual: imagen de banco abierto, si no esquema propio, y el
   video siempre va aparte (en el fundamento) */
function visualHTML(id){
  const x = ej(id); if(!x) return "";
  if(x.img) return '<div class="visual"><img src="media/ejercicios/' + x.img + '" alt="" onerror="imgFallo(this,\'' + id + '\')" onload="this.dataset.ok=1"></div>' +
    '<div class="procedencia" id="proc_' + id + '">Imagen: wger, CC BY-SA</div>';
  const svg = esquemaSVG(id);
  if(svg) return '<div class="visual">' + svg + '</div><div class="procedencia">Esquema propio</div>';
  return "";
}
function imgFallo(img, id){
  const svg = esquemaSVG(id), cont = img.parentElement;
  if(!cont) return;
  const p = $("#proc_" + id);
  if(svg){ cont.innerHTML = svg; if(p) p.textContent = "Esquema propio"; }
  else { cont.remove(); if(p) p.remove(); }
}
/* una <img> puede quedarse colgada sin disparar error (sin conexión, la
   petición no falla sino que nunca responde). A los 3 segundos se reintenta
   por fetch, que pasa por el service worker; si tampoco, cae al esquema. */
function vigilarImagenes(){
  document.querySelectorAll(".visual img").forEach(img => {
    if(img.dataset.vigilada) return;
    img.dataset.vigilada = "1";
    setTimeout(() => {
      if(img.dataset.ok || (img.complete && img.naturalWidth > 0) || !img.isConnected) return;
      const k = (img.getAttribute("onerror") || "").match(/'([^']+)'/);
      fetch(img.getAttribute("src")).then(r => r.ok ? r.blob() : Promise.reject())
        .then(b => { img.src = URL.createObjectURL(b); })
        .catch(() => { if(k) imgFallo(img, k[1]); });
    }, 3000);
  });
}

/* ============ 4. lógica ============ */
function pesoActual(){
  const h = DB.pesoCorporal;
  return h.length ? h[h.length - 1].kg : SEMILLA.pesoCorporal;
}
function pesoInicial(){ const h = DB.pesoCorporal; return h.length ? h[0].kg : SEMILLA.pesoCorporal; }
function pesoEn(fecha){
  /* el último peso registrado hasta esa fecha; si no hay, el más antiguo */
  const h = DB.pesoCorporal;
  if(!h.length) return SEMILLA.pesoCorporal;
  let kg = h[0].kg;
  h.forEach(p => { if(fechaISO(p.ts) <= fecha) kg = p.kg; });
  return kg;
}
function registrarPeso(kg){
  if(!num(kg)) return;
  const hoy = fechaISO();
  const i = DB.pesoCorporal.findIndex(p => fechaISO(p.ts) === hoy);
  const dato = {ts:hoyISO(), kg:num(kg)};
  if(i >= 0) DB.pesoCorporal[i] = dato; else DB.pesoCorporal.push(dato);
  DB.pesoCorporal.sort((a, b) => a.ts.localeCompare(b.ts));
  guardar();
}

/* ---- rotación global ----
   El día que sigue sale de la última sesión que avanzó la rotación: los días
   A-D y las ad hoc con reemplazaDia. Las ad hoc extra no cuentan. */
function diaSugerido(){
  for(let i = DB.sesiones.length - 1; i >= 0; i--){
    const s = DB.sesiones[i];
    const d = diaQueAvanza(s);
    if(d) return DIAS[(DIAS.indexOf(d) + 1) % 4];
  }
  return "A";
}
function diaQueAvanza(s){
  if(!s.adhoc) return DIAS.includes(s.dia) ? s.dia : null;
  const ad = adHocDe(s.adhoc);
  return (ad && DIAS.includes(ad.reemplazaDia)) ? ad.reemplazaDia : (s.reemplazaDia || null);
}
function seriesValidas(arr){ return (arr || []).filter(r => r && num(r.reps) > 0); }

/* ---- historial por ejercicio ----
   Cada entrada: {fecha, ts, modo, series, sesion}. Se filtra por modo cuando
   el ejercicio cambia de universo de carga entre casa y gimnasio. */
function historial(id, modo){
  const out = [];
  DB.sesiones.forEach(s => {
    const ser = seriesValidas(s.reg[id]);
    if(!ser.length) return;
    if(modo && !mismoUniverso(id, ser, modo)) return;
    out.push({fecha:s.fecha, ts:s.ts || s.fecha, modo:s.modo, series:ser, sesion:s});
  });
  return out;
}
/* dos series comparten universo si el ejercicio progresa igual en los dos
   modos (dominadas en casa y en el hotel son el mismo dato) o si el modo es el
   mismo */
function mismoUniverso(id, series, modo){
  const x = ej(id); if(!x || x.legado) return true;
  const p = x.prog || {};
  const modos = Object.keys(p);
  if(modos.length <= 1) return true;
  if(p.casa === p.gym) return true;
  const m = series[0] && series[0].modo ? series[0].modo : "casa";
  return m === modo;
}
function modosConDatos(id){
  const set = new Set();
  DB.sesiones.forEach(s => { if(seriesValidas(s.reg[id]).length) set.add(s.modo || "casa"); });
  return [...set];
}
function ultimaVez(id, modo){ const h = historial(id, modo); return h.length ? h[h.length - 1] : null; }

/* ---- formato de una serie ---- */
function fmtSerie(id, r){
  const p = progDe(id, r.modo || "casa");
  if(p === "tiempo") return num(r.reps) + " s";
  if(num(r.kg) > 0) return fmtNum(num(r.kg)) + " kg × " + num(r.reps);
  return String(num(r.reps));
}
function fmtSeries(id, series){ return series.map(r => fmtSerie(id, r)).join(", "); }
/* la carga de una serie para comparar y para el tonelaje */
function cargaSerie(id, r){
  const x = ej(id) || {};
  if(r.incompleta) return 0;   /* serie de mancuerna sin kilos anotados: no es cero, es desconocida */
  const kg = num(r.kg);
  if(kg > 0) return kg * num(r.reps);
  if(x.pc) return pesoEn(r.fecha || fechaISO()) * num(r.reps);
  return 0;
}
function tonelajeSesion(s){
  let t = 0;
  Object.keys(s.reg).forEach(id => seriesValidas(s.reg[id]).forEach(r => { t += cargaSerie(id, Object.assign({fecha:s.fecha}, r)); }));
  return t;
}
/* la "mejor serie" de una lista según el tipo de progresión */
function mejorSerie(id, series, modo){
  const p = progDe(id, modo || (series[0] && series[0].modo) || "casa");
  let mejor = null;
  series.forEach(r => {
    if(!mejor){ mejor = r; return; }
    if(p === "peso"){ if(num(r.kg) * num(r.reps) > num(mejor.kg) * num(mejor.reps)) mejor = r; }
    else if(p === "nivel"){
      const a = (r.nivel == null ? -1 : r.nivel), b = (mejor.nivel == null ? -1 : mejor.nivel);
      /* series con kilos (migradas de la v1) se comparan por kilos × reps */
      if(num(r.kg) > 0 && num(mejor.kg) > 0){ if(num(r.kg) * num(r.reps) > num(mejor.kg) * num(mejor.reps)) mejor = r; }
      else if(a > b || (a === b && num(r.reps) > num(mejor.reps))) mejor = r;
    }
    else if(num(r.reps) > num(mejor.reps)) mejor = r;
  });
  return mejor;
}
/* ¿esta serie supera todo lo anterior? récord por más peso, más reps al mismo
   peso o al mismo nivel, o más tiempo */
function esRecord(id, r, modo, antesDe){
  const h = historial(id, modo).filter(e => !antesDe || e.ts < antesDe);
  const previas = [];
  h.forEach(e => previas.push(...e.series));
  if(!previas.length) return false;
  const p = progDe(id, modo);
  if(p === "peso"){
    const kg = num(r.kg), reps = num(r.reps);
    const conKg = previas.filter(x => num(x.kg) > 0 && !x.incompleta);
    if(!conKg.length || !kg) return false;
    const maxKg = Math.max(...conKg.map(x => num(x.kg)));
    if(kg > maxKg) return true;
    const mismasKg = conKg.filter(x => num(x.kg) === kg);
    return mismasKg.length ? reps > Math.max(...mismasKg.map(x => num(x.reps))) : false;
  }
  if(p === "nivel"){
    const n = r.nivel == null ? -1 : r.nivel;
    const maxN = Math.max(...previas.map(x => x.nivel == null ? -1 : x.nivel));
    if(n > maxN) return true;
    const mismo = previas.filter(x => (x.nivel == null ? -1 : x.nivel) === n);
    return mismo.length ? num(r.reps) > Math.max(...mismo.map(x => num(x.reps))) : false;
  }
  return num(r.reps) > Math.max(...previas.map(x => num(x.reps)));
}

/* ---- criterio de ascenso ----
   Se cumple cuando la sesión trae al menos `s` series válidas al nivel actual
   con `r` o más repeticiones (o segundos). */
function cumpleCriterio(id, series){
  const nivel = nivelActual(id);
  const c = criterioDe(id, nivel);
  if(!c) return false;
  const enNivel = seriesValidas(series).filter(r => (r.nivel == null ? nivel : r.nivel) === nivel);
  return enNivel.filter(r => num(r.reps) >= c.r).length >= c.s;
}
function subirNivel(id){
  const esc = escaleraDe(id); if(!esc) return;
  const de = nivelActual(id);
  if(de >= esc.length - 1) return;
  DB.niveles[id] = de + 1;
  DB.ascensos.push({ej:id, de, a:de + 1, fecha:fechaISO()});
  guardar();
}

/* ---- la línea de sugerencia sobre los campos ----
   Sale de la última sesión del mismo ejercicio EN EL MISMO MODO. */
function sugerencia(cas, modo){
  const id = cas.id, x = ej(id);
  const p = progDe(id, modo);
  /* las series incompletas (mancuerna sin kilos, de la v1) no sirven de referencia */
  const hist = historial(id, modo).map(e => Object.assign({}, e, {series:e.series.filter(r => !r.incompleta)})).filter(e => e.series.length);
  const u = hist.length ? hist[hist.length - 1] : null;
  if(p === "nivel"){
    const nivel = nivelActual(id), nom = nombreNivel(id, nivel).toLowerCase();
    const c = criterioDe(id, nivel);
    if(!u) return {t:"Primera vez en este nivel (" + nom + "). Parte por " + cas.min + " y anota lo que salga.", lista:false};
    const enNivel = u.series.filter(r => (r.nivel == null ? nivel : r.nivel) === nivel);
    const vals = enNivel.length ? enNivel : u.series;
    const texto = vals.map(r => num(r.reps)).join(", ");
    const nomVez = enNivel.length ? nom : nombreNivel(id, vals[0].nivel == null ? nivel : vals[0].nivel).toLowerCase();
    if(c && cumpleCriterio(id, u.series)){
      const sig = nombreNivel(id, nivel + 1).toLowerCase();
      return {t:"Completaste " + c.s + "×" + c.r + " con " + nomVez + ". Toca <b>" + sig + "</b> y volver a " + cas.min + ".", lista:true};
    }
    const mejor = Math.max(...vals.map(r => num(r.reps)));
    const meta = Math.min(cas.max, mejor + 1);
    return {t:"Última vez: " + texto + (nomVez ? " con " + nomVez : "") + ". Apunta a <b>" + meta + "</b> en la primera.", lista:false};
  }
  if(p === "peso"){
    const uk = [...historial(id, modo)].reverse().find(e => e.series.some(r => num(r.kg) > 0));
    if(!uk){
      if(x.lastre && DB.lastre && u) return {t:"Primera vez con lastre. Última vez sin lastre: " + u.series.map(r => num(r.reps)).join(", ") + ". Cuelga poco (2 a 5 kg) y apunta a " + cas.min + ".", lista:false};
      return {t:"Primera vez en este modo. Elige un peso con el que llegues a " + cas.min + " con 2 repeticiones en reserva.", lista:false};
    }
    const conKg = uk.series.filter(r => num(r.kg) > 0);
    const kg = num(conKg[conKg.length - 1].kg);
    const reps = conKg.map(r => num(r.reps));
    const alTope = reps.every(r => r >= cas.max) && reps.length >= cas.series;
    const texto = fmtNum(kg) + " kg × " + reps.join(", ");
    if(alTope) return {t:"Última vez: " + texto + ". Todas al tope: <b>sube el peso</b> y vuelve a " + cas.min + ".", lista:true};
    return {t:"Última vez: " + texto + ". Mantén el peso y <b>suma una repetición</b>.", lista:false};
  }
  if(p === "tiempo"){
    if(!u) return {t:"Primera vez. Aguanta entre " + cas.min + " y " + cas.max + " segundos con buena forma.", lista:false};
    const mejor = Math.max(...u.series.map(r => num(r.reps)));
    return {t:"Última vez: " + u.series.map(r => num(r.reps) + " s").join(", ") + ". Objetivo <b>" + (mejor + 5) + " s</b>.", lista:false};
  }
  if(!u) return {t:"Primera vez. Anota " + (x.unidad || "repeticiones") + " completas con buena técnica.", lista:false};
  const mejor = Math.max(...u.series.map(r => num(r.reps)));
  return {t:"Última vez: " + u.series.map(r => num(r.reps)).join(", ") + ". Iguala o suma una.", lista:false};
}

/* ---- carga efectiva (peso corporal como carga) ----
   En los ejercicios de peso corporal, la carga es el peso del cuerpo por las
   repeticiones. Bajar de peso cambia la cuenta, y eso es lo que se hace visible. */
function cargaEfectivaHTML(id){
  const x = ej(id); if(!x || !x.pc) return "";
  const h = historial(id);
  if(!h.length) return "";
  const primera = h[0], ultima = h[h.length - 1];
  /* "hoy" se calcula con el peso corporal actual, aunque la última sesión sea
     de hace días: la cuenta que importa es cuánto carga cada repetición ahora */
  const pIni = pesoEn(primera.fecha), pHoy = pesoActual();
  const mejorHoy = mejorSerie(id, ultima.series);
  const mejorIni = mejorSerie(id, primera.series);
  if(!mejorHoy || !mejorIni) return "";
  const cargaHoy = pHoy * num(mejorHoy.reps), cargaIni = pIni * num(mejorIni.reps);
  const t = progDe(id) === "tiempo";
  const uni = t ? " s" : "";
  let msj = "Tu mejor serie de hoy movió <b>" + fmtNum(Math.round(cargaHoy)) + " kg</b> (" + num(mejorHoy.reps) + uni + " a " + fmtKg(pHoy) + ").";
  if(primera !== ultima) msj += " La primera vez fueron " + fmtNum(Math.round(cargaIni)) + " kg (" + num(mejorIni.reps) + uni + " a " + fmtKg(pIni) + ").";
  const dif = pIni - pHoy;
  if(Math.abs(dif) >= 0.5 && !t){
    msj += dif > 0
      ? " Pesas " + fmtKg(dif) + " menos que al partir: cada repetición carga " + fmtKg(dif) + " menos, y ese descuento lo puso la dieta."
      : " Pesas " + fmtKg(-dif) + " más que al partir: cada repetición carga " + fmtKg(-dif) + " más, así que igualar las repeticiones ya es avanzar.";
  }
  return '<div class="carga-ef">' + msj + "</div>";
}

/* ---- volumen semanal por grupo ---- */
function seriesPorGrupo(lunes){
  const fin = sumarDias(lunes, 6);
  const cuenta = {};
  GRUPOS.forEach(g => { cuenta[g] = 0; });
  DB.sesiones.forEach(s => {
    if(s.fecha < lunes || s.fecha > fin) return;
    Object.keys(s.reg).forEach(id => {
      const x = ej(id); if(!x || !x.g || cuenta[x.g] == null) return;
      cuenta[x.g] += seriesValidas(s.reg[id]).length;
    });
  });
  return cuenta;
}
function semanasEntrenando(){
  const set = new Set(DB.sesiones.map(s => lunesDe(s.fecha)));
  return set.size;
}
function semanasSeguidas(){
  const lunes = [...new Set(DB.sesiones.map(s => lunesDe(s.fecha)))].sort();
  if(!lunes.length) return 0;
  let n = 1;
  for(let i = lunes.length - 1; i > 0; i--){
    if(diasEntre(lunes[i - 1], lunes[i]) === 7) n++; else break;
  }
  /* la semana actual sin registro todavía no corta la cuenta */
  const hoyL = lunesDe(fechaISO());
  const ult = lunes[lunes.length - 1];
  if(ult !== hoyL && diasEntre(ult, hoyL) > 7) return 0;
  return n;
}
function pausadosLista(){

}

}

/* ============ 5. la sesión en curso ============ */
let sel = {dia:null, adhoc:null};   // qué sesión se muestra en HOY
function pendiente(){ return DB.pendiente; }
function nuevaPendiente(){
  DB.pendiente = {dia:sel.dia, adhoc:sel.adhoc, modo:DB.modo, inicioISO:hoyISO(), reg:{}, rir:{}};
  guardar();
}
function asegurarPendiente(){
  const p = pendiente();
  if(!p || p.dia !== sel.dia || p.adhoc !== sel.adhoc){ nuevaPendiente(); }
  return DB.pendiente;
}
function serieDe(id, i){
  const p = pendiente(); if(!p || !p.reg[id]) return null;
  return p.reg[id][i] || null;
}
/* guarda la serie i de un ejercicio desde los campos de la lista */
function anotarSerie(id, i){
  const p = asegurarPendiente();
  const prog = progDe(id, p.modo);
  const reps = num(($("#r_" + id + "_" + i) || {}).value);
  const kgIn = $("#k_" + id + "_" + i);
  const nivIn = $("#n_" + id + "_" + i);
  let kg = prog === "peso" ? num((kgIn || {}).value) : 0;
  /* peso no puesto: hereda el de la serie anterior o el de la última vez */
  if(prog === "peso" && reps > 0 && !kg){
    kg = kgHeredado(id, i, p.modo);
    if(kgIn && kg) kgIn.value = fmtNum(kg);
  }
  const nivLeido = nivIn ? parseInt(nivIn.value, 10) : NaN;
  const nivel = prog === "nivel" ? (Number.isInteger(nivLeido) ? nivLeido : nivelActual(id)) : null;
  const r = guardarSerieValor(id, i, kg, reps, nivel, false);
  const dot = $("#rec_" + id + "_" + i); if(dot) dot.classList.toggle("si", !!(r && r.rec));
  const inp = $("#r_" + id + "_" + i); if(inp) inp.classList.toggle("hecha", reps > 0);
  if(reps > 0){
    abrirSerieSiguiente(id, i);
    const x = ej(id);
    if(x && x.descanso && !lget("sinDescanso", false)) iniciarDescanso(x.descanso, x.n);
  }
  actualizarBotonGuardar();
}
/* el registro de verdad: lo usan la lista y la sesión guiada. `enGuia` evita
   arrancar el descanso de la lista (la guía lo maneja ella). */
function guardarSerieValor(id, i, kg, reps, nivel, enGuia){
  const p = asegurarPendiente();
  const prog = progDe(id, p.modo);
  if(prog !== "peso") kg = 0;
  if(prog !== "nivel") nivel = null;
  p.reg[id] = p.reg[id] || [];
  while(p.reg[id].length <= i) p.reg[id].push(null);
  const previa = p.reg[id][i] || {};
  const r = {kg, reps, nivel, modo:p.modo, rir:previa.rir == null ? null : previa.rir, ts:previa.ts || hoyISO()};
  /* el descanso real: lo que pasó desde la serie anterior del mismo ejercicio,
     menos lo que dura la serie. Va en la serie junto a kg, reps y RIR, porque
     60 segundos en dominadas en vez de 150 explican menos repeticiones sin
     que haya menos fuerza */
  const ant = i > 0 ? p.reg[id][i - 1] : null;
  if(previa.desc != null) r.desc = previa.desc;
  else if(ant && ant.ts && reps > 0){
    const bruto = Math.round((new Date(r.ts) - new Date(ant.ts)) / 1000) - trabajoSerieSeg(id, r);
    if(bruto >= 0 && bruto < 900) r.desc = Math.round(bruto / 5) * 5;
  }
  p.reg[id][i] = reps > 0 ? r : null;
  if(reps > 0 && esRecord(id, r, p.modo)) r.rec = 1;
  if(reps > 0 && !p.primeraSerieISO) p.primeraSerieISO = r.ts;
  aplicarRIR(id);
  guardar();
  if(reps > 0) avisoDescansoCorto(id, r);
  return reps > 0 ? r : null;
}
/* menos repeticiones con menos descanso no es retroceso: se avisa antes de
   que lo anote como mala sesión */
function avisoDescansoCorto(id, r){
  const x = ej(id), caja = $("#notad_" + id);
  if(!caja) return;
  const sug = x && x.descanso ? x.descanso : 0;
  if(sug >= 120 && r && r.desc != null && r.desc < sug * 0.7){
    caja.innerHTML = "Descanso de " + r.desc + " s (sugerido " + sug + "). Menos repeticiones con menos descanso no es retroceso: es el descanso.";
    caja.hidden = false;
  }
}
/* ---- tiempos ----
   Cuánto dura una serie (referente, no plazo) y cuánto un ejercicio o una
   sesión: series × (trabajo + descanso). Con historial se usa el tiempo real
   promedio del ejercicio, que se calibra solo. */
function trabajoSerieSeg(id, r){
  const x = ej(id) || {};
  const p = progDe(id, (r && r.modo) || DB.modo);
  if(p === "tiempo") return r && num(r.reps) ? num(r.reps) : (x.max || 30);
  if(x.unidad === "rondas") return (r && num(r.reps) ? num(r.reps) : (x.max || 8)) * 30;
  return (r && num(r.reps) ? num(r.reps) : (x.max || 10)) * 3;
}
function estimadoEjSeg(cas, modo){
  const x = ej(cas.id) || {};
  const real = tiempoRealEjSeg(cas.id, modo);
  if(real) return real;
  const p = progDe(cas.id, modo);
  const trabajo = p === "tiempo" ? cas.max : x.unidad === "rondas" ? cas.max * 30 : cas.max * 3;
  const desc = x.unidad === "rondas" ? cas.max * 90 : (x.descanso || 60);
  const lados = cas.lado ? 2 : 1;
  return cas.series * (trabajo * lados + desc);
}
/* tiempo real de un ejercicio en una sesión: de la primera a la última serie
   anotada, más una serie de trabajo y un descanso (la última serie no lleva
   marca de fin). Solo cuenta con dos o más series con marca de tiempo. */
function tiempoRealEjSesion(id, s){
  const ser = seriesValidas(s.reg[id]).filter(r => r.ts);
  if(ser.length < 2) return 0;
  const span = (new Date(ser[ser.length - 1].ts) - new Date(ser[0].ts)) / 1000;
  if(span <= 0 || span > 3600) return 0;
  const descProm = ser.filter(r => r.desc != null).reduce((a, r, _, arr) => a + r.desc / arr.length, 0) || (ej(id) || {}).descanso || 60;
  return Math.round(span + trabajoSerieSeg(id, ser[0]) + descProm);
}
function tiempoRealEjSeg(id, modo){
  const vals = historial(id, modo).slice(-5).map(e => tiempoRealEjSesion(id, e.sesion)).filter(Boolean);
  if(!vals.length) return 0;
  return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
}
function estimadoSesionSeg(cas, modo){
  return cas.filter(c => !DB.pausados[c.id]).reduce((a, c) => a + estimadoEjSeg(c, modo), 0);
}
function fmtMin(seg){ return Math.max(1, Math.round(seg / 60)) + " min"; }
/* promedio de duración real por día de la rotación y por modo (vista Semana) */
function duracionPromedio(dia, modo){
  const ses = DB.sesiones.filter(s => !s.adhoc && s.dia === dia && s.modo === modo && s.duracion > 0);
  if(!ses.length) return null;
  return {n:ses.length, seg:Math.round(ses.reduce((a, s) => a + s.duracion, 0) / ses.length)};
}
function alternarLastre(){
  DB.lastre = !DB.lastre; guardar();
  aviso(DB.lastre ? "Lastre activo: dominadas y fondos progresan por kilos. La escalera queda archivada." : "Sin lastre: dominadas y fondos vuelven a la escalera.");
}
function cambiarNivelSerie(id, i){
  const p = asegurarPendiente();
  const r = serieDe(id, i);
  const nivIn = $("#n_" + id + "_" + i);
  if(r && nivIn){ r.nivel = parseInt(nivIn.value, 10); guardar(); }
}
function marcarRIR(id, v){
  const p = asegurarPendiente();
  p.rir[id] = p.rir[id] === v ? null : v;
  aplicarRIR(id);
  guardar();
  document.querySelectorAll("#rir_" + id + " button").forEach(b => b.classList.toggle("sel", parseInt(b.dataset.v, 10) === p.rir[id]));
}
/* el RIR vive en la última serie válida y en ninguna otra, aunque después se
   agregue o se borre una serie */
function aplicarRIR(id){
  const p = pendiente(); if(!p || !p.reg[id]) return;
  const ser = seriesValidas(p.reg[id]);
  ser.forEach(r => { r.rir = null; });
  if(ser.length) ser[ser.length - 1].rir = p.rir[id] == null ? null : p.rir[id];
}
function kgHeredado(id, i, modo){
  const p = pendiente();
  if(p && p.reg[id]) for(let j = i - 1; j >= 0; j--) if(p.reg[id][j] && num(p.reg[id][j].kg)) return num(p.reg[id][j].kg);
  const u = ultimaVez(id, modo);
  if(u){ const con = u.series.filter(r => num(r.kg)); if(con.length) return num(con[con.length - 1].kg); }
  return 0;
}
/* las series se abren de a una para que la tarjeta no sea un muro de casillas
   vacías; hay que abrir la siguiente en el sitio, sin repintar, porque
   repintar mientras se escribe cierra el teclado */
function abrirSerieSiguiente(id, i){
  const cont = $("#series_" + id); if(!cont) return;
  const filas = cont.querySelectorAll(".serie");
  const sig = filas[i + 1];
  if(!sig || sig.querySelector("input")) return;
  const cas = cont.dataset.cas ? JSON.parse(cont.dataset.cas) : null;
  if(cas) sig.outerHTML = serieHTML(cas, i + 1, filas.length);
}
function seriesAnotadas(){
  const p = pendiente(); if(!p) return 0;
  let n = 0; Object.keys(p.reg).forEach(id => { n += seriesValidas(p.reg[id]).length; });
  return n;
}
function actualizarBotonGuardar(){
  const b = $("#btnGuardar"); if(!b) return;
  b.disabled = seriesAnotadas() === 0;
}
function descartarPendiente(){
  abrirModal("Descartar la sesión", "Se borran las series anotadas hoy. El historial no se toca.",
    [["Descartar", () => { DB.pendiente = null; verLista = false; guardar(); cerrarModal(); document.body.classList.remove("con-descanso", "en-playback"); pintar(); }], ["Volver", cerrarModal]]);
}

/* ---- descanso entre series ---- */
let tickInt = null, audioCtx = null, wakeLock = null;
function lget(k, def){ const v = leerCrudo("fz2_" + k); if(v == null) return def; try{ return JSON.parse(v); }catch(e){ return def; } }
function lset(k, v){ escribirCrudo("fz2_" + k, JSON.stringify(v)); }
function iniciarAudio(){ try{ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
function beep(veces){
  if(!lget("sonido", true) || !audioCtx) return;
  try{
    for(let i = 0; i < veces; i++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = 880;
      const t0 = audioCtx.currentTime + i * 0.22;
      o.start(t0); g.gain.setValueAtTime(0.15, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
      o.stop(t0 + 0.16);
    }
  }catch(e){}
}
function vibrar(patron){ try{ if(navigator.vibrate) navigator.vibrate(patron); }catch(e){} }
async function pedirWakeLock(){ try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} }
function soltarWakeLock(){ try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){} }
function iniciarDescanso(seg, nombre){
  iniciarAudio();
  const p = asegurarPendiente();
  p.descansoFinISO = new Date(pbAhora() + seg * 1000).toISOString();
  p.descansoDe = nombre || "";
  p.descansoAviso = false;
  guardar();
  document.body.classList.add("con-descanso");
  pedirWakeLock();
  tick();
}
function ajustarDescanso(seg){
  const p = pendiente(); if(!p || !p.descansoFinISO) return;
  p.descansoFinISO = new Date(new Date(p.descansoFinISO).getTime() + seg * 1000).toISOString();
  p.descansoAviso = false;
  guardar(); tick();
}
function terminarDescanso(){
  const p = pendiente(); if(!p) return;
  p.descansoFinISO = null; guardar();
  if(!enPlayback()){ document.body.classList.remove("con-descanso"); soltarWakeLock(); }
}
function descansoManual(id){
  const x = ej(id); if(!x) return;
  const p = pendiente();
  if(p && p.descansoFinISO) terminarDescanso(); else iniciarDescanso(x.descanso || 90, x.n);
}
/* cuánto lleva la sesión, descontando las pausas */
function tiempoSesionMs(p, desde){
  const ini = desde || p.primeraSerieISO || p.inicioISO;
  if(!ini) return 0;
  return pbAhora() - new Date(ini).getTime() - (p.msPausados || 0);
}
let barraModo = "";
function pintarBarra(modo, p){
  /* los botones se reescriben solo al cambiar de modo: reescribirlos cada
     medio segundo dejaría los toques en el aire */
  if(barraModo === modo) return;
  barraModo = modo;
  $("#bCtl").innerHTML = modo === "guia"
    ? '<button id="btnPausa" onclick="pausarReanudar()">Pausa</button><button onclick="terminarPlayback()">Salir</button>'
    : '<button onclick="ajustarDescanso(-15)">−15</button><button onclick="ajustarDescanso(30)">+30</button><button onclick="terminarDescanso()">Listo</button>';
}
function tick(){
  const p = pendiente();
  const rel = $("#relojSesion");
  if(rel && p && p.primeraSerieISO) rel.textContent = fmtReloj(tiempoSesionMs(p));
  const guia = typeof enPlayback === "function" && enPlayback();
  document.body.classList.toggle("en-playback", guia);
  if(guia){
    /* en la guía la barra de abajo lleva el reloj de la sesión completa */
    document.body.classList.add("con-descanso");
    pintarBarra("guia", p);
    $("#bTit").textContent = "Sesión completa" + (p.pausadoEn ? " · en pausa" : "");
    $("#bInfo").textContent = tituloSesion(p) + " · " + seriesAnotadas() + (seriesAnotadas() === 1 ? " serie" : " series");
    $("#bReloj").textContent = fmtReloj(tiempoSesionMs(p, p.inicioISO));
    $("#bReloj").className = "barra-reloj" + (p.pausadoEn ? " pasado" : "");
    const bp = $("#btnPausa"); if(bp) bp.textContent = p.pausadoEn ? "Seguir" : "Pausa";
    refrescarPB();
    return;
  }
  const hay = !!(p && p.descansoFinISO);
  document.body.classList.toggle("con-descanso", hay);
  if(!hay) return;
  pintarBarra("descanso", p);
  const falta = new Date(p.descansoFinISO).getTime() - pbAhora();
  $("#bReloj").textContent = fmtReloj(falta);
  $("#bReloj").className = "barra-reloj" + (falta < 0 ? " pasado" : "");
  $("#bTit").textContent = falta < 0 ? "Descanso cumplido" : "Descanso" + (p.pausadoEn ? " · en pausa" : "");
  $("#bInfo").textContent = p.descansoDe || "";
  if(falta <= 0 && !p.descansoAviso){ p.descansoAviso = true; guardar(); beep(2); vibrar([120, 80, 120]); }
  /* pasados 2 minutos del fin, la barra se cierra sola */
  if(falta < -120000) terminarDescanso();
}
document.addEventListener("visibilitychange", () => { if(!document.hidden) tick(); });

/* ---- guardar la sesión: registro, propuestas de nivel y logros ---- */
const LOGROS = [
 {id:"arranque", n:"Primera sesión", c:"Terminar la primera sesión", t:x => x.nSes >= 1},
 {id:"semana_llena", n:"Cuatro de cuatro", c:"Los cuatro días de la rotación en una misma semana", t:x => x.semanaLlena},
 {id:"racha_8", n:"Ocho seguidas", c:"8 sesiones en 4 semanas seguidas", t:x => x.semanasSeguidas >= 4 && x.nSes >= 8},
 {id:"sesiones_25", n:"Veinticinco", c:"25 sesiones terminadas", t:x => x.nSes >= 25},
 {id:"sesiones_50", n:"Cincuenta", c:"50 sesiones terminadas", t:x => x.nSes >= 50},
 {id:"sesiones_100", n:"Cien", c:"100 sesiones terminadas", t:x => x.nSes >= 100},
 {id:"primer_record", n:"Primer récord", c:"Superar por primera vez una marca propia", t:x => x.nRec >= 1},
 {id:"records_10", n:"Diez récords", c:"Acumular 10 récords", t:x => x.nRec >= 10},
 {id:"techo", n:"Tope de ventana", c:"Llegar al tope del rango en todas las series de un ejercicio", t:x => x.techo},
 {id:"primer_nivel", n:"Primer escalón", c:"Subir de nivel por primera vez", t:x => x.nNiveles >= 1},
 {id:"dominada_libre", n:"Primera dominada libre", c:"Llegar al nivel de dominada libre", t:x => x.domLibre},
 {id:"gym", n:"Dos universos", c:"Entrenar en casa y en el gimnasio", t:x => x.dosModos},
 {id:"tonelada_10", n:"Diez toneladas", c:"10.000 kg movidos en total", t:x => x.ton >= 10000},
 {id:"tonelada_50", n:"Cincuenta toneladas", c:"50.000 kg movidos en total", t:x => x.ton >= 50000}
];
function nRecordsTotal(){
  let n = 0;
  DB.sesiones.forEach(s => Object.keys(s.reg).forEach(id => seriesValidas(s.reg[id]).forEach(r => { if(r.rec) n++; })));
  return n;
}
function statsLogros(sesionNueva){
  const nSes = DB.sesiones.length;
  const lunes = lunesDe(sesionNueva.fecha);
  const dias = new Set(DB.sesiones.filter(s => lunesDe(s.fecha) === lunes).map(diaQueAvanza).filter(Boolean));
  let techo = false;
  const cas = casillasDe(sesionNueva, sesionNueva.modo);
  cas.forEach(c => {
    const ser = seriesValidas(sesionNueva.reg[c.id]);
    if(ser.length >= c.series && ser.every(r => num(r.reps) >= c.max) && !c.maxLibre) techo = true;
  });
  let ton = 0; DB.sesiones.forEach(s => { ton += tonelajeSesion(s); });
  return {nSes, semanaLlena:dias.size >= 4, semanasSeguidas:semanasSeguidas(), nRec:nRecordsTotal(), techo,
    nNiveles:DB.ascensos.length, domLibre:nivelActual("dominadas") >= 6, dosModos:new Set(DB.sesiones.map(s => s.modo)).size >= 2, ton};
}
function guardarSesion(){
  const p = pendiente();
  if(!p || !seriesAnotadas()){ aviso("No hay ninguna serie anotada."); return; }
  const reg = {};
  Object.keys(p.reg).forEach(id => { const s = seriesValidas(p.reg[id]); if(s.length) reg[id] = s; });
  const ad = p.adhoc ? adHocDe(p.adhoc) : null;
  if(p.pausadoEn) pausarReanudar();
  const ses = {fecha:fechaISO(), ts:hoyISO(), dia:p.dia, modo:p.modo, adhoc:p.adhoc || null, reg,
    duracion:Math.round(tiempoSesionMs(p) / 1000)};
  if(ad && DIAS.includes(ad.reemplazaDia)) ses.reemplazaDia = ad.reemplazaDia;
  /* récords y volumen se evalúan contra el historial ANTERIOR a esta sesión */
  const logros = [];
  Object.keys(reg).forEach(id => {
    const x = ej(id); if(!x) return;
    reg[id].forEach(r => { delete r.rec; if(esRecord(id, r, p.modo)) r.rec = 1; });
    if(cumpleCriterio(id, reg[id]) && escaleraDe(id) && nivelActual(id) < escaleraDe(id).length - 1){
      logros.push({tipo:"nivel", id, de:nivelActual(id), a:nivelActual(id) + 1,
        n:"Completaste el criterio de " + x.n.toLowerCase() + ": " + textoCriterio(id, nivelActual(id)) + " con " + nombreNivel(id, nivelActual(id)).toLowerCase() + ".",
        pregunta:"¿Subes a " + nombreNivel(id, nivelActual(id) + 1).toLowerCase() + "?"});
    }
    /* adaptación: la misma marca con menos descanso. Ningún récord la captura. */
    const prevEj = ultimaVez(id, p.modo);
    const descHoy = reg[id].filter(r => r.desc != null).map(r => r.desc);
    if(prevEj && descHoy.length){
      const descPrev = prevEj.series.filter(r => r.desc != null).map(r => r.desc);
      if(descPrev.length){
        const promHoy = descHoy.reduce((a, b) => a + b, 0) / descHoy.length, promPrev = descPrev.reduce((a, b) => a + b, 0) / descPrev.length;
        const prog = progDe(id, p.modo);
        const mHoy = mejorSerie(id, reg[id], p.modo), mPrev = mejorSerie(id, prevEj.series, p.modo);
        const igualOMejor = prog === "peso" ? num(mHoy.kg) * num(mHoy.reps) >= num(mPrev.kg) * num(mPrev.reps)
          : ((mHoy.nivel == null ? 0 : mHoy.nivel) >= (mPrev.nivel == null ? 0 : mPrev.nivel) && num(mHoy.reps) >= num(mPrev.reps));
        if(igualOMejor && promHoy <= promPrev - 20)
          logros.push({tipo:"descanso", id, n:x.n, detalle:"Misma marca con " + Math.round(promHoy) + " s de descanso donde antes necesitabas " + Math.round(promPrev) + ". Eso es adaptación, y ningún récord la captura."});
      }
    }
    const recs = reg[id].filter(r => r.rec);
    if(recs.length){
      const m = mejorSerie(id, recs, p.modo);
      logros.push({tipo:"record", id, n:x.n, detalle:fmtSerie(id, m) + (m.nivel != null && progDe(id, p.modo) === "nivel" ? " · " + nombreNivel(id, m.nivel).toLowerCase() : "") + (p.modo === "gym" ? " · gimnasio" : "")});
    }
    if(x.pc){
      const h = historial(id);
      if(h.length){
        const hoyM = mejorSerie(id, reg[id]), cHoy = pesoActual() * num(hoyM.reps);
        let mejorPrev = 0;
        h.forEach(e => e.series.forEach(r => { mejorPrev = Math.max(mejorPrev, pesoEn(e.fecha) * num(r.reps)); }));
        if(cHoy > mejorPrev && !recs.length) logros.push({tipo:"carga", id, n:x.n, detalle:"Mejor carga efectiva: " + fmtNum(Math.round(cHoy)) + " kg movidos en una serie (" + num(hoyM.reps) + " a " + fmtKg(pesoActual()) + ")."});
      }
    }
  });
  /* volumen contra la última vez que hizo este día en este modo */
  const prevMismoDia = [...DB.sesiones].reverse().find(s => s.modo === p.modo && (p.adhoc ? s.adhoc === p.adhoc : (!s.adhoc && s.dia === p.dia)));
  const tonHoy = tonelajeSesion(ses);
  if(prevMismoDia){
    const tonPrev = tonelajeSesion(prevMismoDia);
    if(tonPrev && tonHoy > tonPrev) logros.push({tipo:"volumen", n:"Más trabajo que la última vez", detalle:fmtNum(Math.round(tonHoy)) + " kg contra " + fmtNum(Math.round(tonPrev)) + " kg la vez pasada (" + Math.round((tonHoy / tonPrev - 1) * 100) + " % más)."});
  }
  DB.sesiones.push(ses);
  DB.sesiones.sort((a, b) => (a.fecha + (a.ts || "")).localeCompare(b.fecha + (b.ts || "")));
  DB.pendiente = null;
  verLista = false;
  document.body.classList.remove("en-playback");
  const st = statsLogros(ses);
  const nuevos = [];
  LOGROS.forEach(l => { if(!DB.logros[l.id] && l.t(st)){ DB.logros[l.id] = fechaISO(); nuevos.push(l); } });
  nuevos.forEach(l => logros.push({tipo:"constancia", n:l.n, detalle:l.c}));
  logros.push({tipo:"acumulado", n:"Acumulado", detalle:fmtNum(Math.round(st.ton)) + " kg movidos desde el inicio · " + st.nSes + " sesiones · " + semanasEntrenando() + " semanas"});
  guardar();
  document.body.classList.remove("con-descanso");
  soltarWakeLock();
  vibrar(120);
  mostrarCierre(ses, logros, st);
}
const ORDEN_LOGRO = {nivel:0, record:1, carga:2, descanso:3, volumen:4, constancia:5, acumulado:6};
const ETQ_LOGRO = {nivel:"Subida de nivel", record:"Récord", carga:"Carga efectiva", descanso:"Adaptación", volumen:"Volumen", constancia:"Constancia", acumulado:"Acumulado"};
function fraseCierre(n){
  const f = ["Sesión " + n + ". Registrada.", "Nada espectacular, pero fuiste. Eso es lo que cuenta.", "Lo difícil era partir. Ya está hecho.",
    "El plan decía hoy. Se cumplió hoy.", "Un ladrillo más.", "Constancia sobre intensidad. Vas bien.", "Sin épica. Con registro.",
    "El cuerpo toma nota, aunque todavía no se note.", "Hecho. El resto del día corre solo."];
  return f[Math.floor(Math.random() * f.length)];
}
function mostrarCierre(ses, logros, st){
  logros.sort((a, b) => ORDEN_LOGRO[a.tipo] - ORDEN_LOGRO[b.tipo]);
  const nSeries = Object.keys(ses.reg).reduce((a, id) => a + ses.reg[id].length, 0);
  $("#cierreInt").innerHTML =
    '<div class="etq">Sesión guardada · ' + esc(tituloSesion(ses)) + " · " + (ses.modo === "gym" ? "gimnasio" : "casa") + "</div>" +
    '<div class="cierre-frase">' + fraseCierre(st.nSes) + "</div>" +
    '<div class="cierre-datos">' +
      '<div class="kpi"><div class="etq">Sesiones</div><div class="num">' + st.nSes + "</div></div>" +
      '<div class="kpi"><div class="etq">Series</div><div class="num">' + nSeries + "</div></div>" +
      '<div class="kpi"><div class="etq">Minutos</div><div class="num">' + Math.round((ses.duracion || 0) / 60) + "</div></div>" +
    "</div>" +
    logros.map((l, i) => {

function enfocarCampoPB(paso){

/* el valor que queda anotado al apretar el check: lo de la vez pasada, no el
   tope del rango, para que la curva no mienta si no se corrige */
function valorSugeridoPB(paso){
  const p = pendiente(), c = paso.c, prog = progDe(c.id, p.modo);
  const hist = historial(c.id, p.modo).map(e => Object.assign({}, e, {series:e.series.filter(r => !r.incompleta)})).filter(e => e.series.length);
  const u = hist.length ? hist[hist.length - 1] : null;
  const previa = paso.i > 0 ? serieDe(c.id, paso.i - 1) : null;
  if(prog === "tiempo") return {kg:0, reps: previa ? num(previa.reps) : u ? Math.max(...u.series.map(r => num(r.reps))) : c.min, nivel:null};
  if(prog === "peso") return {kg: kgHeredado(c.id, paso.i, p.modo), reps: previa ? num(previa.reps) : u ? num(u.series[0].reps) : c.min, nivel:null};
  const niv = nivelActual(c.id);
  const enNivel = u ? u.series.filter(r => (r.nivel == null ? niv : r.nivel) === niv) : [];
  return {kg:0, reps: previa ? num(previa.reps) : enNivel.length ? num(enNivel[0].reps) : c.min, nivel: prog === "nivel" ? niv : null};
}
function pbCheck(){
  const p = pendiente(); if(!p || !p.pb) return;
  const {pasos, i, paso} = pasoActualPB();
  if(!paso) return;
  iniciarAudio();
  if(paso.tipo === "prep"){ pbIr(i + 1); return; }
  const v = valorSugeridoPB(paso);
  if(esDeTiempo(paso) && p.pb.ejIniISO){
    const corrido = Math.round((pbAhora() - new Date(p.pb.ejIniISO).getTime()) / 1000);
    if(corrido > 0) v.reps = corrido;
  }
  if(!serieDe(paso.c.id, paso.i)) guardarSerieValor(paso.c.id, paso.i, v.kg, v.reps, v.nivel, true);
  vibrar(60);
  p.pb.ejIniISO = null; guardar();
  if(i + 1 >= pasos.length){ pbIr(i + 1); return; }
  const x = ej(paso.c.id);
  const sig = pasos[i + 1];
  /* entre ejercicios el descanso es el del que termina; si no tiene, uno breve */
  iniciarDescanso(x.descanso || 60, x.n);
  pintarPlayback();
}
function pbEmpezarEj(){ const p = pendiente(); if(!p || !p.pb) return; iniciarAudio(); p.pb.ejIniISO = hoyISO(); guardar(); pintarPlayback(); }
function pbListo(){ const p = pendiente(); if(!p || !p.pb) return; const {i} = pasoActualPB(); pbIr(i + 1); }
function pbAtras(){ const p = pendiente(); if(!p || !p.pb) return; const {i} = pasoActualPB(); pbIr(Math.max(0, i - 1)); }
function pbSaltar(){ const p = pendiente(); if(!p || !p.pb) return; const {i} = pasoActualPB(); pbIr(i + 1); }
function pbIr(idx){
  const p = pendiente(); if(!p || !p.pb) return;
  const pasos = pasosPB();
  p.pb.idx = Math.max(0, Math.min(pasos.length, idx));
  /* moverse de paso corta el descanso: si no, queda uno corriendo por detrás */
  p.descansoFinISO = null;
  const paso = pasos[p.pb.idx];
  p.pb.ejIniISO = (paso && (paso.tipo === "prep" || !esDeTiempo(paso))) ? hoyISO() : null;
  p.pb.avisoEj = false;
  guardar();
  document.body.classList.remove("con-descanso");
  pintarPlayback();
}
function pbGuardarCampos(){
  const p = pendiente(); if(!p || !p.pb) return;
  const {paso} = pasoActualPB();
  if(!paso || paso.tipo !== "serie") return;
  const c = paso.c, prog = progDe(c.id, p.modo);
  const reps = num(($("#pbReps") || {}).value);
  const kg = prog === "peso" ? num(($("#pbKg") || {}).value) : 0;
  const nivIn = $("#pbNivel");
  const nivel = prog === "nivel" ? (nivIn && Number.isInteger(parseInt(nivIn.value, 10)) ? parseInt(nivIn.value, 10) : nivelActual(c.id)) : null;
  if(!reps) return;
  const r = guardarSerieValor(c.id, paso.i, kg, reps, nivel, true);
  const caja = $(".pb-hecho");
  if(caja && r && r.rec && !caja.innerHTML.includes("pb-rec")) caja.innerHTML += ' <span class="pb-rec">● récord</span>';
}
/* pausa: congela el reloj de sesión y el descanso */
function pausarReanudar(){
  const p = pendiente(); if(!p) return;
  if(p.pausadoEn){
    const ms = Date.now() - new Date(p.pausadoEn).getTime();
    p.msPausados = (p.msPausados || 0) + ms;
    if(p.descansoFinISO) p.descansoFinISO = new Date(new Date(p.descansoFinISO).getTime() + ms).toISOString();
    if(p.pb && p.pb.ejIniISO) p.pb.ejIniISO = new Date(new Date(p.pb.ejIniISO).getTime() + ms).toISOString();
    p.pausadoEn = null;
  } else p.pausadoEn = hoyISO();
  guardar(); tick();
  if(enPlayback()) pintarPlayback();
}
function terminarPlayback(){
  abrirModal("Salir de la sesión guiada", "Lo anotado se conserva en la lista. Puedes guardar la sesión desde ahí o volver a la guía cuando quieras.",
    [["Salir a la lista", () => { const p = pendiente(); if(p){ p.pb = null; p.pausadoEn = null; guardar(); } verLista = false; cerrarModal(); pintar(); }], ["Volver", cerrarModal]]);
}
/* los relojes se refrescan cada tick sin repintar, para no botar el teclado */
function refrescarPB(){
  const p = pendiente(); if(!p || !p.pb || verLista) return;
  const {pasos, i, paso} = pasoActualPB();
  const firma = i + "|" + (p.descansoFinISO && paso && paso.tipo === "serie" ? "d" : "t") + "|" + (p.pb.ejIniISO ? "1" : "0") + "|" + (p.pausadoEn ? "p" : "");
  if(firma !== pbFirma){ pintarPlayback(); return; }
  const rel = $("#pbReloj"); if(!rel || !paso) return;
  if(p.descansoFinISO){
    const falta = new Date(p.descansoFinISO).getTime() - pbAhora();
    rel.textContent = fmtReloj(Math.max(0, falta));
    if(falta <= 0 && !p.pausadoEn){
      /* el descanso termina pasando solo al siguiente paso */
      beep(1); vibrar(150);
      pbIr(i + 1);
    }
    return;
  }
  if(!p.pb.ejIniISO) return;
  const corrido = pbAhora() - new Date(p.pb.ejIniISO).getTime();
  const falta = estimadoPasoMs(paso) - corrido;
  rel.textContent = fmtReloj(Math.abs(falta));
  rel.classList.toggle("pasado", falta < 0);
  /* al llegar a cero no pasa nada, salvo en los de tiempo: ahí el tiempo es el ejercicio */
  if(esDeTiempo(paso) && falta <= 0 && !p.pb.avisoEj){ p.pb.avisoEj = true; guardar(); beep(1); vibrar(150); }
}

/* ============ 6. vistas ============ */
let vista = "hoy";
function irVista(v){ vista = v; pintar(); window.scrollTo(0, 0); }
function pintar(){
  ["hoy", "semana", "avances", "metodo", "importar"].forEach(v => { const b = $("#nav_" + v); if(b) b.classList.toggle("sel", v === vista); });
  document.body.classList.toggle("en-playback", vista === "hoy" && enPlayback());
  if(vista === "hoy") pintarHoy();
  else if(vista === "semana") pintarSemana();
  else if(vista === "avances") pintarAvances();
  else if(vista === "metodo") pintarMetodo();
  else pintarImportar();
  tick();
}
function cabeceraHTML(){
  return '<div class="fila-marca"><span class="marca">FIERRO</span>' +
    '<button class="chip-peso" onclick="editarPeso()"><small>peso</small>' + fmtKg(pesoActual()) + "</button></div>";
}
function editarPeso(){
  abrirModal("Peso corporal", '<p>Un peso por día; el más reciente es el que usa la carga efectiva.</p><label>Kilos</label><input id="inPeso" inputmode="decimal" value="' + fmtNum(pesoActual()) + '">',
    [["Guardar", () => { const v = num($("#inPeso").value); if(v < 30 || v > 300){ aviso("Ese peso no parece real."); return; } registrarPeso(v); cerrarModal(); pintar(); aviso("Peso registrado: " + fmtKg(v)); }],
     ["Cancelar", cerrarModal]]);
  setTimeout(() => { const i = $("#inPeso"); if(i){ i.focus(); i.select(); } }, 50);
}
function cambiarModo(m){
  if(m === DB.modo) return;
  const p = pendiente();
  const n = seriesAnotadas();
  const aplicar = () => {
    DB.modo = m;
    if(p){ p.modo = m; Object.keys(p.reg).forEach(id => (p.reg[id] || []).forEach(r => { if(r) r.modo = m; })); }
    guardar(); pintar();
  };
  if(p && n > 0 && p.modo !== m){
    abrirModal("Cambiar de modo", "Hay " + n + " series anotadas en modo " + nombreModo(p.modo) + ". ¿Pasar la sesión entera a " + nombreModo(m) + "?",
      [["Sí, cambiar", () => { cerrarModal(); aplicar(); }], ["Volver", cerrarModal]]);
    return;
  }
  aplicar();
}
function nombreModo(m){ return m === "gym" ? "Gimnasio" : "Casa"; }
function elegirDia(d){ sel = {dia:d, adhoc:null}; pintarHoy(); }
function elegirAdHoc(id){ sel = {dia:null, adhoc:id}; pintarHoy(); }

/* ---------- HOY ---------- */
/* las casillas que se ven de verdad: las del día menos las pausadas con
   sustituto, más el sustituto en su lugar */
function casillasHoy(selx, modo){
  const cas = casillasDe(selx, modo);
  const out = [];
  cas.forEach(c => {
    const pa = DB.pausados[c.id];
    if(!pa) out.push(c);
    else if(pa.sustituto && ej(pa.sustituto) && !cas.some(o => o.id === pa.sustituto)) out.push(Object.assign(casillaDe(pa.sustituto, {series:c.series, min:c.min, max:c.max}), {sustituyeA:c.id}));
  });
  return out;
}
function pintarHoy(){
  const p = pendiente();
  if(!sel.dia && !sel.adhoc){
    if(p && (p.dia || p.adhoc)) sel = {dia:p.dia, adhoc:p.adhoc};
    else sel = {dia:diaSugerido(), adhoc:null};
  }
  if(enPlayback()){ pintarPlayback(); return; }
  const modo = (p && seriesAnotadas() > 0 && p.dia === sel.dia && p.adhoc === sel.adhoc) ? p.modo : DB.modo;
  const sug = diaSugerido();
  let h = cabeceraHTML();
  h += '<div class="segmentado" role="tablist">' +
    '<button class="' + (DB.modo === "casa" ? "sel" : "") + '" onclick="cambiarModo(\'casa\')">Casa</button>' +
    '<button class="' + (DB.modo === "gym" ? "sel" : "") + '" onclick="cambiarModo(\'gym\')">Gimnasio</button></div>';
  h += '<div class="pills">' + DIAS.map(d =>
    '<button class="pill' + (!sel.adhoc && sel.dia === d ? " sel" : "") + (d === sug ? " sig" : "") + '" onclick="elegirDia(\'' + d + '\')"><b>' + d + "</b><small>" + RUTINA[d].n.split(" ")[0] + "</small></button>").join("") + "</div>";
  if(DB.sesionesAdHoc.length){
    h += '<div class="adhoc-fila">' + DB.sesionesAdHoc.map(a =>
      '<button class="adhoc-btn' + (sel.adhoc === a.id ? " sel" : "") + '" onclick="elegirAdHoc(\'' + esc(a.id) + '\')">' + esc(a.nombre) + (a.reemplazaDia ? " · día " + a.reemplazaDia : "") + "</button>").join("") + "</div>";
  }
  const cas = casillasDe(sel, modo);
  const ad = sel.adhoc ? adHocDe(sel.adhoc) : null;
  const tit = ad ? esc(ad.nombre) : "Día " + sel.dia + " · " + RUTINA[sel.dia].n;
  const enCursoAqui = p && p.dia === sel.dia && p.adhoc === sel.adhoc && p.primeraSerieISO;
  h += '<div class="tarjeta"><div class="tarjeta-cab"><span class="etq">' + tit + '</span><span class="etq">' + nombreModo(modo) +
    (ad ? "" : " · sugerido " + SUGERIDO_DIA[sel.dia]) + "</span></div>" +
    '<div class="fila-tiempo"><div><span class="etq">Estimado</span><b>' + fmtMin(estimadoSesionSeg(cas, modo)) + "</b>" +
      (ad && ad.duracionEstimada ? '<span class="aviso-suave"> · ' + ad.duracionEstimada + " min según la sesión</span>" : "") + "</div>" +
      (enCursoAqui ? '<div class="reloj-ses"><span class="etq">En curso</span><b id="relojSesion">' + fmtReloj(Date.now() - new Date(p.primeraSerieISO).getTime()) + "</b></div>" : "") + "</div>" +
    (ad && ad.motivo ? '<div class="aviso-suave">' + esc(ad.motivo) + "</div>" : "") +
    (!ad && sel.dia !== sug ? '<div class="aviso-suave">Según la rotación toca el día ' + sug + ". Este igual cuenta.</div>" : "") +
    (ad && !DIAS.includes(ad.reemplazaDia) ? '<div class="aviso-suave">Sesión extra: no avanza la rotación.</div>' : "") +
    "</div>";
  avisosCriterios().forEach(c => {
    h += '<div class="aviso"><b>Disparador cumplido:</b> ' + esc(c.n) + ". Se cumplió la condición (" + esc(c.disparador) + "). La app no cambia nada sola: conviene conversarlo y ajustar por JSON. " +
      '<button class="link" onclick="verCriterio(\'' + c.id + '\')">Ver en Método</button></div>';
  });
  if(p && seriesAnotadas() > 0 && (p.dia !== sel.dia || p.adhoc !== sel.adhoc)){
    h += '<div class="aviso acc">Hay una sesión en curso (' + esc(tituloSesion(p)) + ", " + seriesAnotadas() + ' series). Al anotar acá se descarta esa. <button class="link" onclick="sel={dia:pendiente().dia,adhoc:pendiente().adhoc};pintarHoy()">Volver a ella</button></div>';
  }
  /* la sesión guiada: conduce paso a paso; la lista queda para corregir */
  const guiaAqui = p && p.pb && p.dia === sel.dia && p.adhoc === sel.adhoc;
  if(cas.length) h += '<button class="btn-grande btn-acento" style="margin-bottom:12px" onclick="empezarSesion()">' +
    (guiaAqui ? "‹ Volver a la sesión guiada" : (p && seriesAnotadas() > 0 && p.dia === sel.dia && p.adhoc === sel.adhoc ? "Seguir con la guía" : "Empezar sesión · " + fmtMin(estimadoSesionSeg(cas, modo)))) + "</button>";
  if(!cas.length) h += '<div class="tarjeta aviso-suave">Esta sesión no tiene ejercicios en modo ' + nombreModo(modo) + ".</div>";
  cas.forEach((c, i) => {
    h += ejercicioHTML(c, i + 1, modo);
    const pa = DB.pausados[c.id];
    if(pa && pa.sustituto && ej(pa.sustituto) && !cas.some(o => o.id === pa.sustituto)){
      h += ejercicioHTML(casillaDe(pa.sustituto, {series:c.series, min:c.min, max:c.max}), i + 1, modo, true);
    }
  });
  const enCurso = p && p.dia === sel.dia && p.adhoc === sel.adhoc && seriesAnotadas() > 0;
  h += '<button class="btn-grande ' + (guiaAqui ? "btn-borde" : "btn-acento") + '" id="btnGuardar" onclick="guardarSesion()"' + (enCurso ? "" : " disabled") + ">Guardar sesión" +
    (enCurso ? " · " + seriesAnotadas() + " series" : "") + "</button>";
  if(enCurso) h += '<button class="btn-grande btn-borde" style="margin-top:8px" onclick="descartarPendiente()">Descartar lo anotado</button>';
  h += '<div class="aviso-suave" style="margin:10px 2px 0">Mantén apretado un ejercicio (o toca ⋯) para pausarlo, cambiar de nivel o leer el fundamento.</div>';
  $("#app").innerHTML = h;
  activarLongPress();
}
function prescripcion(c, modo){
  const x = ej(c.id), p = progDe(c.id, modo);
  const uni = p === "tiempo" ? " s" : (x.unidad ? " " + x.unidad : "");
  const rango = c.maxLibre ? "máximo" : c.min + (c.max > c.min ? " a " + c.max : "") + uni;
  return c.series + " × " + rango + (c.lado ? " " + c.lado : "") + (x.tempo ? " · tempo " + x.tempo : "");
}
function ejercicioHTML(c, n, modo, esSustituto){
  const x = ej(c.id); if(!x) return "";
  const p = pendiente();
  const enEsta = p && p.dia === sel.dia && p.adhoc === sel.adhoc;
  const pa = DB.pausados[c.id];
  const prog = progDe(c.id, modo);
  let h = '<div class="ej' + (pa ? " pausado" : "") + '" id="ej_' + c.id + '" oncontextmenu="return false">';
  h += '<div class="ej-cab" data-id="' + c.id + '"><div class="ej-num">' + n + '</div><div class="ej-tit"><b>' + esc(x.n) + (esSustituto ? " <span class='chip acc'>sustituto</span>" : "") + "</b>" +
    '<div class="sub">' + esc(x.g) + " · " + prescripcion(c, modo) + (x.descanso ? " · descanso " + x.descanso + " s" : "") + (x.agarre ? " · agarre" : "") +
      " · ~" + fmtMin(estimadoEjSeg(c, modo)) + (tiempoRealEjSeg(c.id, modo) ? " (real)" : "") + "</div></div>" +
    '<button class="ej-menu" onclick="menuEjercicio(\'' + c.id + '\')" aria-label="opciones">⋯</button></div>';
  if(pa){
    h += '<div class="sugerencia">En pausa desde el ' + fmtFecha(pa.desde) + " (" + diasEntre(pa.desde, fechaISO()) + " días)" + (pa.motivo ? ": " + esc(pa.motivo) : "") +
      (pa.sustituto && ej(pa.sustituto) ? ". Sustituto: " + esc(ej(pa.sustituto).n) : "") + ". Nivel congelado" + (escaleraDe(c.id) ? " en " + esc(nombreNivel(c.id, nivelActual(c.id)).toLowerCase()) : "") + ".</div>" +
      '<div class="ej-pie"><button class="link" onclick="reanudar(\'' + c.id + '\')">Reanudar</button></div>';
    return h + CIERRA;
  }
  if(prog === "nivel"){
    const niv = nivelActual(c.id), esc_ = escaleraDe(c.id);
    h += '<div class="nivel-linea"><button class="nivel-chip" onclick="modalNivel(\'' + c.id + '\')"><small>nivel ' + niv + "</small>" + esc(nombreNivel(c.id, niv)) + "</button>" +
      (esc_[niv] && esc_[niv].desc ? '<span class="aviso-suave">' + esc(esc_[niv].desc) + "</span>" : "") + "</div>";
  } else if(x.lastre && DB.lastre){
    h += '<div class="nivel-linea"><span class="nivel-chip"><small>lastre</small>kilos colgados</span><span class="aviso-suave">escalera archivada en ' + esc(nombreNivel(c.id, nivelActual(c.id)).toLowerCase()) + "</span></div>";
  }
  const s = sugerencia(c, modo);
  h += '<div class="sugerencia' + (s.lista ? " lista" : "") + '">' + s.t + "</div>";
  h += '<div class="series" id="series_' + c.id + "\" data-cas='" + JSON.stringify(c).replace(/'/g, "&#39;") + "'>";
  for(let i = 0; i < c.series; i++) h += serieHTML(c, i, c.series);
  h += "</div>";
  const ultimaAnotada = enEsta ? seriesValidas(p.reg[c.id]).slice(-1)[0] : null;
  const descCorto = ultimaAnotada && x.descanso >= 120 && ultimaAnotada.desc != null && ultimaAnotada.desc < x.descanso * 0.7;
  h += '<div class="nota-desc" id="notad_' + c.id + '"' + (descCorto ? "" : " hidden") + ">" +
    (descCorto ? "Descanso de " + ultimaAnotada.desc + " s (sugerido " + x.descanso + "). Menos repeticiones con menos descanso no es retroceso: es el descanso." : "") + "</div>";
  const rir = (enEsta && p.rir[c.id] != null) ? p.rir[c.id] : null;
  h += '<div class="rir" id="rir_' + c.id + '"><span class="etq">RIR última serie</span>' +
    [[1, "0-1"], [2, "2-3"], [4, "4+"]].map(([v, t]) => '<button data-v="' + v + '" class="' + (rir === v ? "sel" : "") + '" onclick="marcarRIR(\'' + c.id + "'," + v + ')">' + t + "</button>").join("") + "</div>";
  const corriendo = p && p.descansoFinISO && p.descansoDe === x.n;
  /* el fundamento no va en un <details> dentro de la fila: compartiría el
     ancho con el botón de descanso y el dibujo saldría apretado. Va en un
     panel aparte, a todo el ancho, que abre el botón de la fila. */
  h += '<div class="ej-pie"><button class="btn-porque" id="bporque_' + c.id + '" onclick="alternarPorque(\'' + c.id + '\')">▸ ¿Por qué este ejercicio?</button>' +
    (x.descanso ? '<button class="btn-desc' + (corriendo ? " corriendo" : "") + '" onclick="descansoManual(\'' + c.id + '\')">' + (corriendo ? "En descanso" : "Descanso " + x.descanso + " s") + "</button>" : "") + "</div>" +
    '<div class="fund-panel" id="porque_' + c.id + '" hidden>' + fundamentoHTML(c.id) + "</div>";
  return h + "</div>";
}
/* el cierre de la tarjeta para la salida temprana (ejercicio en pausa); va
   partido para que el chequeo estático de divs no cuente dos cierres */
const CIERRA = "</" + "div>";
function serieHTML(c, i, total){
  const id = c.id, p = pendiente();
  const enEsta = p && p.dia === sel.dia && p.adhoc === sel.adhoc;
  const r = enEsta ? serieDe(id, i) : null;
  const modo = enEsta ? p.modo : DB.modo;
  const prog = progDe(id, modo);
  /* la primera vacía se abre; las siguientes se abren al anotar la anterior */
  let primeraVacia = 0;
  if(enEsta && p.reg[id]){ primeraVacia = total; for(let j = 0; j < total; j++) if(!serieDe(id, j)){ primeraVacia = j; break; } }
  if(!r && i > primeraVacia) return '<div class="serie"><span class="s-n">' + (i + 1) + '</span><span class="aviso-suave">·</span></div>';
  const rec = '<span class="s-rec' + (r && r.rec ? " si" : "") + '" id="rec_' + id + "_" + i + '"></span>';
  let campos = "";
  if(prog === "nivel"){
    const esc_ = escaleraDe(id), nivSel = r && r.nivel != null ? r.nivel : nivelActual(id);
    campos += '<select id="n_' + id + "_" + i + '" onchange="cambiarNivelSerie(\'' + id + "'," + i + ')">' +
      esc_.map(nv => '<option value="' + nv.i + '"' + (nv.i === nivSel ? " selected" : "") + ">" + esc(nv.n) + "</option>").join("") + "</select>";
  }
  if(prog === "peso"){
    campos += '<div class="campo"><input class="kg" id="k_' + id + "_" + i + '" inputmode="decimal" enterkeyhint="next" placeholder="kg" value="' +
      (r && num(r.kg) ? fmtNum(num(r.kg)) : "") + '" onchange="anotarSerie(\'' + id + "'," + i + ')"><span class="u">kg</span></div>';
  }
  const uni = prog === "tiempo" ? "s" : (ej(id).unidad ? ej(id).unidad.slice(0, 3) : "reps");
  campos += '<div class="campo"><input class="reps' + (r ? " hecha" : "") + '" id="r_' + id + "_" + i + '" inputmode="numeric" enterkeyhint="done" placeholder="·" value="' +
    (r ? num(r.reps) : "") + '" onchange="anotarSerie(\'' + id + "'," + i + ')"><span class="u">' + uni + "</span></div>";
  return '<div class="serie"><span class="s-n">' + (i + 1) + "</span>" + campos + rec + "</div>";
}
function alternarPorque(id){
  const panel = $("#porque_" + id), btn = $("#bporque_" + id);
  if(!panel) return;
  panel.hidden = !panel.hidden;
  if(btn) btn.textContent = (panel.hidden ? "▸" : "▾") + " ¿Por qué este ejercicio?";
  if(!panel.hidden) vigilarImagenes();
}
function porqueHTML(id){
  const x = ej(id); if(!x) return "";
  return '<details class="porque" ontoggle="vigilarImagenes()"><summary>¿Por qué este ejercicio?</summary>' + fundamentoHTML(id) + "</details>";
}
function fundamentoHTML(id){
  const x = ej(id); if(!x) return "";
  const esc_ = escaleraDe(id);
  return '<div class="fund">' + visualHTML(id) +
    (x.p ? "<p>" + esc(x.p) + "</p>" : "") +
    (x.tec ? '<div class="cue">' + esc(x.tec) + "</div>" : "") +
    (x.how ? "<ol>" + x.how.map(s => "<li>" + esc(s) + "</li>").join("") + "</ol>" : "") +
    (esc_ ? '<div class="escalera-mini">Escalera: ' + esc_.map((n, i) => (i === nivelActual(id) ? "<b>" + esc(n.n) + "</b>" : esc(n.n))).join(" → ") + "</div>" : "") +
    (x.video ? '<a class="btn-video" href="' + esc(x.video) + '" target="_blank" rel="noopener">▶ Ver video</a>' : "") +
    "</div>";
}
/* mantener apretado abre el menú del ejercicio */
let lpTimer = null;
function activarLongPress(){
  document.querySelectorAll(".ej-cab").forEach(el => {
    const id = el.dataset.id;
    const empezar = e => { clearTimeout(lpTimer); lpTimer = setTimeout(() => { vibrar(30); menuEjercicio(id); }, 550); };
    const cancelar = () => clearTimeout(lpTimer);
    el.addEventListener("touchstart", empezar, {passive:true});
    el.addEventListener("touchend", cancelar); el.addEventListener("touchmove", cancelar); el.addEventListener("touchcancel", cancelar);
    el.addEventListener("mousedown", empezar); el.addEventListener("mouseup", cancelar); el.addEventListener("mouseleave", cancelar);
  });
}
function menuEjercicio(id){
  const x = ej(id); if(!x) return;
  const pa = DB.pausados[id];
  const botones = [];
  if(pa) botones.push(["Reanudar", () => { cerrarModal(); reanudar(id); }]);
  else botones.push(["Pausar", () => { cerrarModal(); modalPausar(id); }]);
  if(escaleraDe(id)) botones.push(["Cambiar nivel", () => { cerrarModal(); modalNivel(id); }]);
  botones.push(["Ver fundamento", () => { cerrarModal(); abrirModal(esc(x.n), fundamentoHTML(id), [["Cerrar", cerrarModal]]); vigilarImagenes(); }]);
  botones.push(["Cerrar", cerrarModal]);
  abrirModal(esc(x.n), '<p>' + esc(x.g) + " · " + (PATRONES[x.patron] || x.patron) + (x.agarre ? " · carga el agarre" : "") + "</p>", botones);
}
function modalPausar(id){
  const x = ej(id);
  const opciones = Object.keys(todaLaBiblioteca()).filter(k => k !== id && !ej(k).legado && ej(k).g === x.g);
  abrirModal("Pausar " + esc(x.n),
    '<p>El ejercicio queda congelado con su nivel y se muestra atenuado. Se puede reanudar cuando quieras.</p>' +
    '<label>Motivo</label><textarea id="inMotivo" placeholder="Molestia, falta de equipo, tiempo..."></textarea>' +
    '<label>Sustituto (opcional)</label><select id="inSust"><option value="">Ninguno</option>' +
    opciones.map(k => '<option value="' + k + '">' + esc(ej(k).n) + "</option>").join("") + "</select>",
    [["Pausar", () => {
        pausarEjercicio(id, $("#inMotivo").value.trim(), $("#inSust").value || null);
        cerrarModal();
        const otros = x.agarre ? otrosConAgarre(id) : [];
        if(otros.length){
          abrirModal("Otros que cargan el agarre", "<p>" + esc(x.n) + " carga el antebrazo. Estos también: " + otros.map(k => esc(ej(k).n)).join(", ") + ". Conviene revisar si molestan.</p>", [["Entendido", () => { cerrarModal(); pintar(); }]]);
        } else pintar();
        aviso("Pausado. La rutina sigue sin él.");
     }],
     ["Cancelar", cerrarModal]]);
}
function reanudar(id){
  reanudarEjercicio(id); pintar();
  aviso("Reanudado en su nivel de antes.");
}
function modalNivel(id){
  const x = ej(id), esc_ = escaleraDe(id); if(!esc_) return;
  const act = nivelActual(id);
  abrirModal("Nivel de " + esc(x.n),
    '<p>El nivel actual manda en las series nuevas. Cambiarlo a mano sirve para corregir; el ascenso normal lo propone la app al cumplir el criterio.</p>' +
    '<select id="inNivel">' + esc_.map(nv => '<option value="' + nv.i + '"' + (nv.i === act ? " selected" : "") + ">" + nv.i + " · " + esc(nv.n) + (nv.desc ? " (" + esc(nv.desc) + ")" : "") + "</option>").join("") + "</select>" +
    (criterioDe(id, act) ? "<p>Criterio para subir del nivel actual: " + esc(textoCriterio(id, act)) + ".</p>" : ""),
    [["Guardar", () => {
        const nuevo = parseInt($("#inNivel").value, 10);
        if(nuevo !== act){ DB.ascensos.push({ej:id, de:act, a:nuevo, fecha:fechaISO(), manual:true}); DB.niveles[id] = nuevo; guardar(); }
        cerrarModal(); pintar();
     }],
     ["Cancelar", cerrarModal]]);
}
function verCriterio(id){ DB.criteriosVistos[id] = fechaISO(); guardar(); irVista("metodo"); }

/* ---------- SEMANA ---------- */
let semanaVista = null;   // lunes de la semana que se muestra
function moverSemana(n){ semanaVista = sumarDias(semanaVista || lunesDe(fechaISO()), 7 * n); pintarSemana(); }
function pintarSemana(){
  const hoy = fechaISO();
  const lunes = semanaVista || lunesDe(hoy);
  const esActual = lunes === lunesDe(hoy);
  const dom = sumarDias(lunes, 6);
  let h = cabeceraHTML();
  h += '<div class="fila-nav"><button class="btn-flecha" onclick="moverSemana(-1)" aria-label="semana anterior">◀</button>' +
    '<div class="centro"><div class="tit">' + fmtFecha(lunes).slice(0, 2) + " al " + fmtFechaLarga(dom).slice(4) + "</div>" +
    (esActual ? '<div class="etq">esta semana</div>' : '<button class="link" onclick="semanaVista=null;pintarSemana()">volver a hoy</button>') + "</div>" +
    '<button class="btn-flecha" onclick="moverSemana(1)" aria-label="semana siguiente">▶</button></div>';
  /* la tira de días con sus sesiones */
  const nombres = ["lun", "mar", "mié", "jue", "vie", "sáb", "dom"];
  h += '<div class="tarjeta"><div class="semana-tira">';
  for(let i = 0; i < 7; i++){
    const f = sumarDias(lunes, i);

  const nS = Object.keys(s.reg).reduce((a, id) => a + s.reg[id].length, 0);

    '<span class="aviso-suave"> · ' + nS + " series · " + fmtNum(Math.round(tonelajeSesion(s))) + " kg" + (recs ? " · " + recs + " récord" + (recs === 1 ? "" : "s") : "") + (s.origen === "v1" ? " · registrada en la v1" : "") + "</span></div>" +

      (niv ? '<div class="nivel-linea"><span class="nivel-chip"><small>nivel ' + niv.nivel + "</small>" + esc(nombreNivel(id, niv.nivel)) + "</span></div>" : "") +
      '<div class="series">' + ser.map((r, i) =>
        '<div class="serie hecha-fija"><span class="s-n">' + (i + 1) + "</span>" +
        (prog === "nivel" && r.nivel != null ? '<span class="s-val s-niv">' + esc(nombreNivel(id, r.nivel)) + "</span>" : "") +

        (r.incompleta ? '<span class="s-nota">' + esc(r.nota || "sin peso anotado") + "</span>" : "") +
        (r.rir != null ? '<span class="s-nota">RIR ' + r.rir + "</span>" : "") +
        (r.desc != null ? '<span class="s-nota">descanso ' + r.desc + " s</span>" : "") +

      '<div class="ej-pie"><button class="btn-porque" id="bporque_' + id + '" onclick="alternarPorque(\'' + id + '\')">▸ ¿Por qué este ejercicio?</button></div>' +
      '<div class="fund-panel" id="porque_' + id + '" hidden>' + fundamentoHTML(id) + "</div></div>";

/* el mapa: una fila por semana, siete recuadros, pintado el día que hubo
   sesión. Desde la primera sesión (hasta 16 semanas atrás) hasta hoy. */
function mapaSemanasHTML(){
  const hoy = fechaISO();
  const lunesHoy = lunesDe(hoy);
  let inicio = DB.sesiones.length ? lunesDe(DB.sesiones[0].fecha) : lunesHoy;
  if(diasEntre(inicio, lunesHoy) > 7 * 15) inicio = sumarDias(lunesHoy, -7 * 15);
  const porDia = {};
  DB.sesiones.forEach(s => { (porDia[s.fecha] = porDia[s.fecha] || []).push(s); });
  const meses = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  let h = '<div class="mapa"><span></span>' + ["L", "M", "M", "J", "V", "S", "D"].map(d => '<span class="cab-col">' + d + "</span>").join("");
  for(let l = inicio; l <= lunesHoy; l = sumarDias(l, 7)){
    const d = deFecha(l);
    h += '<span class="rot">' + d.getDate() + " " + meses[d.getMonth()] + "</span>";
    for(let i = 0; i < 7; i++){
      const f = sumarDias(l, i), ses = porDia[f] || [];
      if(!ses.length){ h += '<div class="celda-mapa' + (f > hoy ? " futuro" : "") + (f === hoy ? " hoy" : "") + '"></div>'; continue; }
      const s = ses[0];
      h += '<button class="celda-mapa ok' + (s.modo === "gym" ? " gym" : "") + (s.adhoc && !diaQueAvanza(s) ? " adhoc" : "") + (f === hoy ? " hoy" : "") +
        '" onclick="verSesionMapa(\'' + esc(s.ts || s.fecha) + '\')" title="' + esc(tituloSesion(s)) + '">' +
        ses.map(x => x.adhoc ? (diaQueAvanza(x) || "+") : x.dia).join("") + "</button>";
    }
  }
  return h + "</div>";
}

/* el detalle de una sesión: cada ejercicio con sus series y su tendencia,

function detalleSesionHTML(s){

    '<div class="detalle-tit">' + fmtFechaLarga(s.fecha) + " · " + nombreModo(s.modo).toLowerCase() + (s.duracion ? " · " + Math.round(s.duracion / 60) + " min" : "") +
    " · " + nS + " series · " + fmtNum(Math.round(tonelajeSesion(s))) + " kg" + (s.origen === "v1" ? " · registrada en la v1" : "") + "</div>";

      '<div class="detalle-series">' + ser.map(r => '<span class="' + (r.rec ? "rec" : "") + '">' + fmtSerie(id, r) + (r.incompleta ? " <small>" + esc(r.nota || "sin peso") + "</small>" : "") + (r.rir != null ? " <small>RIR " + r.rir + "</small>" : "") + (r.desc != null ? " <small>d" + r.desc + "</small>" : "") + "</span>").join(" · ") + "</div>" +
      (hist.length >= 2 ? sparklineHTML(id, hist, prog, idx) : '<div class="aviso-suave">Única sesión con este ejercicio' + (hist.length ? "" : " (series sin peso anotado)") + ".</div>") + "</div>";
  });
  return h + "</div>";

function valorComparable(id, r, prog){
  if(prog === "peso" || num(r.kg) > 0) return num(r.kg) * num(r.reps);
  return num(r.reps);
}
function textoSerieAA(id, r, prog){
  if(r.incompleta) return num(r.reps) + " (sin peso anotado)";
  if(prog === "peso" || num(r.kg) > 0) return fmtNum(num(r.kg)) + " kg × " + num(r.reps);
  if(prog === "tiempo") return num(r.reps) + " s";
  if(prog === "nivel") return num(r.reps) + (r.nivel != null ? " · " + nombreNivel(id, r.nivel).toLowerCase() : "");
  return String(num(r.reps));
}
function avanceHTML(id, compacto){
  const x = ej(id);
  const modos = modosConDatos(id);
  const separar = !x.legado && x.prog && x.prog.casa && x.prog.gym && x.prog.casa !== x.prog.gym && modos.length > 1;
  let h = '<div class="tarjeta' + (compacto ? "" : "") + '"><div class="tarjeta-cab"><span class="etq">' + esc(x.n) + "</span><span class='etq'>" + esc(x.g) + "</span></div>";
  (separar ? ["casa", "gym"] : [null]).forEach(m => {
    const hist = historial(id, m || undefined).map(e => Object.assign({}, e, {series:e.series.filter(r => !r.incompleta)})).filter(e => e.series.length);
    if(!hist.length) return;
    const prog = progDe(id, m || hist[hist.length - 1].modo || "casa");
    const primera = hist[0], ultima = hist[hist.length - 1];
    const mAntes = mejorSerie(id, primera.series, m), mAhora = mejorSerie(id, ultima.series, m);
    const vA = valorComparable(id, mAntes, prog), vB = valorComparable(id, mAhora, prog);
    let pct = "";
    if(prog === "nivel" && (mAntes.nivel != null || mAhora.nivel != null) && (mAntes.nivel || 0) !== (mAhora.nivel || 0)){
      const d = (mAhora.nivel || 0) - (mAntes.nivel || 0);
      pct = (d > 0 ? "+" : "") + d + " nivel" + (Math.abs(d) === 1 ? "" : "es");
    } else if(vA > 0 && hist.length > 1 && (num(mAntes.kg) > 0) === (num(mAhora.kg) > 0)){
      /* solo se comparan magnitudes de la misma clase: reps con reps, o
         kilos × reps con kilos × reps (las series v1 sin kilos anotados no
         se comparan con las que sí los traen) */
      const p = Math.round((vB / vA - 1) * 100);
      pct = (p >= 0 ? "+" : "") + p + " %";
    } else pct = hist.length > 1 ? "" : "primera";
    h += '<div class="bloque-modo">' + (separar ? '<span class="chip ' + (m === "gym" ? "marca" : "acc") + '">' + nombreModo(m) + "</span>" : "") +
      '<div class="antes-ahora"><div class="aa-col"><span class="etq">Antes · ' + fmtFecha(primera.fecha) + '</span><div class="v">' + esc(textoSerieAA(id, mAntes, prog)) + "</div></div>" +
      '<div class="aa-pct' + (pct.startsWith("-") ? " neg" : "") + '">' + pct + "</div>" +
      '<div class="aa-col"><span class="etq">Ahora · ' + fmtFecha(ultima.fecha) + '</span><div class="v">' + esc(textoSerieAA(id, mAhora, prog)) + "</div></div></div>";
    if(hist.length >= 3) h += sparklineHTML(id, hist, prog);
    h += "</div>";
  });
  if(escaleraDe(id) && !x.legado){
    if(x.lastre && DB.lastre) h += '<div class="aviso-suave" style="margin-top:8px">Escalera archivada: con el lastre el ejercicio progresa por kilos.</div>';
    h += escaleraHTML(id);
  }
  if(x.pc) h += cargaEfectivaHTML(id);
  return h + "</div>";
}
function escaleraHTML(id){
  const esc_ = escaleraDe(id), act = nivelActual(id);
  const recorridos = new Set();
  historial(id).forEach(e => e.series.forEach(r => { if(r.nivel != null) recorridos.add(r.nivel); }));
  DB.ascensos.filter(a => a.ej === id).forEach(a => recorridos.add(a.de));
  return '<div class="escalera">' + esc_.map(nv => {
    const cls = nv.i === act ? "actual" : (nv.i < act || recorridos.has(nv.i)) && nv.i < act ? "hecho" : "";
    return '<div class="peldano ' + cls + '"><i>' + (cls === "hecho" ? "✓" : nv.i) + "</i><span>" + esc(nv.n) + (nv.i === act && criterioDe(id, nv.i) ? ' <span class="aviso-suave">· sube con ' + esc(textoCriterio(id, nv.i)) + "</span>" : "") + "</span></div>";
  }).join("") + "</div>";
}
function sparklineHTML(id, hist, prog, marcar){
  const vals = hist.map(e => { const m = mejorSerie(id, e.series); return valorComparable(id, m, prog); });
  const max = Math.max(...vals) || 1, min = Math.min(...vals);
  const W = 320, H = 56;
  const X = i => 6 + i * ((W - 12) / Math.max(1, vals.length - 1));
  const Y = v => H - 8 - ((v - min) / Math.max(1, max - min)) * (H - 20);
  let s = '<svg class="spark" viewBox="0 0 ' + W + " " + H + '">';
  s += '<polyline fill="none" stroke="var(--acento)" stroke-width="2" points="' + vals.map((v, i) => X(i) + "," + Y(v)).join(" ") + '"/>';
  vals.forEach((v, i) => {
    const esMarcado = marcar != null && i === marcar;
    s += '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="' + (esMarcado ? 5 : 3) + '" fill="var(--' + (esMarcado ? "marca" : "acento") + ')"/>';
    if(i === 0 || i === vals.length - 1 || v === max || esMarcado) s += '<text x="' + X(i) + '" y="' + (Y(v) - 7) + '" text-anchor="middle" font-size="9" font-weight="700" fill="var(--tinta)">' + (prog === "peso" ? Math.round(v) : v) + "</text>";
  });
  const conKg = hist.some(e => e.series.some(r => num(r.kg) > 0));
  return s + "</svg>" + '<div class="aviso-suave">' + ((prog === "peso" || conKg) ? "Kilos por repeticiones de la mejor serie" : prog === "tiempo" ? "Segundos de la mejor serie" : "Repeticiones de la mejor serie") + ", sesión a sesión (" + vals.length + ")" + (marcar != null ? ", en ámbar esta sesión" : "") + ".</div>";
}
