<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6E7E2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fierro">
<title>Fierro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* ============ tokens: hormigón y tinta ============ */
:root{
  --fondo:#E6E7E2;
  --tarjeta:#F8F8F6;
  --tinta:#14171B;
  --suave:#6B7178;
  --acento:#2440E8;
  --marca:#C07A00;
  --linea:#D0D2CB;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--fondo);color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.4;
}
main{max-width:480px;margin:0 auto;padding:12px 12px 140px}
body.con-sesion main{padding-bottom:250px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
a{color:var(--acento)}

/* etiquetas pequeñas en mayúsculas: la personalidad de la interfaz */
.etq{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.num{font-variant-numeric:tabular-nums;font-weight:800}

/* ============ cabecera de HOY ============ */
.fila-marca{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 10px}
.marca{font-size:20px;font-weight:900;letter-spacing:.22em}
.minimapa{display:grid;grid-template-columns:repeat(48,1fr);gap:1px;flex:1;max-width:190px;height:7px}
.minimapa i{background:var(--linea);border-radius:1px}
.minimapa i.ok{background:var(--acento)}
.minimapa i.aqui{background:var(--fondo);outline:1px solid var(--acento)}
.fila-semana{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fila-semana .btn-flecha{width:44px;height:44px;font-size:18px;color:var(--suave)}
.sem-centro{text-align:center}
.sem-titulo{font-size:17px;font-weight:800;letter-spacing:.06em}
.pills{display:flex;gap:6px;margin-bottom:12px}
.pill{flex:1;min-height:48px;border:1px solid var(--linea);border-radius:8px;background:var(--tarjeta);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.pill b{font-size:15px}
.pill small{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.pill.sel{border-color:var(--acento);outline:1px solid var(--acento)}
.pill.ok b::after{content:" ✓";color:var(--acento)}

/* ============ tarjetas ============ */
.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:10px;padding:12px;margin-bottom:12px}
.tarjeta-cab{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.chip{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--linea);border-radius:5px;padding:2px 6px;color:var(--suave);vertical-align:2px}
.chip.acc{border-color:var(--acento);color:var(--acento)}
.aviso-suave{color:var(--suave);font-size:13px}

/* grilla de registro por bloque */
.ej{padding:10px 0;border-top:1px solid var(--linea)}
.ej:first-of-type{border-top:none}
.ej-fila{display:flex;align-items:flex-start;gap:8px}
.ej-nombre{flex:1;min-width:0;padding-top:4px}
.ej-nombre b{font-size:14px;display:block;line-height:1.25}
.ej-nombre .rango{font-size:11px;color:var(--suave)}
.celdas{display:flex;gap:5px}
.celda{width:58px;min-height:48px;border:1px solid var(--linea);border-radius:7px;background:var(--fondo);
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.celda .punto{color:var(--linea);font-size:18px;font-weight:800}
.celda input{width:100%;border:none;background:none;text-align:center;
  font-variant-numeric:tabular-nums;font-weight:800;outline:none}
.celda input.reps{font-size:19px;height:30px}
.celda input.kg{font-size:11px;height:18px;color:var(--suave);border-top:1px dashed var(--linea)}
.celda input.seg{font-size:19px;height:44px}
.celda:focus-within{border-color:var(--acento);outline:1px solid var(--acento);background:#fff}
.celda .u{position:absolute;right:3px;bottom:2px;font-size:8px;color:var(--suave)}
.rec-dot{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;
  background:var(--marca);display:none}
.rec-dot.si{display:block}
.rec-linea{color:var(--marca);font-size:11px;font-weight:700;margin-top:4px;display:none}
.rec-linea.si{display:block}
.cab-rondas{display:flex;gap:5px;justify-content:flex-end;margin-bottom:2px}
.cab-rondas span{width:58px;text-align:center}

.meta-ej{margin-top:6px;font-size:12px;color:var(--suave)}
.meta-ej b{color:var(--tinta);font-weight:700}

/* cambiar el ejercicio de una casilla, o de la sesión entera */
.fila-sw{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sw{display:flex;align-items:center;gap:9px;min-height:44px;font-size:13.5px;font-weight:700}
.sw-riel{width:42px;height:25px;border-radius:13px;background:var(--linea);position:relative;
  transition:background .15s;flex:none}
.sw-bolita{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--tarjeta);
  transition:transform .15s}
.sw.on .sw-riel{background:var(--acento)}
.sw.on .sw-bolita{transform:translateX(17px)}
.link-reset{font-size:12px;font-weight:600;color:var(--acento);text-decoration:underline;
  min-height:44px;text-align:right}
.ej-pie{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ej-pie details.como{flex:1;min-width:0}
.btn-swap{width:44px;height:44px;border:1px solid var(--linea);border-radius:8px;background:var(--fondo);
  font-size:16px;font-weight:700;color:var(--suave);flex:none;position:relative}
.btn-swap.manual{border-color:var(--acento);color:var(--acento)}
.btn-swap.manual::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;
  border-radius:50%;background:var(--acento)}

/* cómo se hace */
details.como{margin-top:6px}
details.como summary{list-style:none;font-size:12px;font-weight:700;color:var(--acento);
  min-height:32px;display:flex;align-items:center;cursor:pointer}
details.como summary::-webkit-details-marker{display:none}
details.como summary::before{content:"▸ ";margin-right:2px}
details.como[open] summary::before{content:"▾ "}
/* fondo blanco: casi todas las ilustraciones de wger traen fondo blanco y
   sobre el hormigón se les notaba el recorte */
.visual{width:100%;max-height:200px;display:flex;align-items:center;justify-content:center;
  background:#fff;border:1px solid var(--linea);border-radius:7px;overflow:hidden;margin-bottom:2px}
.visual img{max-width:100%;max-height:200px;object-fit:contain;display:block}
.visual svg{width:100%;max-height:200px}
.procedencia{font-size:11px;color:var(--suave);margin:2px 0 8px}
.ficha ol{padding-left:20px;margin:6px 0}
.ficha li{margin-bottom:4px;font-size:13px}
.ficha .cue{background:var(--fondo);border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:7px 9px;font-size:13px;font-weight:600;margin:8px 0}
.ficha .errores{font-size:12.5px;color:var(--suave);margin-bottom:8px}
.ficha .errores li{margin-bottom:2px}
.btn-video{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--linea);
  border-radius:8px;font-size:13px;font-weight:600;color:var(--tinta);text-decoration:none;background:var(--fondo)}

/* botones */
.btn-grande{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;
  border-radius:10px;font-size:16px;font-weight:800;letter-spacing:.02em}
.btn-acento{background:var(--acento);color:#fff}
.btn-acento:disabled{background:var(--linea);color:var(--suave)}
.btn-borde{border:1px solid var(--linea);background:var(--tarjeta)}
.btn-chico{min-height:44px;padding:0 14px;border:1px solid var(--linea);border-radius:8px;
  font-size:13px;font-weight:700;background:var(--tarjeta)}

/* ============ barra de sesión (cronómetro) ============ */
#barra{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));
  background:var(--tarjeta);border-top:1px solid var(--linea);display:none;z-index:20}
body.con-sesion #barra{display:block}
.barra-int{max-width:480px;margin:0 auto;padding:8px 12px 6px}
.barra-linea1{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.barra-estado{min-width:0;flex:1}
.barra-tramo{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
/* el nombre del ejercicio que viene es lo que se lee durante el descanso:
   se deja hasta en dos líneas antes que truncarlo */
.barra-info{font-size:14.5px;font-weight:800;line-height:1.2;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.barra-info small{font-weight:600;color:var(--suave)}
.barra-reloj{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.barra-reloj.pasado{color:var(--marca)}
.barra-reloj.descanso{color:var(--acento)}
.segmentos{display:flex;gap:2px;height:5px;margin:6px 0}
.segmentos .seg{background:var(--linea);border-radius:2px;overflow:hidden}
.segmentos .seg i{display:block;height:100%;background:var(--acento);width:0}
.barra-controles{display:flex;gap:4px}
.barra-controles button{flex:1;min-height:44px;border:1px solid var(--linea);border-radius:7px;
  background:var(--fondo);font-size:11px;font-weight:700;color:var(--tinta);padding:2px}
.barra-controles button:disabled{opacity:.35}
.barra-msj{font-size:11.5px;color:var(--marca);font-weight:600;min-height:15px;margin-top:3px}

/* ============ playback: la sesión conducida ============ */
body.en-playback main{padding-top:8px}
.pb-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.pb-puntos{display:flex;gap:3px;margin-bottom:10px}
.pb-puntos i{flex:1;height:4px;border-radius:2px;background:var(--linea)}
.pb-puntos i.ok{background:var(--acento)}
.pb-puntos i.aqui{background:var(--acento);box-shadow:0 0 0 2px var(--fondo),0 0 0 3px var(--acento)}
.pb-link{font-size:12px;font-weight:700;color:var(--acento);min-height:44px;padding:0 4px}
.pb-link:disabled{color:var(--linea)}

/* el reloj manda: es lo primero que se ve */
.pb-reloj{font-size:62px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;
  text-align:center;letter-spacing:-.02em}
.pb-reloj.descanso{color:var(--acento)}
.pb-reloj.pasado{color:var(--marca)}
.pb-reloj + .etq{display:block;text-align:center;margin:2px 0 12px}

.pb-caja{background:var(--tarjeta);border:1px solid var(--linea);border-radius:10px;padding:14px}
.pb-visual{height:170px;display:flex;align-items:center;justify-content:center;background:var(--fondo);
  border-radius:8px;overflow:hidden;margin-bottom:10px}
.pb-visual img{max-width:100%;max-height:170px;object-fit:contain}
.pb-visual svg{width:100%;max-height:170px}
.pb-visual svg.estatico{display:none}
.pb-nombre{font-size:25px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.pb-sub{font-size:14px;font-weight:600;color:var(--suave);margin-top:2px}
.pb-ctx{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--suave);margin-top:8px}
.pb-ultima{font-size:13px;color:var(--suave);margin-top:6px}

/* el botón que hace avanzar todo */
.pb-check{display:block;width:100%;min-height:76px;margin-top:14px;border-radius:12px;
  background:var(--acento);color:#fff;font-size:32px;font-weight:800;line-height:1}
.pb-check.pb-empezar{font-size:22px;letter-spacing:.02em}
.pb-nav{display:flex;align-items:center;justify-content:space-between;margin-top:2px}

/* descanso: los campos para corregir lo que quedó anotado */
.pb-hecho{font-size:16px;font-weight:800;margin-bottom:10px}
.pb-rec{color:var(--marca);font-size:12px;font-weight:700}
.pb-campos{display:flex;gap:10px;margin-bottom:14px}
.pb-campo{flex:1;border:1px solid var(--linea);border-radius:9px;background:var(--fondo);
  padding:6px 4px 4px;text-align:center}
.pb-campo:focus-within{border-color:var(--acento);outline:1px solid var(--acento);background:#fff}
.pb-campo input{width:100%;border:none;background:none;text-align:center;outline:none;
  font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-height:44px}
.pb-campo .etq{display:block}
.pb-sigue{border-top:1px solid var(--linea);padding-top:10px}
.pb-sigue-n{font-size:19px;font-weight:800;line-height:1.2;margin-top:2px}
.pb-sigue-img{height:92px;display:flex;align-items:center;justify-content:center;margin-top:8px;
  background:var(--fondo);border-radius:8px;overflow:hidden}
.pb-sigue-img img{max-width:100%;max-height:92px;object-fit:contain}
.pb-sigue-img svg{max-height:92px;width:100%}
.pb-sigue-img svg.estatico{display:none}
.pb-controles{display:flex;gap:6px;margin-top:12px}
.pb-controles .btn-chico{flex:1}
.pb-controles .btn-chico.acc{border-color:var(--acento);color:var(--acento);font-weight:800}
.pb-fin{text-align:center}
.pb-grande{font-size:26px;font-weight:800;margin-bottom:6px}

/* la preparación, con instrucciones de verdad */
.prep-lista{margin-top:10px}
.prep-item{border-top:1px solid var(--linea);padding:9px 0}
.prep-item:first-child{border-top:none}
.prep-tit{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.prep-tit b{font-size:15px}
.prep-tit span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--acento);white-space:nowrap}
.prep-item p{font-size:13px;color:var(--suave);margin-top:3px}

/* con el playback en pantalla, la barra de abajo se queda con lo esencial */
#barra.compacta #btnMas,#barra.compacta #btnMenos,#barra.compacta #btnSaltoD{display:none}

/* ============ navegación ============ */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--tarjeta);border-top:1px solid var(--linea);
  z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav-int{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--suave)}
nav button.sel{color:var(--acento)}
nav button svg{width:22px;height:22px}
nav button span{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

/* ============ progreso ============ */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--tarjeta);border:1px solid var(--linea);border-radius:10px;padding:10px 12px}
.kpi .num{font-size:28px;line-height:1.1}
.kpi .num small{font-size:13px;font-weight:700;color:var(--suave)}
.mapa{display:grid;grid-template-columns:24px repeat(4,1fr);gap:3px;align-items:center}
.mapa .rot{font-size:9px;font-weight:700;color:var(--suave);text-align:right;padding-right:2px;
  font-variant-numeric:tabular-nums}
.mapa .celda-mapa{aspect-ratio:3.2/1;border:1px solid var(--linea);border-radius:4px;background:var(--fondo)}
.mapa .celda-mapa.ok{background:var(--acento);border-color:var(--acento)}
/* sesión hecha sin mancuernas: se distingue, no se degrada */
.mapa .celda-mapa.sinpeso{background:repeating-linear-gradient(135deg,var(--acento) 0 5px,#5A6EEE 5px 10px)}
.mapa .celda-mapa.aqui{outline:2px solid var(--acento);outline-offset:1px}
.mapa .cab-col{font-size:9px;font-weight:700;color:var(--suave);text-align:center;letter-spacing:.1em}
.mapa .celda-mapa.nueva{animation:pintar .8s ease-out}
@keyframes pintar{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.barras8{display:flex;gap:6px;align-items:flex-end;height:64px;margin-top:8px}
.barras8 .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.barras8 .palo{width:100%;max-width:30px;background:var(--acento);border-radius:3px 3px 0 0;min-height:2px}
.barras8 .palo.cero{background:var(--linea)}
.barras8 small{font-size:9px;color:var(--suave);font-variant-numeric:tabular-nums}
.logros{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.logro{border:1px solid var(--linea);border-radius:8px;padding:8px 10px;background:var(--tarjeta)}
.logro b{display:block;font-size:13px}
.logro small{font-size:11px;color:var(--suave);display:block;margin-top:2px}
.logro.si{border-color:var(--marca)}
.logro.si b{color:var(--marca)}
.logro.no{opacity:.6}
.lista-rec{font-size:13px}
.lista-rec div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--linea)}
.lista-rec div:last-child{border-bottom:none}
.lista-rec span{color:var(--suave)}
.lista-rec b{font-variant-numeric:tabular-nums;white-space:nowrap}
select{width:100%;min-height:44px;border:1px solid var(--linea);border-radius:8px;background:var(--fondo);
  padding:0 10px;font:inherit;font-weight:600;-webkit-appearance:none;appearance:none}
.curva-svg{width:100%;margin-top:8px}
.curva-nota{font-size:11px;color:var(--suave);margin-top:4px}

/* ============ ejercicios / guía ============ */
.buscador{width:100%;min-height:48px;border:1px solid var(--linea);border-radius:10px;background:var(--tarjeta);
  padding:0 14px;font-size:15px;margin-bottom:12px;outline:none}
.buscador:focus{border-color:var(--acento)}
.guia h3{font-size:14px;letter-spacing:.04em;margin:18px 0 6px}
.guia p{font-size:13.5px;margin-bottom:8px}
.guia table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.guia td,.guia th{border:1px solid var(--linea);padding:6px 8px;text-align:left}
.guia th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.creditos-lista{font-size:12px;color:var(--suave)}
.creditos-lista li{margin-bottom:3px}

/* ============ pantalla de cierre ============ */
#cierre{position:fixed;inset:0;background:var(--fondo);z-index:50;display:none;overflow-y:auto}
#cierre.abierto{display:block}
.cierre-int{max-width:480px;margin:0 auto;padding:32px 16px;display:flex;flex-direction:column;gap:16px;min-height:100%}
.cierre-frase{font-size:22px;font-weight:800;line-height:1.3}
.cierre-datos{display:flex;gap:8px}
.cierre-datos .kpi{flex:1}
.logro-nuevo{border:1px solid var(--marca);border-radius:10px;padding:10px 12px;background:var(--tarjeta)}
.logro-nuevo .etq{color:var(--marca)}
.logro-nuevo b{font-size:15px}

/* modal simple (sesión colgada, confirmaciones) */
#modal{position:fixed;inset:0;background:rgba(20,23,27,.45);z-index:60;display:none;
  align-items:center;justify-content:center;padding:20px}
#modal.abierto{display:flex}
.modal-caja{background:var(--tarjeta);border-radius:12px;padding:18px;max-width:340px;width:100%}
.modal-caja h3{font-size:15px;margin-bottom:8px}
.modal-caja p{font-size:13px;color:var(--suave);margin-bottom:14px}
.modal-caja .btn-grande{margin-bottom:8px;min-height:48px;font-size:14px}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));
  background:var(--tinta);color:var(--fondo);border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;
  z-index:70;display:none;max-width:90%}
#toast.abierto{display:flex;align-items:center;gap:12px}
/* el toast va sobre tinta, así que el acento azul no contrasta: se aclara */
.toast-btn{color:#9DB0FF;font-weight:800;font-size:13px;text-decoration:underline;
  padding:6px 0;min-height:32px;white-space:nowrap}

/* ============ esquemas SVG animados ============ */
.esq .seg{stroke:var(--tinta);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.esq .seg-fino{stroke:var(--tinta);stroke-width:4;stroke-linecap:round;fill:none}
.esq .seg-suave{stroke:var(--linea);stroke-width:3;stroke-linecap:round;fill:none}

.esq .etq-esq{fill:var(--suave);font-size:12px;font-weight:600;text-anchor:middle;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.esq.estatico{display:none}
/* los keyframes rotan alrededor de pivotes en coordenadas del lienzo, así que
   el origen tiene que ser la esquina del viewBox, no el centro por defecto */
.esq.animado g{transform-box:view-box;transform-origin:0 0}
/* los @keyframes de los esquemas los genera cssEsquemas() al arrancar, desde la
   misma geometría que dibuja las figuras (ver ESQ en el script) */

/* movimiento: solo la celda del mapa y el cronómetro. Con reduced motion, nada. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .esq.animado{display:none}
  .esq.estatico{display:block}
}

function lget(k, def){ try{ const v = localStorage.getItem("fz_" + k); return v == null ? def : JSON.parse(v); }catch(e){ return def; } }
function lset(k, v){ try{ localStorage.setItem("fz_" + k, JSON.stringify(v)); }catch(e){} }
function ldel(k){ try{ localStorage.removeItem("fz_" + k); }catch(e){} }
function hoyISO(){ return new Date().toISOString(); }
function num(s){ if(s == null) return 0; const v = parseFloat(String(s).replace(",", ".").trim()); return isFinite(v) && v > 0 ? v : 0; }
function fmtNum(v){ return (Math.round(v * 10) / 10).toLocaleString("es-CL"); }
function fmtFecha(iso){ const d = new Date(iso); return String(d.getDate()).padStart(2,"0") + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function fmtReloj(ms){ const neg = ms < 0; ms = Math.abs(ms); const s = Math.round(ms / 1000); return (neg ? "+" : "") + Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }

/* ============ esquemas SVG propios ============
   Para los ejercicios que el catálogo de wger no tiene, o donde su imagen no
   muestra lo que define al ejercicio (la altura de las manos en la escalera de
   flexiones, por ejemplo).

   Un esquema se declara como geometría, no como SVG a mano: `fijo` son las
   piezas quietas (suelo, apoyos) y `piezas` las que se mueven, cada una con su
   pivote y su ángulo final. El motor arma el SVG y genera los @keyframes, así
   agregar un esquema es describir un movimiento, no escribir animaciones.
   Los pivotes van en coordenadas del lienzo 0 0 200 200: por eso ese viewBox
   no se toca y el encuadre se hace con un <g> envolvente. */
const SUELO = 172;
function ln(a, b, c){ return '<line class="' + (c || "seg") + '" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>'; }
function circ(p, r, c){ return '<circle class="' + (c || "seg") + '" cx="' + p[0] + '" cy="' + p[1] + '" r="' + r + '"/>'; }
function suelo(x1, x2){ return ln([x1 || 15, SUELO], [x2 || 185, SUELO], "seg-suave"); }
function apoyo(x, y, w){ return '<rect class="seg-suave" x="' + (x - w/2) + '" y="' + y + '" width="' + w + '" height="' + (SUELO - y) + '" rx="2"/>'; }
/* ángulo, en grados, que hace bajar `caida` píxeles un punto que gira a `radio` */
function angCaida(radio, caida){ return -Math.round(Math.asin(Math.min(0.95, caida / radio)) * 180 / Math.PI); }

/* --- flexiones: un solo rig para toda la escalera ---
   Lo único que cambia entre peldaños es a qué altura están las manos respecto
   de los pies, que es exactamente lo que hace a uno más difícil que el otro. */
function rigFlex(o){
  const xMano = o.xMano || 58, xPie = 165;
  const yMano = o.yMano, yPie = o.yPie == null ? SUELO - 6 : o.yPie;
  const yHombro = yMano - 30, xHombro = xMano + 8;
  const radio = Math.hypot(xPie - xHombro, yPie - yHombro);
  const piezas = [
    {id:"cuerpo", pivote:[xPie, yPie], ang:angCaida(radio, o.caida || 22),
     d: ln([xPie, yPie], [xHombro, yHombro]) + ln([xPie, yPie], [xPie + 6, SUELO]) +
        circ([xHombro - 17, yHombro - 8], 9)},
    {id:"brazo", pivote:[xMano, yMano], ang:-14, escY:0.42,
     d: '<path class="seg" vector-effect="non-scaling-stroke" d="M ' + xMano + " " + yMano +
        " L " + (xMano + 3) + " " + (yMano - 14) + " L " + xHombro + " " + yHombro + '"/>' +
        circ([xMano + 3, yMano - 14], 5, "acc-f") +
        (o.segundoBrazo ? '<path class="acc-s" vector-effect="non-scaling-stroke" d="M ' + xHombro + " " + yHombro +
          " L " + (xHombro + 42) + " " + (yMano - 2) + '"/>' : "")}
  ];
  const fijo = suelo() +
    (o.alturaApoyo ? apoyo(xMano, yMano, 26) : "") +
    (o.pieElevado ? apoyo(xPie, yPie, 30) : "");
  /* la caja incluye la cabeza (lo más alto) y el pie (lo más bajo) */
  return {fijo, piezas, caja:[13, yHombro - 19, 187, SUELO + 8]};
}

/* --- curl de bíceps con banda: solo gira el antebrazo ---
   La banda va en la parte quieta, anclada bajo el pie: si rotara con el
   antebrazo, su extremo se despegaría del suelo y quedaría flotando. */
function rigCurlBanda(){
  const pie = [96, SUELO], hombro = [100, 82], codo = [104, 118], mano = [101, 150];
  return {
    fijo: suelo(40, 165) +
      '<path class="acc-s" vector-effect="non-scaling-stroke" d="M ' + pie[0] + " " + pie[1] +
        " Q 90 " + (mano[1] - 12) + " " + mano[0] + " " + mano[1] + '"/>' +
      ln([100, 60], pie, "seg") +                       // torso y pierna, de una
      circ([99, 48], 9) +                               // cabeza
      ln(hombro, codo, "seg"),                          // brazo, quieto
    piezas: [
      {id:"antebrazo", pivote:codo, ang:-118,
       d: ln(codo, mano) + circ(codo, 5, "acc-f") + circ(mano, 4)}
    ],
    caja:[38, 37, 167, SUELO + 4]
  };
}

/* --- curl femoral deslizante: tumbado, cadera arriba, el talón se acerca --- */
function rigCurlToalla(){
  const hombro = [42, 150], cadera = [104, 122], rodilla = [128, 128], talon = [162, 158];
  return {
    fijo: suelo(20, 185) +
      circ([30, 148], 9) +                              // cabeza
      ln(hombro, cadera, "seg") +                       // tronco elevado
      ln(cadera, rodilla, "seg"),                       // muslo
    piezas: [
      {id:"canilla", pivote:rodilla, ang:-74,
       d: ln(rodilla, talon) + circ(rodilla, 5, "acc-f") +
          ln(talon, [talon[0] - 8, talon[1] + 8], "seg-fino")}
    ],
    caja:[18, 112, 187, SUELO + 4]
  };
}

/* --- goblet con talones elevados: cadena tobillo, rodilla, cadera --- */
function rigGoblet(){
  return {
    fijo: suelo(30, 175) +
      '<path class="acc-f" d="M 86 172 L 104 172 L 104 161 Z"/>' +   // la cuña bajo los talones
      ln([93, 160], [116, 169], "seg"),                              // pie
    piezas: [
      {id:"canilla", pivote:[100, 162], ang:26, d: ln([100, 162], [97, 121]) + circ([97, 121], 5, "acc-f"),
       hijos:[
        {id:"muslo", pivote:[97, 121], ang:-118, d: ln([97, 121], [94, 80]),
         hijos:[
          {id:"torso", pivote:[94, 80], ang:108,
           d: ln([94, 80], [96, 44]) + circ([97, 32], 9) +
              '<path class="seg-fino" d="M 95 50 L 84 62 L 88 71"/>' +
              circ([88, 78], 6, "seg-fino") +
              '<path class="seg-fino" d="M 84 72 Q 88 66 92 72"/>'}
         ]}
       ]}
    ],
    caja:[28, 21, 177, SUELO + 4]
  };
}

/* qué esquema usa cada ejercicio. El encuadre no se pone a mano: se calcula
   desde la caja que declara cada rig, así una figura no se sale del recuadro
   por haber movido un número. */
const ESQ = {
  flex_mesa:     {rig:() => rigFlex({yMano:112, alturaApoyo:true, caida:18})},
  flex_silla:    {rig:() => rigFlex({yMano:140, alturaApoyo:true, caida:20})},
  flex_deficit:  {rig:() => rigFlex({yMano:158, alturaApoyo:true, caida:30})},
  flex_arqueras: {rig:() => rigFlex({yMano:170, caida:26, segundoBrazo:true})},
  flex_diamante: {rig:() => rigFlex({yMano:170, xMano:74, caida:24})},
  curl_banda:    {rig:rigCurlBanda},
  curl_toalla:   {rig:rigCurlToalla},
  goblet_talones:{rig:rigGoblet}
};
/* encaja la caja del dibujo dentro de un lienzo de `ancho` x `alto`, con margen */
function encuadre(caja, ancho, alto, margen){
  const m = margen == null ? 6 : margen;
  const w = caja[2] - caja[0], h = caja[3] - caja[1];
  const zoom = Math.min((ancho - 2*m) / w, (alto - 2*m) / h);
  return {zoom,
    dx: (ancho - w * zoom) / 2 - caja[0] * zoom,
    dy: (alto - h * zoom) / 2 - caja[1] * zoom};
}

/* Ojo con los dos formatos: el atributo transform de SVG va sin unidades y con
   espacios, y el transform de CSS exige px y deg. Mezclarlos deja el keyframe
   vacío y la animación quieta, sin error visible. */
function trSVG(p){
  return 'transform="translate(' + p.pivote[0] + " " + p.pivote[1] + ") rotate(" + p.ang + ")" +
    (p.escY ? " scale(1 " + p.escY + ")" : "") +
    " translate(" + (-p.pivote[0]) + " " + (-p.pivote[1]) + ')"';
}
function trCSS(p){
  return "translate(" + p.pivote[0] + "px," + p.pivote[1] + "px) rotate(" + p.ang + "deg)" +
    (p.escY ? " scale(1," + p.escY + ")" : "") +
    " translate(" + (-p.pivote[0]) + "px," + (-p.pivote[1]) + "px)";
}
function piezasSVG(piezas, modo, clavePrefijo){
  return piezas.map(p => {
    const attr = modo === "anim" ? 'class="pz-' + clavePrefijo + "-" + p.id + '"'
               : modo === "fin" ? trSVG(p) : "";
    return "<g " + attr + ">" + p.d + piezasSVG(p.hijos || [], modo, clavePrefijo) + "</g>";
  }).join("");
}
function rigSVG(def, modo, clave){
  return def.fijo + piezasSVG(def.piezas, modo, clave);
}
/* los @keyframes se generan una sola vez, al arrancar */
function cssEsquemas(){
  let css = "";
  const recorrer = (piezas, clave) => piezas.forEach(p => {
    const n = "pz-" + clave + "-" + p.id;
    css += "@keyframes kf-" + n + "{0%,14%,88%,100%{transform:none}" +
      "46%,58%{transform:" + trCSS(p) + "}}" +
      "." + n + "{animation:kf-" + n + " 2.5s ease-in-out infinite}";
    recorrer(p.hijos || [], clave);
  });
  Object.keys(ESQ).forEach(k => recorrer(ESQ[k].rig().piezas, k));
  return css;
}
function esquemaSVG(k){
  const e = ESQ[k]; if(!e) return "";
  const def = e.rig();
  const caja = def.caja;
  const prop = (caja[3] - caja[1]) / (caja[2] - caja[0]);
  /* el lienzo animado va apaisado o cuadrado según la figura: una flexión es
     ancha y baja, una sentadilla es alta y angosta */
  const altoLienzo = Math.round(Math.max(96, Math.min(200, 200 * prop)));
  const a = encuadre(caja, 200, altoLienzo);
  /* el estático pone las dos poses lado a lado, con sitio abajo para el rótulo */
  const altoPose = Math.round(Math.max(56, Math.min(120, 100 * prop)));
  const p = encuadre(caja, 98, altoPose, 3);
  const altoEst = altoPose + 22;
  /* dos SVG hermanos, no dos capas del mismo: el animado necesita el lienzo
     0 0 200 200 intacto para sus pivotes, y el estático se encuadra a su gusto */
  return '<svg class="esq animado" viewBox="0 0 200 ' + altoLienzo + '" aria-hidden="true">' +
      '<g transform="translate(' + a.dx.toFixed(1) + " " + a.dy.toFixed(1) + ") scale(" + a.zoom.toFixed(3) + ')">' +
      rigSVG(def, "anim", k) + "</g></svg>" +
    '<svg class="esq estatico" viewBox="0 0 200 ' + altoEst + '" aria-hidden="true">' +
      '<g transform="translate(' + p.dx.toFixed(1) + " " + p.dy.toFixed(1) + ") scale(" + p.zoom.toFixed(3) + ')">' + rigSVG(def, "ini", k) + "</g>" +
      '<g transform="translate(' + (p.dx + 101).toFixed(1) + " " + p.dy.toFixed(1) + ") scale(" + p.zoom.toFixed(3) + ')">' + rigSVG(def, "fin", k) + "</g>" +
      '<text class="etq-esq" x="49" y="' + (altoEst - 6) + '">inicio</text>' +
      '<text class="etq-esq" x="150" y="' + (altoEst - 6) + '">fin</text>' +
    "</svg>";
}

/* ============ 3. programa ============ */
const FASES = {
  1:{rondas:2, rir:"3 a 4", nota:"Adaptación de tendones y técnica. No buscar el fallo."},
  2:{rondas:3, rir:"2",     nota:"Empieza a contar el volumen."},
  3:{rondas:3, rir:"0 a 1", nota:"Rest-pause en el cierre y variantes en estiramiento."}
};
const VARIANTES = {flex_pies:"flex_deficit", goblet:"goblet_talones"};
const TRAMOS = [
  {n:"Preparación", min:3},
  {n:"Bloque 1", min:10},
  {n:"Bloque 2", min:10},
  {n:"Cierre", min:4}
];
const SESIONES = [
 {id:"A", n:"Torso 1", dia:"lunes",
  b1:[{k:"press_banca", r:[8,15]}, {k:"remo_inclinado", r:[10,20]}],
  b2:[{k:"press_hombro", r:[10,15]}, {k:"dominada", max:true}],
  cierre:{ej:[{k:"laterales", r:[15,25]}], rondas:2}},
 {id:"B", n:"Pierna 1 · rodilla", dia:"martes",
  b1:[{k:"bulgara", r:[10,15], lado:"por pierna"}, {k:"gemelo", r:[15,25]}],
  b2:[{k:"goblet", r:[12,20]}, {k:"plancha", t:[30,45]}],
  cierre:{ej:[{k:"zancada", r:[12,12], lado:"por pierna"}], rondas:2, opcional:true}},
 {id:"C", n:"Torso 2", dia:"jueves",
  b1:[{k:"flex_pies", r:[10,20]}, {k:"remo_una_mano", r:[12,20], lado:"por lado"}],
  b2:[{k:"press_inclinado", r:[10,15]}, {k:"face_pull", r:[15,25]}],
  cierre:{ej:[{k:"curl_inclinado", r:[10,20]}, {k:"triceps", r:[10,20]}], rondas:2, ss:true}},
 {id:"D", n:"Pierna 2 · cadera", dia:"viernes o sábado",
  b1:[{k:"rdl", r:[10,20]}, {k:"gemelo", r:[15,25]}],
  b2:[{k:"hip_thrust", r:[12,20]}, {k:"curl_femoral", r:[15,25], lado:"por pierna"}],
  cierre:{ej:[{k:"puente", r:[15,15], lado:"por lado"}], rondas:2}}
];
/* ---- la preparación: 3 minutos con instrucciones, no un rótulo ----
   La movilidad cambia según el día (torso o pierna) y la aproximación se arma
   sola con el primer ejercicio de la sesión. */
const MOVILIDAD = {
  torso:[
    {n:"Círculos de brazos", c:"10 adelante y 10 atrás",
     d:"De pie, brazos estirados a los lados. Círculos grandes, lo más amplios que den los hombros."},
    {n:"Palo de escoba por encima de la cabeza", c:"8 pasadas",
     d:"Toma un palo de escoba con las manos bien separadas. Pásalo de adelante hacia atrás por sobre la cabeza, brazos estirados, sin forzar. Si te cuesta, separa más las manos."},
    {n:"Rotaciones de tronco", c:"8 por lado",
     d:"De rodillas o sentado, una mano en la nuca. Gira el pecho hacia ese lado abriendo el codo al techo, y vuelve."},
    {n:"Gato y vaca", c:"8 lentas",
     d:"En cuatro apoyos. Redondea la espalda mirando al ombligo, después hunde y abre el pecho. Acompaña con la respiración."}
  ],
  pierna:[
    {n:"Sentadilla profunda sostenida", c:"30 segundos",
     d:"Agárrate de algo firme y baja hasta el fondo. Quédate ahí, talones en el suelo, empujando las rodillas hacia afuera con los codos."},
    {n:"Balanceo de pierna adelante y atrás", c:"10 por lado",
     d:"Agarrado de la pared, balancea una pierna suelta como péndulo. Sin forzar el rango, que suba solo."},
    {n:"Balanceo de pierna de lado a lado", c:"10 por lado",
     d:"Mismo apoyo, ahora cruzando la pierna por delante del cuerpo y abriendo hacia afuera."},
    {n:"Rodilla a la pared", c:"8 por lado",
     d:"Pie a un palmo de la pared. Lleva la rodilla a tocarla sin despegar el talón. Si llegas fácil, aleja más el pie."},
    {n:"Puente de glúteo", c:"10",
     d:"De espaldas, pies apoyados. Sube la cadera apretando el glúteo, pausa arriba un segundo, baja controlado."}
  ]
};
function tipoMovilidad(sid){ return (sid === "A" || sid === "C") ? "torso" : "pierna"; }
/* la aproximación se refiere siempre al primer ejercicio del día */
function textoAproximacion(ses){
  const k = ejActivo(ses, 1, 0);
  const nombre = LIB[k] ? LIB[k].n.toLowerCase() : "el primer ejercicio";
  return {n:"Series de aproximación", c:"2 series de 6",
    d:"Haz " + nombre + " con la mitad del peso que vas a usar, 6 repeticiones suaves, dos veces. " +
      "Sirve para que el cuerpo recuerde el movimiento y para calibrar si el peso elegido es el correcto. " +
      "No se anota y no cuenta como serie."};
}
function sesionDe(id){ return SESIONES.find(s => s.id === id); }
function faseActual(){ return lget("fase", 1); }
function ejEfectivo(k){ return (faseActual() === 3 && VARIANTES[k]) ? VARIANTES[k] : k; }
function rondasDe(tramo, ses){ return tramo === 3 ? ses.cierre.rondas : FASES[faseActual()].rondas; }
function ejerciciosDeTramo(ses, tramo){
  return tramo === 1 ? ses.b1 : tramo === 2 ? ses.b2 : tramo === 3 ? ses.cierre.ej : [];
}

/* ---- qué ejercicio ocupa cada casilla hoy ----
   Las casillas se pueden cambiar por su sustituto de calistenia, de a una o
   toda la sesión de golpe. El estado dura el día: mañana la sesión vuelve a
   arrancar con mancuernas, porque el cambio es la excepción. Vive aparte de
   `fz_sesion_activa` para que también funcione sin haber empezado la sesión. */
function fechaCorta(d){ const x = d || new Date(); return x.getFullYear() + "-" + (x.getMonth()+1) + "-" + x.getDate(); }
function casillasHoy(){
  const c = lget("casillas", null);
  if(!c || c.fecha !== fechaCorta()) return {fecha:fechaCorta(), ses:{}, sw:{}};
  c.ses = c.ses || {}; c.sw = c.sw || {};
  return c;
}
function guardarCasillas(c){ c.fecha = fechaCorta(); lset("casillas", c); }
function cid(tramo, idx){ return tramo + "-" + idx; }
/* el ejercicio "de fábrica" de una casilla, ya con la variante de fase 3 */
function ejBase(ses, tramo, idx){
  const item = ejerciciosDeTramo(ses, tramo)[idx];
  return item ? ejEfectivo(item.k) : null;
}
/* el que corresponde según el interruptor de la sesión, sin cambios manuales */
function ejSegunInterruptor(ses, tramo, idx){
  const base = ejBase(ses, tramo, idx);
  if(!base) return null;
  return (casillasHoy().sw[ses.id] && LIB[base].sinPeso) ? LIB[base].sinPeso : base;
}
/* el que está puesto de verdad ahora */
function ejActivo(ses, tramo, idx){
  const base = ejBase(ses, tramo, idx);
  if(!base) return null;
  const ov = (casillasHoy().ses[ses.id] || {})[cid(tramo, idx)];
  return (ov && LIB[ov]) ? ov : base;
}
function esManual(ses, tramo, idx){ return ejActivo(ses, tramo, idx) !== ejSegunInterruptor(ses, tramo, idx); }
function cambiables(ses){
  let n = 0;
  [1,2,3].forEach(t => ejerciciosDeTramo(ses, t).forEach((it, i) => { if(LIB[ejBase(ses, t, i)].sinPeso) n++; }));
  return n;
}
function nCambiadas(ses){
  let n = 0;
  [1,2,3].forEach(t => ejerciciosDeTramo(ses, t).forEach((it, i) => { if(ejActivo(ses, t, i) !== ejBase(ses, t, i)) n++; }));
  return n;
}
function modoSesion(ses){
  const n = nCambiadas(ses);
  return n === 0 ? "normal" : (n >= cambiables(ses) ? "calistenia" : "mixto");
}
/* alterna una casilla suelta entre su versión con mancuernas y la de calistenia */
function alternarCasilla(sid, tramo, idx){
  const ses = sesionDe(sid);
  const base = ejBase(ses, tramo, idx);
  const alt = LIB[base].sinPeso;
  if(!alt){ aviso("Esta casilla es la misma con o sin mancuernas."); return; }
  const c = casillasHoy();
  c.ses[sid] = c.ses[sid] || {};
  const k = cid(tramo, idx);
  const actual = ejActivo(ses, tramo, idx);
  if(actual === base) c.ses[sid][k] = alt; else delete c.ses[sid][k];
  guardarCasillas(c);
  pintarHoy();
}
/* el interruptor de la sesión: manda sobre todas, incluidas las manuales */
function alternarSesion(sid){
  const ses = sesionDe(sid);
  const c = casillasHoy();
  const previo = JSON.stringify({ses:c.ses[sid] || {}, sw:!!c.sw[sid]});
  const habiaManuales = [1,2,3].some(t => ejerciciosDeTramo(ses, t).some((it, i) => esManual(ses, t, i)));
  const activar = !c.sw[sid];
  c.sw[sid] = activar;
  c.ses[sid] = {};
  let n = 0;
  [1,2,3].forEach(t => ejerciciosDeTramo(ses, t).forEach((it, i) => {
    const base = ejBase(ses, t, i);
    if(activar && LIB[base].sinPeso){ c.ses[sid][cid(t, i)] = LIB[base].sinPeso; n++; }
  }));
  guardarCasillas(c);
  pintarHoy();
  if(habiaManuales){
    const cuantas = activar ? n : cambiables(ses);
    aviso("Cambié las " + cuantas + ", toca deshacer si no era eso", () => {
      const p = JSON.parse(previo);
      const c2 = casillasHoy();
      c2.ses[sid] = p.ses; c2.sw[sid] = p.sw;
      guardarCasillas(c2); pintarHoy();
    });
  }
}
function volverAOriginal(sid){
  const c = casillasHoy();
  delete c.ses[sid]; delete c.sw[sid];
  guardarCasillas(c);
  pintarHoy();
}

/* celdas de una sesión en orden temporal: [{tramo, idx, k, item, ronda}] */
function celdasSesion(ses){
  const out = [];
  [1, 2, 3].forEach(tr => {
    const nR = rondasDe(tr, ses);
    for(let r = 0; r < nR; r++)
      ejerciciosDeTramo(ses, tr).forEach((item, idx) =>
        out.push({tramo:tr, idx, k:ejActivo(ses, tr, idx), item, ronda:r}));
  });
  return out;
}

/* ============ registro (logs) ============ */
let semana = lget("semana", 1);
let sesionSel = null;   // id A..D
let vista = "hoy";

function logDe(sid, k, w){ return lget("log_" + sid + "_" + k + "_s" + (w || semana), null); }
function setRonda(sid, k, i, val){
  const key = "log_" + sid + "_" + k + "_s" + semana;
  const log = lget(key, {fecha:hoyISO(), rondas:[]});
  log.fecha = hoyISO();
  while(log.rondas.length <= i) log.rondas.push({});
  log.rondas[i] = val;
  lset(key, log);
  return log;
}
function rondaValida(r){ return !!r && (num(r.reps) > 0 || num(r.seg) > 0); }
function sesionHecha(w, sid){ return lget("sesion_" + w + "_" + sid, null); }

/* récords */
function esTiempo(k){ return LIB[k].tipo === "tiempo"; }
function chequearRecord(k, r){
  const pr = lget("pr_" + k, null);
  let esRec = false, nuevo = pr ? Object.assign({}, pr) : {};
  if(esTiempo(k)){
    const s = num(r.seg); if(!s) return false;
    if(pr && s > (pr.seg || 0)) esRec = true;
    if(!pr || s > (nuevo.seg || 0)) Object.assign(nuevo, {seg:s, semana, fecha:hoyISO()});
  } else {
    const kg = num(r.kg), reps = num(r.reps); if(!reps) return false;
    if(kg > 0){
      const vol = kg * reps;
      if(pr && pr.volumen && vol > pr.volumen) esRec = true;
      if(!pr || vol > (nuevo.volumen || 0)) Object.assign(nuevo, {kg, reps, volumen:vol, semana, fecha:hoyISO()});
    } else {
      if(pr && reps > (pr.reps || 0) && !pr.volumen) esRec = true;
      if(!pr || (!nuevo.volumen && reps > (nuevo.reps || 0))) Object.assign(nuevo, {reps, semana, fecha:hoyISO()});
    }
  }
  lset("pr_" + k, nuevo);
  if(esRec) lset("nrecords", lget("nrecords", 0) + 1);
  return esRec;
}

/* última vez y objetivo */
function ultimaVez(sid, k){
  const base = LIB[k].progresaDe || k;
  const cadena = [k]; if(LIB[k].progresaDe) cadena.push(LIB[k].progresaDe);
  if(VARIANTES[k]) cadena.push(VARIANTES[k]);
  for(let w = semana - 1; w >= 1; w--){
    for(const kk of cadena){
      const log = logDe(sid, kk, w);
      if(log && log.rondas.some(rondaValida)) return {w, k:kk, log};
    }
  }
  return null;
}
function topeDe(item){ return item.t ? item.t[1] : (item.r ? item.r[1] : null); }
/* `k` es el ejercicio que ocupa la casilla ahora, que puede no ser el del
   programa si se cambió por su versión de calistenia */
function textoObjetivo(sid, item, k){
  const u = ultimaVez(sid, k);
  const f = faseActual();
  if(item.max){
    if(!u) return "Máximas con buena técnica. Si no sale ninguna, negativas de 5 segundos (cada una cuenta como 1).";
    const mejor = Math.max(...u.log.rondas.map(r => num(r.reps)));
    return "La última vez: " + mejor + " en la mejor ronda. Iguala o suma una.";
  }
  if(item.t){
    if(!u) return "Primera vez. Aguanta entre " + item.t[0] + " y " + item.t[1] + " s con buena forma.";
    const mejor = Math.max(...u.log.rondas.map(r => num(r.seg)));
    return "Objetivo: " + (mejor + 5) + " s (tu mejor marca más 5).";
  }
  if(!u) return "Primera vez. Elige un peso con el que llegues a " + item.r[0] + " reps con RIR " + FASES[f].rir + ".";
  const tope = item.r[1];
  const validas = u.log.rondas.filter(rondaValida);
  const alTope = validas.length && validas.every(r => num(r.reps) >= tope);
  if(!alTope) return "Objetivo: " + tope + " reps en todas las rondas antes de cambiar nada.";
  let paso;
  if(LIB[k].tipo === "peso_corporal" || LIB[k].tipo === "banda")
    paso = "baja en 3 o 4 segundos con pausa de 2 abajo, y después sube de peldaño";
  else if(f === 1) paso = "al pasar a la fase 2 se suma una ronda";
  else if(f === 2) paso = VARIANTES[item.k] ? "en la fase 3 pasas a la variante más difícil" : "busca más rango de movimiento (más profundidad, más estiramiento)";
  else paso = "más rango de movimiento; en el cierre, comprime con rest-pause";
  return "Techo alcanzado. Listo para el siguiente paso: " + paso + ".";
}
function textoUltima(sid, item, k){
  const u = ultimaVez(sid, k);
  if(!u) return "";
  const vals = u.log.rondas.filter(rondaValida).map(r =>
    esTiempo(u.k) ? num(r.seg) + " s" : (num(r.kg) ? fmtNum(num(r.kg)) + " kg × " : "") + num(r.reps)).join(", ");
  const nota = (u.k !== k && LIB[u.k]) ? " (" + LIB[u.k].n.toLowerCase() + ")" : "";
  return "Última vez (sem " + u.w + nota + "): " + vals;
}

/* ============ 4. cronómetro de sesión ============ */
/* Todo se calcula con marcas de tiempo (Date.now), nunca acumulando intervalos:
   la pantalla apagada o el navegador en segundo plano no lo atrasan. */
let tickInt = null;
let wakeLock = null;
let audioCtx = null;

function sa(){ return lget("sesion_activa", null); }
function saGuardar(s){ if(s) lset("sesion_activa", s); else ldel("sesion_activa"); }
function saElapsed(s){
  const pausadoExtra = s.pausadoEn ? (Date.now() - new Date(s.pausadoEn).getTime()) : 0;
  return Date.now() - new Date(s.inicioISO).getTime() - (s.msPausados || 0) - pausadoExtra;
}
function tramoBudget(t){ return TRAMOS[t].min * 60000; }
function tramoRestante(s){ return tramoBudget(s.tramo) - (saElapsed(s) - s.tramoIniMs); }

function iniciarAudio(){
  try{ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
}
function beep(veces){
  if(!lget("sonido", true) || !audioCtx) return;
  try{
    for(let i = 0; i < veces; i++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = 880; g.gain.value = 0.15;
      const t0 = audioCtx.currentTime + i * 0.22;
      o.start(t0); g.gain.setValueAtTime(0.15, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
      o.stop(t0 + 0.16);
    }
  }catch(e){}
}
function vibrar(patron){ try{ if(navigator.vibrate) navigator.vibrate(patron); }catch(e){} }
async function pedirWakeLock(){
  try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
function soltarWakeLock(){ try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){} }
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && sa()){ pedirWakeLock(); tick(); }
});

function empezarSesion(){
  const ses = sesionDe(sesionSel);
  if(!ses) return;
  const activa = sa();
  if(activa && (activa.sesionId !== sesionSel || activa.semana !== semana)){
    abrirModal("Hay una sesión activa",
      "Quedó abierta la sesión " + activa.sesionId + " de la semana " + activa.semana + ". ¿La descartas para empezar esta?",
      [["Descartarla y empezar", () => { saGuardar(null); empezarSesion(); cerrarModal(); }],
       ["Volver", cerrarModal]]);
    return;
  }
  iniciarAudio();
  saGuardar({sesionId:sesionSel, semana, inicioISO:hoyISO(), msPausados:0, pausadoEn:null,
    tramo:0, tramoIniMs:0, finDescansoISO:null, av60:false, av0:false,
    estado:"trabajo", ronda:0, ejercicioIdx:0,
    idx:0, ejIniISO:hoyISO()});   /* el playback arranca en la preparación */
  pedirWakeLock();
  verLista = false;
  document.body.classList.add("con-sesion");
  pintarHoy(); tick();
}
function avanzarTramo(s, aviso){
  if(s.tramo >= 3) return;
  s.tramo++; s.tramoIniMs = saElapsed(s); s.av60 = false; s.av0 = false;
  if(aviso){ beep(2); vibrar([120, 80, 120]); }
  saGuardar(s);
}
function saltarTramo(){
  const s = sa(); if(!s) return;
  iniciarAudio();
  if(s.tramo >= 3){ aviso("Ya estás en el cierre. Cuando termines, toca Terminar sesión."); return; }
  avanzarTramo(s, true); tick();
}
function pausarReanudar(){
  const s = sa(); if(!s) return;
  if(s.pausadoEn){
    const ms = Date.now() - new Date(s.pausadoEn).getTime();
    s.msPausados = (s.msPausados || 0) + ms;
    if(s.finDescansoISO) s.finDescansoISO = new Date(new Date(s.finDescansoISO).getTime() + ms).toISOString();
    s.pausadoEn = null;
  } else {
    s.pausadoEn = hoyISO();
  }
  saGuardar(s); tick();
}
function iniciarDescanso(seg){
  const s = sa(); if(!s || s.pausadoEn) return;
  s.finDescansoISO = new Date(Date.now() + seg * 1000).toISOString();
  s.estado = "descanso";
  saGuardar(s); tick();
}
function ajustarDescanso(seg){
  const s = sa(); if(!s || !s.finDescansoISO) return;
  s.finDescansoISO = new Date(new Date(s.finDescansoISO).getTime() + seg * 1000).toISOString();
  saGuardar(s); tick();
}
function saltarDescanso(){
  const s = sa(); if(!s || !s.finDescansoISO) return;
  s.finDescansoISO = null; s.estado = "trabajo";
  saGuardar(s); tick();
}
function toggleSonido(){
  lset("sonido", !lget("sonido", true));
  iniciarAudio(); tick();
  aviso(lget("sonido", true) ? "Sonido activado" : "Sonido apagado");
}

/* ================= el playback =================
   Una vez que la sesión arranca, la app deja de ser una lista para llenar y
   pasa a conducir: un paso a la vez, con su cronómetro. Los pasos son la
   preparación más las celdas que ya calcula celdasSesion(), así que el orden
   sale del programa y no hay una segunda fuente de verdad. */
function pasosSesion(ses){
  return [{tipo:"prep"}].concat(celdasSesion(ses).map(c => Object.assign({tipo:"serie"}, c)));
}
function pasoActual(s, ses){
  const pasos = pasosSesion(ses);
  let i;
  if(s.idx == null){
    /* sesión empezada antes de que existiera el playback: se retoma en la
       primera serie sin registrar, no desde el principio */
    i = pasos.findIndex(p => p.tipo === "serie" &&
      !rondaValida((logDe(ses.id, p.k) || {rondas:[]}).rondas[p.ronda]));
    if(i < 0) i = pasos.length;
  } else i = s.idx;
  i = Math.max(0, Math.min(pasos.length, i));
  return {pasos, i, paso: pasos[i] || null};
}
/* cuánto se estima que dura una serie: las repeticiones del tope por unos 3
   segundos. Es un referente, no un plazo: al llegar a cero no pasa nada. */
function estimadoSerie(paso){
  if(!paso || paso.tipo !== "serie") return 0;
  const it = paso.item;
  if(it.t) return it.t[1] * 1000;
  if(it.max) return 30000;
  return (it.r ? it.r[1] : 12) * 3000;
}
function esDeTiempo(paso){ return !!(paso && paso.tipo === "serie" && paso.item.t); }

/* El valor que queda anotado al apretar el check, para que el registro nunca
   quede vacío. Se sugiere lo que hizo la vez pasada, no el tope del rango: si
   sugiriera el tope y no lo corrigiera, el registro diría que siempre llega al
   techo y la curva de progreso mentiría. */
function valorSugerido(sid, paso){
  const k = paso.k, it = paso.item;
  const u = ultimaVez(sid, k);
  const mejor = u ? Math.max.apply(null, u.log.rondas.map(r => esTiempo(k) ? num(r.seg) : num(r.reps))) : 0;
  if(esTiempo(k)) return {seg: mejor || (it.t ? it.t[0] : 30)};
  return {kg: kgHeredado(sid, k, paso.ronda),
          reps: mejor || (it.r ? it.r[0] : 8)};
}

/* siguiente celda por llenar de la sesión activa (para "qué viene") */
function proximaCelda(ses){
  const celdas = celdasSesion(ses);
  for(const c of celdas){
    const log = logDe(ses.id, c.k);
    if(!log || !rondaValida(log.rondas[c.ronda])) return c;
  }
  return null;
}

function tick(){
  const s = sa();
  document.body.classList.toggle("con-sesion", !!s);
  document.body.classList.toggle("en-playback", enPlayback());
  if(!s) return;
  if(vista === "hoy") refrescarPB();
  const ses = sesionDe(s.sesionId);
  const el = saElapsed(s);
  const rest = tramoRestante(s);

  /* preparación avanza sola a los 3 minutos, y el playback la sigue: si no,
     la barra diría "bloque 1" con la tarjeta de calentamiento en pantalla */
  if(s.tramo === 0 && rest <= 0){
    avanzarTramo(s, true);
    if(s.idx === 0) pbIr(1);
    return tick();
  }

  /* fin de descanso */
  if(s.finDescansoISO && !s.pausadoEn){
    const dRest = new Date(s.finDescansoISO).getTime() - Date.now();
    if(dRest <= 0){
      s.finDescansoISO = null; s.estado = "trabajo"; saGuardar(s);
      beep(1); vibrar(150);
      if(s.idx != null){
        /* en playback el descanso termina pasando solo al siguiente ejercicio */
        pbIr(s.idx + 1);
      } else {
        /* si el bloque quedó completo, pasa solo al siguiente tramo */
        const prox = proximaCelda(ses);
        if(prox && prox.tramo > s.tramo && s.tramo > 0) avanzarTramo(s, true);
      }
    }
  }

  /* avisos de tramo (solo bloques y cierre) */
  if(s.tramo > 0){
    if(rest <= 60000 && rest > 0 && !s.av60){ s.av60 = true; saGuardar(s); }
    if(rest <= 0 && !s.av0){ s.av0 = true; saGuardar(s); beep(2); vibrar([100, 60, 100]); }
  }

  /* ---- pintar barra ---- */
  const enDescanso = !!s.finDescansoISO;
  const prox = proximaCelda(ses);
  $("#bTramo").textContent = TRAMOS[s.tramo].n + (s.pausadoEn ? " · en pausa" : "") +
    " · total " + fmtReloj(el);
  /* En playback la pantalla ya grita el ejercicio y su reloj. Abajo queda lo
     que la pantalla no dice: cuánto le va quedando al tramo. */
  if(enPlayback()){
    $("#bReloj").textContent = fmtReloj(rest);
    $("#bReloj").className = "barra-reloj" + (rest < 0 ? " pasado" : "");
    $("#bInfo").innerHTML = "<small>quedan del " + TRAMOS[s.tramo].n.toLowerCase() + "</small>";
    pintarSegmentos(segsDe(el, s));
    $("#bMsj").textContent = (s.tramo > 0 && rest < 0) ? "Vas pasado. Cierra esta ronda y sigue."
      : (s.tramo > 0 && rest <= 60000) ? "Queda 1 minuto. ¿Alcanza otra ronda?" : "";
    $("#btnPausa").textContent = s.pausadoEn ? "Seguir" : "Pausa";
    $("#btnSonido").textContent = lget("sonido", true) ? "Son. ✓" : "Son. ✗";
    $("#barra").classList.add("compacta");
    return;
  }
  if(enDescanso){
    const dRest = Math.max(0, new Date(s.finDescansoISO).getTime() - Date.now());
    $("#bReloj").textContent = fmtReloj(dRest);
    $("#bReloj").className = "barra-reloj descanso";
    $("#bInfo").innerHTML = prox
      ? "Sigue: <b>" + LIB[prox.k].n + "</b> <small>· ronda " + (prox.ronda + 1) + "</small>"
      : "Descanso";
  } else {
    $("#bReloj").textContent = fmtReloj(rest);
    $("#bReloj").className = "barra-reloj" + (rest < 0 ? " pasado" : "");
    if(s.tramo === 0){
      $("#bInfo").innerHTML = "Movilidad y series de aproximación";
    } else if(prox && prox.tramo === s.tramo){
      $("#bInfo").innerHTML = "<b>" + LIB[prox.k].n + "</b> <small>· ronda " + (prox.ronda + 1) + "</small>";
    } else if(prox){
      $("#bInfo").innerHTML = "<small>Bloque listo. Sigue:</small> <b>" + LIB[prox.k].n + "</b>";
    } else {
      $("#bInfo").innerHTML = "Todo registrado. Toca Terminar sesión.";
    }
  }
  let msj = "";
  if(s.tramo > 0 && rest < 0) msj = "Vas pasado. Cierra esta ronda y sigue al próximo tramo.";
  else if(s.tramo > 0 && rest <= 60000) msj = "Queda 1 minuto. ¿Alcanza otra ronda?";
  $("#bMsj").textContent = msj;
  $("#btnPausa").textContent = s.pausadoEn ? "Seguir" : "Pausa";
  $("#btnMas").disabled = $("#btnMenos").disabled = $("#btnSaltoD").disabled = !enDescanso;
  /* la pantalla del playback ya trae ±30 s y "Listo": abajo quedan solo el
     reloj total, la pausa, el salto de tramo y el sonido */
  $("#barra").classList.toggle("compacta", enPlayback());
  $("#btnSonido").textContent = lget("sonido", true) ? "Son. ✓" : "Son. ✗";

  pintarSegmentos(segsDe(el, s));
}
/* cuánto lleva lleno cada tramo. Con saltos de tramo el tiempo global no calza
   con las fronteras, así que se calcula por tramo actual y no por reloj global. */
function segsDe(el, s){
  let acum = 0;
  return TRAMOS.map((t, i) => {
    const ini = acum; acum += t.min * 60000;
    if(i < s.tramo) return 1;
    if(i > s.tramo) return 0;
    return Math.min(1, Math.max(0, (el - ini) / (t.min * 60000)));
  });
}
function pintarSegmentos(fracs){
  const segs = $("#bSegs");
  if(!segs.childElementCount){
    TRAMOS.forEach(t => {
      const d = document.createElement("div");
      d.className = "seg"; d.style.flex = String(t.min);
      d.innerHTML = "<i></i>";
      segs.appendChild(d);
    });
  }
  fracs.forEach((f, i) => { segs.children[i].firstElementChild.style.width = (f * 100) + "%"; });
}

/* sesión colgada de hace más de 3 horas */
function revisarSesionColgada(){
  const s = sa(); if(!s) return;
  if(Date.now() - new Date(s.inicioISO).getTime() > 3 * 3600000){
    abrirModal("Quedó una sesión abierta",
      "Sesión " + s.sesionId + " de la semana " + s.semana + ", empezada hace más de 3 horas. ¿Qué hacemos con ella?",
      [["Cerrarla con lo registrado", () => { cerrarModal(); terminarSesionDe(s.semana, s.sesionId, true); }],
       ["Descartarla", () => { saGuardar(null); cerrarModal(); document.body.classList.remove("con-sesion"); pintar(); }]]);
  }
}

/* ============ registro desde la grilla ============ */
function celdaCambio(sid, k, i){
  const ses = sesionDe(sid);
  const t = esTiempo(k);
  let val;
  if(t){
    val = {seg: num(($("#g_" + sid + "_" + k + "_" + i) || {}).value)};
  } else {
    const kgIn = $("#k_" + sid + "_" + k + "_" + i), rpIn = $("#r_" + sid + "_" + k + "_" + i);
    /* si no puso peso, hereda el de la ronda anterior o el de la última vez */
    if(rpIn && num(rpIn.value) > 0 && kgIn && !num(kgIn.value)){
      const her = kgHeredado(sid, k, i);
      if(her){ kgIn.value = fmtNum(her); }
    }
    val = {kg: num((kgIn || {}).value), reps: num((rpIn || {}).value)};
  }
  if(!rondaValida(val)){ setRonda(sid, k, i, val); actualizarMeta(sid, k); return; }
  const esRec = chequearRecord(k, val);
  if(esRec) val.rec = 1;
  else { const prev = (logDe(sid, k) || {rondas:[]}).rondas[i]; if(prev && prev.rec) val.rec = 1; }
  setRonda(sid, k, i, val);
  const dot = $("#rec_" + sid + "_" + k + "_" + i);
  if(dot && val.rec){ dot.classList.add("si"); const lin = $("#recl_" + sid + "_" + k); if(lin){ lin.textContent = "● récord"; lin.classList.add("si"); } }
  actualizarMeta(sid, k);
  abrirCeldaSiguiente(sid, k, i);
  /* el descanso arranca solo al anotar, si la sesión está corriendo */
  const s = sa();
  if(s && s.sesionId === sid && s.semana === semana && !s.pausadoEn){
    /* si anotó algo de un tramo posterior, el cronómetro lo sigue */
    const prox = proximaCelda(ses);
    const celda = celdasSesion(ses).find(c => c.k === k && !rondaValida((logDe(sid, c.k) || {rondas:[]}).rondas[c.ronda]));
    const tramoDe = celdasSesion(ses).filter(c => c.k === k).map(c => c.tramo)[0] || 1;
    if(s.tramo === 0) avanzarTramo(s, false);
    const s2 = sa();
    if(tramoDe > s2.tramo){ s2.tramo = tramoDe; s2.tramoIniMs = saElapsed(s2); s2.av60 = false; s2.av0 = false; saGuardar(s2); }
    iniciarDescanso(60);
  }
  actualizarBotonTerminar(sid);
}
/* Las rondas se abren de a una para que la grilla no sea un muro de casillas
   vacías. Hay que abrir la siguiente en el sitio, sin repintar la lista: si se
   repinta mientras se escribe, se pierde el foco y el teclado se cierra. */
function abrirCeldaSiguiente(sid, k, i){
  const cont = $("#celdas_" + sid + "_" + k);
  if(!cont) return;
  const nR = cont.children.length;
  const sig = cont.children[i + 1];
  if(!sig || sig.querySelector("input")) return;
  sig.outerHTML = celdaHTML(sid, k, i + 1, nR);
}
function kgHeredado(sid, k, i){
  const log = logDe(sid, k);
  if(log) for(let j = i - 1; j >= 0; j--) if(log.rondas[j] && num(log.rondas[j].kg)) return num(log.rondas[j].kg);
  const u = ultimaVez(sid, k);
  if(u){ const con = u.log.rondas.filter(r => num(r.kg)); if(con.length) return num(con[con.length - 1].kg); }
  return 0;
}
function actualizarMeta(sid, k){
  const el = $("#meta_" + sid + "_" + k);
  if(!el) return;
  const ses = sesionDe(sid);
  const celda = celdasSesion(ses).find(c => c.k === k);
  if(celda) el.innerHTML = metaHTML(sid, celda.item, k);
}
function actualizarBotonTerminar(sid){
  const b = $("#btnTerminar"); if(!b) return;
  const n = seriesValidas(sid).length;
  b.disabled = n === 0 || !!sesionHecha(semana, sid);
}
function seriesValidas(sid){
  const ses = sesionDe(sid);
  const out = [];
  celdasSesion(ses).forEach(c => {
    const log = logDe(sid, c.k);
    const r = log && log.rondas[c.ronda];
    if(rondaValida(r)) out.push({c, r});
  });
  return out;
}

/* ============ 6. refuerzo: racha, logros, cierre ============ */
function ordenSesion(w, sid){ return (w - 1) * 4 + SESIONES.findIndex(s => s.id === sid); }
function todasLasSesiones(){
  const out = [];
  for(let w = 1; w <= 12; w++) SESIONES.forEach(s => {
    const dato = sesionHecha(w, s.id);
    out.push({w, sid:s.id, hecha:!!dato, fecha:dato ? new Date(dato.fecha) : null});
  });
  return out;
}
function calcRacha(){
  const todas = todasLasSesiones();
  let ultimo = -1;
  todas.forEach((s, i) => { if(s.hecha) ultimo = i; });
  if(ultimo < 0) return {n:0, pausa:false};
  let n = 0, salto = false, prevFecha = null;
  for(let i = 0; i <= ultimo; i++){
    const s = todas[i];
    if(s.hecha){
      if(salto){
        if(prevFecha && (s.fecha - prevFecha) / 86400000 <= 10) n++;
        else n = 1;
        salto = false;
      } else n++;
      prevFecha = s.fecha;
    } else {
      if(salto){ n = 0; salto = false; } else salto = true;
    }
  }
  /* pausa: la sesión abierta hoy viene después de un hueco sin cerrar */
  const primeraPend = todas.findIndex(s => !s.hecha);
  const pausa = n > 0 && primeraPend >= 0 && primeraPend < ordenSesion(semana, sesionSel || "A");
  return {n, pausa};
}
const LOGROS = [
 {id:"arranque", n:"Primera sesión", c:"Terminar la primera sesión", t:x => x.nSes >= 1},
 {id:"semana_llena", n:"Cuatro de cuatro", c:"Terminar las 4 sesiones de una misma semana", t:x => x.semanaLlena},
 {id:"fase_uno", n:"Base construida", c:"Terminar las 16 sesiones de la fase 1", t:x => x.f1},
 {id:"racha_8", n:"Ocho seguidas", c:"8 sesiones consecutivas sin saltar ninguna", t:x => x.racha >= 8},
 {id:"sesiones_25", n:"Veinticinco", c:"25 sesiones terminadas", t:x => x.nSes >= 25},
 {id:"sesiones_50", n:"Cincuenta", c:"50 sesiones terminadas", t:x => x.nSes >= 50},
 {id:"primer_record", n:"Primer récord", c:"Superar por primera vez una marca propia", t:x => x.nRec >= 1},
 {id:"records_10", n:"Diez récords", c:"Acumular 10 récords", t:x => x.nRec >= 10},
 {id:"techo", n:"Tope de ventana", c:"Llegar al tope del rango en todas las rondas de un ejercicio", t:x => x.techo},
 {id:"bloque_cerrado", n:"Bloque completo", c:"Terminar las 48 sesiones del programa", t:x => x.nSes >= 48}
];
function statsLogros(sid){
  const todas = todasLasSesiones();
  const nSes = todas.filter(s => s.hecha).length;
  const semanaLlena = SESIONES.every(s => sesionHecha(semana, s.id));
  const f1 = (() => { let c = 0; for(let w = 1; w <= 4; w++) SESIONES.forEach(s => { if(sesionHecha(w, s.id)) c++; }); return c >= 16; })();
  let techo = false;
  if(sid){
    const ses = sesionDe(sid);
    const vistas = new Set();
    celdasSesion(ses).forEach(celda => {
      if(vistas.has(celda.k)) return;
      vistas.add(celda.k);
      const item = celda.item, k = celda.k;
      const tope = topeDe(item); if(!tope) return;
      const log = logDe(sid, k);
      const nR = celdasSesion(ses).filter(c => c.k === k).length;
      if(log){
        const vals = log.rondas.slice(0, nR).filter(rondaValida);
        if(vals.length >= nR && vals.every(r => (item.t ? num(r.seg) : num(r.reps)) >= tope)) techo = true;
      }
    });
  }
  return {nSes, semanaLlena, f1, racha:calcRacha().n, nRec:lget("nrecords", 0), techo};
}
function fraseCierre(nSes){
  const f = [
    "Sesión " + nSes + " de 48. Registrada.",
    "Nada espectacular, pero fuiste. Eso es lo que cuenta.",
    "Otra celda pintada. El mapa se va llenando.",
    "Lo difícil era partir. Ya está hecho.",
    "Media hora bien gastada.",
    "El plan decía hoy. Se cumplió hoy.",
    "Un ladrillo más. Así se construye el bloque.",
    "Hecho. El resto del día corre solo.",
    "Constancia sobre intensidad. Vas bien.",
    "El cuerpo toma nota, aunque todavía no se note.",
    "Sesión cerrada. La próxima ya tiene menos misterio.",
    "No fue perfecta y no importa. Cuenta igual.",
    "Volver a entrenar era esto: aparecer y anotar.",
    "Sin épica. Con registro."
  ];
  if(nSes > 24) f.push("Vas más de la mitad del bloque.");
  if(SESIONES.every(s => sesionHecha(semana, s.id))) f.push("Cuatro de cuatro esta semana.");
  return f[Math.floor(Math.random() * f.length)];
}

function terminarSesion(){
  const act = sa();
  const sid = sesionSel || (act && act.semana === semana ? act.sesionId : null);
  if(!sid){ aviso("No hay ninguna sesión abierta."); return; }
  sesionSel = sid;
  terminarSesionDe(semana, sid, false);
}
function terminarSesionDe(w, sid, recuperada){
  if(sesionHecha(w, sid)) return;
  const guardW = semana; semana = w;   // los helpers usan la semana global
  const ses = sesionDe(sid);
  const validas = seriesValidas(sid);
  if(!validas.length){ semana = guardW; aviso("No hay ninguna serie anotada todavía."); return; }
  const s = sa();
  let duracionReal = null;
  if(s && s.sesionId === sid && s.semana === w) duracionReal = Math.round(saElapsed(s) / 60000);
  /* rondas completas: todas las celdas de esa ronda del tramo con registro */
  let rondasCompletadas = 0;
  [1, 2, 3].forEach(tr => {
    const nR = rondasDe(tr, ses);
    for(let r = 0; r < nR; r++){
      const completa = ejerciciosDeTramo(ses, tr).every((item, i) => {
        const log = logDe(sid, ejActivo(ses, tr, i));
        return log && rondaValida(log.rondas[r]);
      });
      if(completa) rondasCompletadas++;
    }
  });
  const tonelaje = validas.reduce((a, v) => a + (num(v.r.kg) * num(v.r.reps)), 0);
  const cierreVacio = !ses.cierre.ej.some((item, i) => {
    const log = logDe(sid, ejActivo(ses, 3, i));
    return log && log.rondas.some(rondaValida);
  });
  const recordsHoy = validas.filter(v => v.r.rec).length;
  lset("sesion_" + w + "_" + sid, {
    fecha:hoyISO(), duracionReal, rondasCompletadas,
    seriesTotales:validas.length, tonelaje, cierreOmitido:cierreVacio,
    modo:modoSesion(ses)   /* la sesión vale igual: el modo solo sirve para reconocerla después */
  });
  if(s && s.sesionId === sid && s.semana === w){ saGuardar(null); soltarWakeLock(); }
  /* logros */
  const st = statsLogros(sid);
  const logros = lget("logros", {});
  const nuevos = [];
  LOGROS.forEach(l => { if(!logros[l.id] && l.t(st)){ logros[l.id] = hoyISO(); nuevos.push(l); } });
  lset("logros", logros);
  semana = guardW;
  vibrar(120);
  if(!recuperada) mostrarCierre(w, sid, st, nuevos, validas.length, recordsHoy, duracionReal);
  else pintar();
  document.body.classList.remove("con-sesion");
}
function mostrarCierre(w, sid, st, nuevos, nSeries, nRecs, dur){
  const mapa = mapaHTML(w, sid);
  $("#cierreInt").innerHTML =
    '<div class="etq">Sesión terminada · Semana ' + w + " · " + sid + "</div>" +
    '<div class="cierre-frase">' + fraseCierre(st.nSes) + "</div>" +
    mapa +
    '<div class="cierre-datos">' +
      '<div class="kpi"><div class="etq">Sesiones</div><div class="num">' + st.nSes + '<small> de 48</small></div></div>' +
      '<div class="kpi"><div class="etq">Series hoy</div><div class="num">' + nSeries + "</div></div>" +
      (nRecs ? '<div class="kpi"><div class="etq">Récords hoy</div><div class="num" style="color:var(--marca)">' + nRecs + "</div></div>" : "") +
    "</div>" +
    (dur ? '<div class="aviso-suave">Duración real: ' + dur + " min</div>" : "") +
    nuevos.map(l => '<div class="logro-nuevo"><div class="etq">Logro desbloqueado</div><b>' + l.n + "</b></div>").join("") +
    '<button class="btn-grande btn-acento" onclick="cerrarCierre()">Listo</button>';
  $("#cierre").classList.add("abierto");
}
function cerrarCierre(){ $("#cierre").classList.remove("abierto"); sesionSel = null; verLista = false; pintar(); }

/* ============ modal y toast ============ */
function abrirModal(titulo, texto, botones){
  $("#modalCaja").innerHTML = "<h3>" + titulo + "</h3><p>" + texto + "</p>" +
    botones.map((b, i) => '<button class="btn-grande ' + (i === 0 ? "btn-acento" : "btn-borde") + '" id="mbtn' + i + '">' + b[0] + "</button>").join("");
  botones.forEach((b, i) => { $("#mbtn" + i).onclick = b[1]; });
  $("#modal").classList.add("abierto");
}
function cerrarModal(){ $("#modal").classList.remove("abierto"); }
let toastT = null, toastAccion = null;
function aviso(txt, accion){
  const t = $("#toast");
  toastAccion = accion || null;
  t.innerHTML = txt + (accion ? ' <button class="toast-btn" onclick="deshacerToast()">Deshacer</button>' : "");
  t.classList.add("abierto");
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.classList.remove("abierto"); toastAccion = null; }, accion ? 6000 : 2600);
}
function deshacerToast(){
  if(toastAccion) toastAccion();
  toastAccion = null;
  $("#toast").classList.remove("abierto");
}

/* ============ 5. vistas ============ */
function irVista(v){ vista = v; pintar(); window.scrollTo(0, 0); }
function pintar(){
  ["hoy", "progreso", "ejercicios", "guia"].forEach(v => $("#nav_" + v).classList.toggle("sel", v === vista));
  if(vista === "hoy") pintarHoy();
  else if(vista === "progreso") pintarProgreso();
  else if(vista === "ejercicios") pintarEjercicios();
  else pintarGuia();
}
function cambiarSemana(d){
  semana = Math.min(12, Math.max(1, semana + d));
  lset("semana", semana);
  sesionSel = null;
  pintarHoy();
}
function elegirSesion(id){ sesionSel = id; pintarHoy(); }
function sesionSugerida(){
  const pend = SESIONES.find(s => !sesionHecha(semana, s.id));
  return pend ? pend.id : SESIONES[0].id;
}

function minimapaHTML(){
  let h = '<div class="minimapa">';
  for(let w = 1; w <= 12; w++) SESIONES.forEach(s => {
    const aqui = w === semana && s.id === (sesionSel || "");
    h += '<i class="' + (sesionHecha(w, s.id) ? "ok" : "") + (aqui ? " aqui" : "") + '"></i>';
  });
  return h + "</div>";
}
function mapaHTML(wNueva, sidNueva){
  let h = '<div class="mapa"><span></span>' + SESIONES.map(s => '<span class="cab-col">' + s.id + "</span>").join("");
  for(let w = 1; w <= 12; w++){
    h += '<span class="rot">S' + w + "</span>";
    SESIONES.forEach(s => {
      const ok = sesionHecha(w, s.id);
      const nueva = wNueva === w && sidNueva === s.id;
      const aqui = !wNueva && w === semana && s.id === sesionSugerida();
      /* la marca solo sirve para reconocerla después: cuenta exactamente igual */
      const sm = ok && ok.modo && ok.modo !== "normal";
      h += '<div class="celda-mapa' + (ok ? " ok" : "") + (nueva ? " nueva" : "") + (aqui ? " aqui" : "") +
        (sm ? " sinpeso" : "") + '"' + (sm ? ' title="sin mancuernas"' : "") + "></div>";
    });
  }
  return h + "</div>";
}

function visualHTML(k){
  const e = LIB[k];
  if(e.img){
    /* sin loading="lazy": dentro de un <details> cerrado la imagen queda a 0x0
       y el observador de lazy loading no la carga nunca. Son archivos locales
       de menos de 80 KB y el service worker los cachea. */
    return '<div class="visual"><img src="media/ejercicios/' + e.img + '" alt="" onerror="imgFallo(this,\'' + k + '\')" onload="this.dataset.ok=1"></div>' +
      '<div class="procedencia" id="proc_' + k + '">Imagen: wger, CC BY-SA</div>';
  }
  const svg = esquemaSVG(k);
  if(svg) return '<div class="visual">' + svg + '</div><div class="procedencia">Esquema propio</div>';
  return "";
}
function imgFallo(img, k){
  const svg = esquemaSVG(k);
  const cont = img.parentElement;
  if(!cont) return;
  if(svg){ cont.innerHTML = svg; const p = $("#proc_" + k); if(p) p.textContent = "Esquema propio"; }
  else { cont.remove(); const p = $("#proc_" + k); if(p) p.remove(); }
}
/* Red de seguridad: una <img> puede quedarse colgada sin disparar error (pasa
   sin conexión, cuando la petición no falla sino que nunca responde). A los
   3 segundos se reintenta por fetch, que sí pasa por el service worker y
   responde desde el caché; si tampoco hay, cae al esquema o al botón de video. */
function vigilarImagenes(){
  document.querySelectorAll(".visual img").forEach(img => {
    if(img.dataset.vigilada) return;
    img.dataset.vigilada = "1";
    setTimeout(() => {
      if(img.dataset.ok || (img.complete && img.naturalWidth > 0) || !img.isConnected) return;
      const k = (img.getAttribute("onerror") || "").match(/'([^']+)'/);
      const clave = k ? k[1] : null;
      fetch(img.getAttribute("src"))
        .then(r => r.ok ? r.blob() : Promise.reject())
        .then(b => { img.src = URL.createObjectURL(b); })
        .catch(() => { if(clave) imgFallo(img, clave); });
    }, 3000);
  });
}
function fichaHTML(k){
  const e = LIB[k];

    "</div>";
}
function comoSeHace(k){

function celdaHTML(sid, k, i, nRondas){

  })();
  const activa = rondaValida(r) || i <= primeraVacia;

    '<input class="kg" id="k_' + sid + "_" + k + "_" + i + '" inputmode="decimal" enterkeyhint="done" placeholder="kg" value="' + (r && num(r.kg) ? fmtNum(num(r.kg)) : "") + '" onchange="celdaCambio(\'' + sid + "','" + k + "'," + i + ')"></div>';

/* ---------- playback: pantalla ---------- */
let verLista = false;
let pbFirma = "";   /* para repintar solo cuando cambia de paso o de estado */

function pbEstado(){
  const s = sa(); if(!s) return null;
  const ses = sesionDe(s.sesionId);
  if(!ses || s.semana !== semana) return null;
  return {s, ses};
}
function enPlayback(){ return !!pbEstado() && !verLista; }

function pintarPlayback(){
  const e = pbEstado(); if(!e) return;
  const {s, ses} = e;
  const {pasos, i, paso} = pasoActual(s, ses);
  const enDescanso = !!s.finDescansoISO;
  pbFirma = i + "|" + (enDescanso && paso && paso.tipo === "serie" ? "d" : "t") + "|" + (s.ejIniISO ? "1" : "0");

  /* terminadas todas las series: solo queda cerrar */
  if(!paso){
    $("#app").innerHTML = cabeceraPB(ses, pasos.length, pasos.length) +
      '<div class="pb-caja pb-fin"><div class="pb-grande">Sesión completa</div>' +
      '<p class="aviso-suave">Anotaste todas las series del día. Cierra para que quede registrada.</p>' +
      '<button class="btn-grande btn-acento" onclick="terminarSesion()">Terminar sesión</button>' +
      '<button class="btn-grande btn-borde" style="margin-top:8px" onclick="verLista=true;pintar()">Ver la lista</button></div>';
    return;
  }
  /* el descanso se pinta sobre la serie recién hecha; si el paso no es una
     serie (la preparación, por ejemplo) no hay nada que corregir */
  const conDescanso = enDescanso && paso.tipo === "serie";
  $("#app").innerHTML = cabeceraPB(ses, i, pasos.length) +
    (conDescanso ? pbDescansoHTML(s, ses, pasos, i) : pbTrabajoHTML(s, ses, paso, i));
  if(conDescanso) enfocarReps(paso);
}

function cabeceraPB(ses, i, total){
  const puntos = [];
  for(let p = 1; p < total; p++)
    puntos.push('<i class="' + (p < i ? "ok" : p === i ? "aqui" : "") + '"></i>');
  return '<div class="pb-cab"><span class="etq">Sesión ' + ses.id + " · " + ses.n + "</span>" +
    '<button class="pb-link" onclick="verLista=true;pintar()">Ver lista</button></div>' +
    '<div class="pb-puntos">' + puntos.join("") + "</div>";
}

function pbTrabajoHTML(s, ses, paso, i){
  if(paso.tipo === "prep") return pbPrepHTML(ses);
  const k = paso.k, e = LIB[k], it = paso.item;
  const nR = rondasDe(paso.tramo, ses);
  const deTiempo = esDeTiempo(paso);
  const rango = it.max ? "máximas" :
    it.t ? it.t[0] + " a " + it.t[1] + " s" :
    it.r[0] + (it.r[1] > it.r[0] ? " a " + it.r[1] : "") + " reps" + (it.lado ? " " + it.lado : "");
  const u = ultimaVez(ses.id, k);
  const ultima = u ? u.log.rondas.filter(rondaValida).map(r =>
    esTiempo(u.k) ? num(r.seg) + " s" : (num(r.kg) ? fmtNum(num(r.kg)) + " kg × " : "") + num(r.reps)).join(", ") : "";
  /* el reloj: en los de tiempo hay que apretar Empezar, en el resto corre solo */
  const esperando = deTiempo && !s.ejIniISO;
  const reloj = esperando
    ? '<div class="pb-reloj" id="pbReloj">' + (it.t[1]) + 's</div><div class="etq">aguanta este tiempo</div>'
    : '<div class="pb-reloj" id="pbReloj">0:00</div><div class="etq" id="pbRelojEtq">esta serie</div>';
  const boton = esperando
    ? '<button class="pb-check pb-empezar" onclick="pbEmpezarEj()">Empezar</button>'
    : '<button class="pb-check" onclick="pbCheck()" aria-label="serie hecha">✓</button>';
  return reloj +
    '<div class="pb-caja">' +
      '<div class="pb-visual">' + visualPB(k) + "</div>" +
      '<div class="pb-nombre">' + e.n + "</div>" +
      '<div class="pb-sub">' + rango + " · RIR " + FASES[faseActual()].rir + "</div>" +
      '<div class="pb-ctx">' + (paso.tramo === 3 ? "Cierre" : "Bloque " + paso.tramo) +
        " · ronda " + (paso.ronda + 1) + " de " + nR + "</div>" +
      (ultima ? '<div class="pb-ultima">La vez pasada: ' + ultima + "</div>" : '<div class="pb-ultima">Primera vez. Anda al piso del rango y calibra.</div>') +
      boton +
      '<div class="pb-nav">' +
        '<button class="pb-link" onclick="pbAtras()"' + (i <= 1 ? " disabled" : "") + '>‹ atrás</button>' +
        '<button class="pb-link" onclick="pbSaltar()">saltar ›</button>' +
      "</div>" +
      comoSeHace(k) +

}

function pbDescansoHTML(s, ses, pasos, i){

      '<div class="pb-campo"><input id="pbReps" inputmode="numeric" enterkeyhint="done" value="' +

      (sig ? '<div class="pb-sigue"><span class="etq">sigue</span>' +

        '<div class="pb-sigue-img">' + visualPB(sig.k) + "</div></div>"
       : '<div class="pb-sigue"><span class="etq">era la última</span></div>') +
      '<div class="pb-controles">' +
        '<button class="btn-chico" onclick="ajustarDescanso(-30)">−30 s</button>' +
        '<button class="btn-chico" onclick="ajustarDescanso(30)">+30 s</button>' +
        '<button class="btn-chico acc" onclick="pbListo()">Listo ›</button>' +

    "</div>";
