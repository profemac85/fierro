const PATRONES_VALIDOS = Object.keys(PATRONES);
function validarNuevo(nv, errores, pos){
  const pre = "Ejercicio " + pos + ": ";
  if(!nv || typeof nv !== "object"){ errores.push(pre + "el campo nuevo tiene que ser un objeto."); return; }
  if(!nv.id || !/^[a-z0-9_]+$/.test(nv.id)) errores.push(pre + "el id tiene que ir en minúsculas, sin espacios ni tildes (por ejemplo sentadilla_sin_peso).");
  else if(LIB[nv.id]) errores.push(pre + "el id " + nv.id + " ya existe en la biblioteca. Usa ref en vez de nuevo.");
  if(!nv.n) errores.push(pre + "falta el nombre (n).");
  if(!nv.g) errores.push(pre + "falta el grupo muscular (g).");
  if(nv.patron && !PATRONES_VALIDOS.includes(nv.patron)) errores.push(pre + "patrón desconocido: " + nv.patron + ". Válidos: " + PATRONES_VALIDOS.join(", ") + ".");
  const prog = nv.prog || {};
  const tipos = Object.values(prog);
  if(!tipos.length) errores.push(pre + "falta prog (por ejemplo {\"adhoc\":\"nivel\"}).");
  tipos.forEach(t => { if(!["peso", "nivel", "tiempo", "reps"].includes(t)) errores.push(pre + "tipo de progresión desconocido: " + t + "."); });
  if(tipos.includes("nivel") && !(Array.isArray(nv.niveles) && nv.niveles.length)) errores.push(pre + "progresa por nivel pero no trae niveles.");
  if(Array.isArray(nv.niveles)) nv.niveles.forEach((l, i) => { if(!l || !l.n) errores.push(pre + "el nivel " + i + " no tiene nombre."); });
  if(!nv.p) errores.push(pre + "falta el fundamento (p). No es decorativo: es lo que hace útil la ficha.");
}
function validarImport(){
  const txt = ($("#txtImport") || {}).value || "";
  const salida = $("#importSalida");
  importPrevia = null;
  $("#btnCargar").disabled = true;
  if(!txt.trim()){ salida.innerHTML = '<div class="errores">Pega primero el JSON.</div>'; return; }
  let obj;
  try{ obj = JSON.parse(txt); }catch(e){
    /* tolera prosa alrededor: se busca el primer objeto de afuera hacia adentro */
    const m = txt.match(/\{[\s\S]*\}/);
    try{ obj = m ? JSON.parse(m[0]) : null; }catch(e2){ obj = null; }
    if(!obj){ salida.innerHTML = '<div class="errores">No se pudo leer como JSON. Revisa que esté completo: empieza con { y termina con }.</div>'; return; }
  }
  const errores = [];
  let previa = "";
  if(obj.app === "fierro" && obj.estado || (obj.v === 2 && Array.isArray(obj.sesiones))){
    const r = importarEstado(JSON.stringify(obj));
    if(r.error){ errores.push(r.error); }
    else {
      importPrevia = {tipo:"respaldo", estado:r.estado};
      previa = '<div class="previa"><div class="fila"><b>Respaldo completo</b><span>' + r.estado.sesiones.length + " sesiones</span></div>" +
        '<div class="fila"><span>Reemplaza TODO el estado actual (' + DB.sesiones.length + ' sesiones)</span><span style="color:var(--rojo)">sin vuelta</span></div></div>';
    }
  } else if(obj.tipo === "sesion-adhoc"){
    if(!obj.id || !/^[a-z0-9_-]+$/i.test(obj.id)) errores.push("Falta el id de la sesión, o tiene espacios o tildes.");
    if(!obj.nombre) errores.push("Falta el nombre de la sesión.");
    if(obj.reemplazaDia != null && !DIAS.includes(obj.reemplazaDia)) errores.push("reemplazaDia tiene que ser A, B, C, D o null.");
    if(!Array.isArray(obj.ejercicios) || !obj.ejercicios.length) errores.push("La sesión no trae ejercicios.");
    const filas = [];
    (obj.ejercicios || []).forEach((e, i) => {
      const pos = i + 1;
      if(e.ref){
        const x = ej(e.ref);
        if(!x || x.legado) errores.push("Ejercicio " + pos + ": ref " + e.ref + " no existe en la biblioteca. Ids válidos: " + Object.keys(LIB).concat(Object.keys(DB.ejerciciosCustom)).join(", ") + ".");
        else filas.push({n:x.n, nuevo:false, series:e.series || x.series, min:e.min != null ? e.min : x.min, max:e.max != null ? e.max : x.max});
      } else if(e.nuevo){
        validarNuevo(e.nuevo, errores, pos);
        filas.push({n:e.nuevo.n || "(sin nombre)", nuevo:!DB.ejerciciosCustom[e.nuevo && e.nuevo.id], series:e.series || e.nuevo.series || 3, min:e.min != null ? e.min : (e.nuevo.min || 8), max:e.max != null ? e.max : (e.nuevo.max || 12)});
      } else errores.push("Ejercicio " + pos + ": tiene que traer ref (uno existente) o nuevo (una ficha completa).");
      ["series", "min", "max"].forEach(k => { if(e[k] != null && !(Number.isFinite(e[k]) && e[k] > 0)) errores.push("Ejercicio " + pos + ": " + k + " tiene que ser un número mayor que cero."); });
    });
    if(!errores.length){
      importPrevia = {tipo:"adhoc", obj};
      const existe = adHocDe(obj.id);
      previa = '<div class="previa"><div class="fila"><b>' + esc(obj.nombre) + "</b><span>" + (existe ? "reemplaza la guardada" : "nueva") + "</span></div>" +
        (obj.motivo ? '<div class="fila"><span class="aviso-suave">' + esc(obj.motivo) + "</span></div>" : "") +
        '<div class="fila"><span>' + (DIAS.includes(obj.reemplazaDia) ? "Cuenta como día " + obj.reemplazaDia + " y avanza la rotación" : "Sesión extra, no avanza la rotación") + "</span><span>" + (obj.duracionEstimada ? obj.duracionEstimada + " min" : "") + "</span></div>" +
        filas.map(f => '<div class="fila"><span>' + esc(f.n) + (f.nuevo ? ' <span class="chip acc">nuevo</span>' : "") + "</span><span>" + f.series + " × " + f.min + (f.max > f.min ? "-" + f.max : "") + "</span></div>").join("") + "</div>";
    }
  } else if(obj.tipo === "actualizacion"){
    const filas = [];
    (obj.pausar || []).forEach(p => {
      if(!p.ref || !ej(p.ref)) errores.push("pausar: " + (p.ref || "(sin ref)") + " no existe.");
      else if(p.sustituto && !ej(p.sustituto)) errores.push("pausar: el sustituto " + p.sustituto + " no existe.");
      else filas.push("Pausar " + ej(p.ref).n + (p.motivo ? " (" + p.motivo + ")" : "") + (p.sustituto ? ", sustituto " + ej(p.sustituto).n : ""));
    });
    (obj.reanudar || []).forEach(id => { if(!ej(id)) errores.push("reanudar: " + id + " no existe."); else filas.push("Reanudar " + ej(id).n); });
    (obj.nivel || []).forEach(n => {
      const esc_ = n.ref && escaleraDe(n.ref);
      if(!esc_) errores.push("nivel: " + (n.ref || "(sin ref)") + " no existe o no progresa por niveles.");
      else if(!(Number.isInteger(n.i) && n.i >= 0 && n.i < esc_.length)) errores.push("nivel: " + n.ref + " tiene niveles 0 a " + (esc_.length - 1) + ", no " + n.i + ".");
      else filas.push(ej(n.ref).n + " al nivel " + n.i + " (" + esc_[n.i].n + ")");
    });
    if(obj.parametros && typeof obj.parametros === "object") Object.keys(obj.parametros).forEach(k => filas.push("Parámetro " + k + " = " + obj.parametros[k]));
    if(!filas.length && !errores.length) errores.push("La actualización no trae ningún cambio (pausar, reanudar, nivel o parametros).");
    if(!errores.length){
      importPrevia = {tipo:"actualizacion", obj};
      previa = '<div class="previa">' + filas.map(f => '<div class="fila"><span>' + esc(f) + "</span></div>").join("") + "</div>";
    }
  } else errores.push("No reconozco el tipo. Tiene que ser \"sesion-adhoc\", \"actualizacion\", o un respaldo exportado por la app.");
  if(errores.length){ salida.innerHTML = '<div class="errores"><b>No se puede cargar:</b><ul>' + errores.map(e => "<li>" + esc(e) + "</li>").join("") + "</ul></div>"; return; }
  salida.innerHTML = '<div class="aviso ok" style="margin-top:8px;margin-bottom:0"><b>Listo para cargar.</b></div>' + previa;
  $("#btnCargar").disabled = false;
}
function cargarImport(){
  if(!importPrevia) return;
  if(importPrevia.tipo === "respaldo"){
    abrirModal("Restaurar respaldo", "Se reemplaza todo el estado actual por el del respaldo. ¿Seguir?",
      [["Restaurar", () => { DB = importPrevia.estado; guardar(); cerrarModal(); sel = {dia:null, adhoc:null}; aviso("Respaldo restaurado."); irVista("hoy"); }], ["Cancelar", cerrarModal]]);
    return;
  }
  const obj = importPrevia.obj;
  if(importPrevia.tipo === "adhoc"){
    const ejercicios = obj.ejercicios.map(e => {
      if(e.nuevo){
        const nv = Object.assign({}, e.nuevo);
        nv.modos = nv.modos || ["casa", "gym"];
        if(!nv.video) nv.video = yt(nv.n + " técnica");
        if(Array.isArray(nv.niveles)) nv.niveles = nv.niveles.map((l, i) => Object.assign({i}, l, {i:l.i != null ? l.i : i}));
        DB.ejerciciosCustom[nv.id] = nv;
        return {ref:nv.id, series:e.series, min:e.min, max:e.max};
      }
      return {ref:e.ref, series:e.series, min:e.min, max:e.max};
    });
    const ses = {id:obj.id, nombre:obj.nombre, motivo:obj.motivo || "", reemplazaDia:DIAS.includes(obj.reemplazaDia) ? obj.reemplazaDia : null,
      duracionEstimada:obj.duracionEstimada || null, ejercicios, cargadaEl:fechaISO()};
    const i = DB.sesionesAdHoc.findIndex(a => a.id === obj.id);
    if(i >= 0) DB.sesionesAdHoc[i] = ses; else DB.sesionesAdHoc.push(ses);
    guardar();
    aviso("Sesión cargada. Aparece como botón en Hoy.");
    sel = {dia:null, adhoc:obj.id};
    irVista("hoy");
    return;
  }
  (obj.pausar || []).forEach(p => pausarEjercicio(p.ref, p.motivo || "", p.sustituto || null));
  (obj.reanudar || []).forEach(id => reanudarEjercicio(id));
  (obj.nivel || []).forEach(n => { const de = nivelActual(n.ref); if(de !== n.i){ DB.ascensos.push({ej:n.ref, de, a:n.i, fecha:fechaISO(), manual:true}); DB.niveles[n.ref] = n.i; } });
  if(obj.parametros) Object.assign(DB.parametros, obj.parametros);
  guardar();
  aviso("Actualización aplicada.");
  irVista("hoy");
}

   con la biblioteca, los niveles y las pausas actuales */

  const ids = Object.keys(LIB).concat(Object.keys(DB.ejerciciosCustom));

    "Contexto: " + fmtKg(pesoActual()) + ", modo actual " + nombreModo(DB.modo).toLowerCase() + ". Objetivo: perder grasa y ganar músculo, proporción hombro-cintura. Sesgo tirón:empuje " + (DB.parametros.sesgoTironEmpuje || "3:2") + ".\n" +

    "Niveles actuales: " + Object.keys(DB.niveles).filter(k => escaleraDe(k)).map(k => k + "=" + DB.niveles[k] + " (" + nombreNivel(k, DB.niveles[k]) + ")").join(", ") + ".\n" +

    "Grupos válidos: " + GRUPOS.join(", ") + ". Patrones válidos: " + PATRONES_VALIDOS.join(", ") + ". Tipos de progresión: peso, nivel, tiempo, reps.\n\n" +
    "Formato para ajustar la rutina sin sesión nueva:\n" +
    '{"tipo":"actualizacion","pausar":[{"ref":"curl_martillo","motivo":"...","sustituto":null}],"reanudar":["id"],"nivel":[{"ref":"dominadas","i":4}],"parametros":{"sesgoTironEmpuje":"2:2"}}\n\n' +
    "Escribe en español de Chile, sin rayas largas. Lo que necesito: ";

/* ============ arranque ============ */
function init(){
  const est = document.createElement("style");
  est.textContent = cssEsquemas();
  document.head.appendChild(est);
  cargar();
  const p = pendiente();
  if(p) sel = {dia:p.dia, adhoc:p.adhoc};
  if(p && p.pb) pedirWakeLock();
  pintar();
  if(tickInt) clearInterval(tickInt);
  tickInt = setInterval(tick, 500);
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
init();
</script>
