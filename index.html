<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6E7E2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1E22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fierro">
<meta name="color-scheme" content="light dark">
<title>Fierro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* ============ tokens: hormigón y tinta ============
   La paleta de la v1 se conserva entera. Cero colores duros fuera de estos
   dos bloques: así el modo oscuro recolorea todo sin tocar el resto. */
:root{
  --fondo:#E6E7E2;
  --tarjeta:#F8F8F6;
  --tinta:#14171B;
  --suave:#6B7178;
  --acento:#2440E8;
  --marca:#C07A00;
  --ok:#2F6B4F;
  --rojo:#B3261E;
  --linea:#D0D2CB;
  --blanco:#FFFFFF;
  --acento-tenue:#E4E8FC;
  --marca-tenue:#F6ECD8;
  --ok-tenue:#DFEEE5;
  --scrim:rgba(20,23,27,.45);
  --toast-link:#9DB0FF;
}
@media (prefers-color-scheme: dark){
  :root{
    --fondo:#1B1E22;
    --tarjeta:#24282D;
    --tinta:#ECEDE9;
    --suave:#9AA1A8;
    --acento:#7D8FFF;
    --marca:#E2A23A;
    --ok:#6FC194;
    --rojo:#F08A80;
    --linea:#3A3F46;
    --blanco:#2E3238;
    --acento-tenue:#2A3150;
    --marca-tenue:#3E3320;
    --ok-tenue:#203A2E;
    --scrim:rgba(0,0,0,.6);
    --toast-link:#B7C3FF;
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--fondo);color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.4;
  /* la retícula sutil del cuaderno de registro */
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,color-mix(in srgb,var(--linea) 45%,transparent) 27px 28px);
}
main{max-width:480px;margin:0 auto;padding:12px 12px 120px}
body.con-descanso main{padding-bottom:210px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--acento)}
b,strong{font-weight:800}

/* etiquetas pequeñas en mayúsculas: la personalidad de la interfaz */
.etq{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.num{font-variant-numeric:tabular-nums;font-weight:800}
.mono{font-variant-numeric:tabular-nums}
.suave{color:var(--suave)}
.oculto{display:none !important}

/* ============ cabecera ============ */
.fila-marca{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px}
.marca{font-size:20px;font-weight:900;letter-spacing:.22em}
.chip-peso{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 10px;border:1px solid var(--linea);
  border-radius:18px;background:var(--tarjeta);font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.chip-peso small{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}

/* selector Casa / Gimnasio: segmented control */
.segmentado{display:flex;border:1px solid var(--linea);border-radius:10px;background:var(--tarjeta);padding:3px;margin-bottom:10px}
.segmentado button{flex:1;min-height:42px;border-radius:8px;font-size:13.5px;font-weight:800;letter-spacing:.04em;color:var(--suave)}
.segmentado button.sel{background:var(--acento);color:var(--blanco)}
@media (prefers-color-scheme: dark){ .segmentado button.sel{color:var(--fondo)} }

.pills{display:flex;gap:6px;margin-bottom:10px}
.pill{flex:1;min-height:50px;border:1px solid var(--linea);border-radius:8px;background:var(--tarjeta);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.pill b{font-size:15px}
.pill small{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.pill.sel{border-color:var(--acento);outline:1px solid var(--acento)}
.pill.sig::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--acento)}
.adhoc-fila{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.adhoc-btn{min-height:40px;padding:0 12px;border:1px dashed var(--linea);border-radius:8px;background:var(--tarjeta);
  font-size:12.5px;font-weight:700}
.adhoc-btn.sel{border-style:solid;border-color:var(--acento);color:var(--acento)}

/* ============ tarjetas ============ */
.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:10px;padding:12px;margin-bottom:12px}
.tarjeta-cab{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.chip{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--linea);border-radius:5px;padding:2px 6px;color:var(--suave);vertical-align:2px;white-space:nowrap}
.chip.acc{border-color:var(--acento);color:var(--acento)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.marca{border-color:var(--marca);color:var(--marca)}
.chip.rojo{border-color:var(--rojo);color:var(--rojo)}
.aviso-suave{color:var(--suave);font-size:13px}
.aviso{border:1px solid var(--marca);background:var(--marca-tenue);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:12px}
.aviso.acc{border-color:var(--acento);background:var(--acento-tenue)}
.aviso.ok{border-color:var(--ok);background:var(--ok-tenue)}

/* ============ tarjeta de ejercicio (HOY) ============ */
.ej{background:var(--tarjeta);border:1px solid var(--linea);border-radius:10px;padding:12px;margin-bottom:10px;
  -webkit-touch-callout:none}
.ej.pausado{opacity:.55}
.ej-cab{display:flex;align-items:flex-start;gap:8px;-webkit-user-select:none;user-select:none}
.ej-num{width:26px;height:26px;border-radius:6px;background:var(--tinta);color:var(--fondo);font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.ej-tit{flex:1;min-width:0}
.ej-tit b{font-size:15px;display:block;line-height:1.25}
.ej-tit .sub{font-size:11.5px;color:var(--suave);margin-top:1px}
.ej-menu{width:40px;height:40px;font-size:20px;color:var(--suave);flex:none;margin:-6px -6px 0 0}
.nivel-linea{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.nivel-chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 9px;border:1px solid var(--acento);
  border-radius:15px;font-size:12px;font-weight:700;color:var(--acento);background:var(--acento-tenue)}
.nivel-chip small{font-weight:700;letter-spacing:.08em;font-size:9px;text-transform:uppercase}
.fila-tiempo{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px}
.fila-tiempo .etq{display:block}
.fila-tiempo b{font-size:16px;font-variant-numeric:tabular-nums}
.reloj-ses{text-align:right}
.reloj-ses b{color:var(--acento)}
.nota-desc{font-size:12px;color:var(--marca);font-weight:600;padding:6px 0 0;line-height:1.35}
.tabla-dur{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px 8px;font-size:13px;align-items:baseline}
.tabla-dur small{color:var(--suave);font-weight:600}
.sugerencia{font-size:12.5px;color:var(--suave);margin-top:8px;line-height:1.35}
.sugerencia b{color:var(--tinta)}
.sugerencia.lista{color:var(--ok)}
.sugerencia.lista b{color:var(--ok)}

/* series */
.series{margin-top:8px;border-top:1px solid var(--linea)}
.serie{display:flex;align-items:center;gap:6px;min-height:50px;border-bottom:1px solid var(--linea)}
.serie .s-n{width:22px;font-size:11px;font-weight:700;color:var(--suave);font-variant-numeric:tabular-nums}
.serie .campo{flex:1;display:flex;align-items:center;gap:3px;min-width:0}
.serie input{width:100%;min-height:42px;border:1px solid var(--linea);border-radius:7px;background:var(--fondo);
  text-align:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;outline:none;padding:0 4px}
.serie input:focus{border-color:var(--acento);outline:1px solid var(--acento);background:var(--blanco)}
.serie input.hecha{border-color:var(--ok);background:var(--ok-tenue)}
.serie .u{font-size:10px;color:var(--suave);font-weight:700;width:26px;flex:none}
.serie select{min-height:42px;border:1px solid var(--linea);border-radius:7px;background:var(--fondo);font-size:12px;
  font-weight:700;padding:0 6px;flex:1.4;-webkit-appearance:none;appearance:none;min-width:0;text-overflow:ellipsis}
.serie .s-rec{width:10px;height:10px;border-radius:50%;background:var(--marca);flex:none;visibility:hidden}
.serie .s-rec.si{visibility:visible}
.rir{display:flex;align-items:center;gap:6px;min-height:44px;padding-top:6px}
.rir .etq{margin-right:auto}
.rir button{min-width:52px;min-height:34px;border:1px solid var(--linea);border-radius:7px;background:var(--fondo);
  font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--suave)}
.rir button.sel{border-color:var(--acento);color:var(--acento);background:var(--acento-tenue)}
.ej-pie{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.btn-porque{flex:1;min-width:0;min-height:38px;text-align:left;font-size:12px;font-weight:700;color:var(--acento)}
.fund-panel{border-top:1px solid var(--linea);margin-top:6px;padding-top:4px}
.btn-desc{min-height:38px;padding:0 12px;border:1px solid var(--linea);border-radius:8px;background:var(--fondo);
  font-size:12px;font-weight:700;color:var(--tinta);white-space:nowrap}
.btn-desc.corriendo{border-color:var(--acento);color:var(--acento)}

/* fundamento desplegable */
details.porque{margin-top:6px}
details.porque summary{list-style:none;font-size:12px;font-weight:700;color:var(--acento);
  min-height:36px;display:flex;align-items:center;cursor:pointer}
details.porque summary::-webkit-details-marker{display:none}
details.porque summary::before{content:"▸ ";margin-right:2px}
details.porque[open] summary::before{content:"▾ "}
.fund p{font-size:13.5px;margin:6px 0 8px;line-height:1.45}
.fund .cue{background:var(--fondo);border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:7px 9px;font-size:13px;font-weight:600;margin:8px 0}
.fund ol{padding-left:20px;margin:6px 0}
.fund li{margin-bottom:4px;font-size:13px}
.fund .escalera-mini{font-size:12px;color:var(--suave);margin:6px 0}
/* fondo blanco: las ilustraciones de wger traen fondo blanco y sobre el hormigón se notaba el recorte */
.visual{width:100%;max-height:200px;display:flex;align-items:center;justify-content:center;
  background:var(--blanco);border:1px solid var(--linea);border-radius:7px;overflow:hidden;margin:8px 0 2px}
.visual img{max-width:100%;max-height:200px;object-fit:contain;display:block}
.visual svg{width:100%;max-height:200px}
@media (prefers-color-scheme: dark){ .visual img{filter:invert(.92) hue-rotate(180deg)} }
.procedencia{font-size:11px;color:var(--suave);margin:2px 0 8px}
.btn-video{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--linea);
  border-radius:8px;font-size:13px;font-weight:600;color:var(--tinta);text-decoration:none;background:var(--fondo)}

/* botones */
.btn-grande{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;
  border-radius:10px;font-size:16px;font-weight:800;letter-spacing:.02em}
.btn-acento{background:var(--acento);color:var(--blanco)}
@media (prefers-color-scheme: dark){ .btn-acento{color:var(--fondo)} }
.btn-acento:disabled{background:var(--linea);color:var(--suave)}
.btn-borde{border:1px solid var(--linea);background:var(--tarjeta)}
.btn-chico{min-height:44px;padding:0 14px;border:1px solid var(--linea);border-radius:8px;
  font-size:13px;font-weight:700;background:var(--tarjeta)}
.btn-chico.acc{border-color:var(--acento);color:var(--acento)}
.fila-btn{display:flex;gap:8px;margin-bottom:12px}
.fila-btn .btn-grande{flex:1}
.link{font-size:12.5px;font-weight:700;color:var(--acento);text-decoration:underline;min-height:40px;padding:0 4px}

/* ============ barra de descanso ============ */
#barra{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));
  background:var(--tarjeta);border-top:1px solid var(--linea);display:none;z-index:20}
body.con-descanso #barra{display:block}
.barra-int{max-width:480px;margin:0 auto;padding:8px 12px 8px;display:flex;align-items:center;gap:10px}
.barra-estado{min-width:0;flex:1}
.barra-tit{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.barra-info{font-size:14px;font-weight:800;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.barra-reloj{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--acento);min-width:74px;text-align:right}
/* en el descanso de la lista, el reloj es lo único que importa: grande */
body.con-descanso:not(.en-playback) .barra-reloj{font-size:46px;min-width:120px}
body.con-descanso:not(.en-playback) .barra-int{padding:10px 12px}
.barra-reloj.pasado{color:var(--marca)}
.barra-ctl{display:flex;gap:4px}
.barra-ctl button{min-width:44px;min-height:44px;border:1px solid var(--linea);border-radius:7px;background:var(--fondo);
  font-size:11px;font-weight:700;padding:0 6px}

/* ============ la sesión guiada ============ */
body.en-playback main{padding-top:8px;padding-bottom:210px}
.pb-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.pb-puntos{display:flex;gap:3px;margin-bottom:10px}
.pb-puntos i{flex:1;height:4px;border-radius:2px;background:var(--linea)}
.pb-puntos i.ok{background:var(--acento)}
.pb-puntos i.aqui{background:var(--acento);box-shadow:0 0 0 2px var(--fondo),0 0 0 3px var(--acento)}
.pb-link{font-size:12px;font-weight:700;color:var(--acento);min-height:44px;padding:0 4px}
.pb-link:disabled{color:var(--linea)}
/* el reloj manda: es lo primero que se ve */
.pb-reloj{font-size:62px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.02em}
.pb-reloj.descanso{color:var(--acento);font-size:88px}
.pb-reloj.pasado{color:var(--marca)}
.pb-etq{display:block;text-align:center;margin:2px 0 12px}
.pb-caja{background:var(--tarjeta);border:1px solid var(--linea);border-radius:10px;padding:14px}
.pb-visual{height:170px;display:flex;align-items:center;justify-content:center;background:var(--blanco);border:1px solid var(--linea);border-radius:8px;overflow:hidden;margin-bottom:10px}
.pb-visual img{max-width:100%;max-height:170px;object-fit:contain}
.pb-visual svg{width:100%;max-height:170px}
.pb-visual svg.estatico{display:none}
@media (prefers-color-scheme: dark){ .pb-visual img,.pb-sigue-img img{filter:invert(.92) hue-rotate(180deg)} }
.pb-nombre{font-size:25px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.pb-sub{font-size:14px;font-weight:600;color:var(--suave);margin-top:2px}
.pb-ctx{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--suave);margin-top:8px}
.pb-ultima{font-size:13px;color:var(--suave);margin-top:6px}
.pb-ultima b{color:var(--tinta)}
.pb-check{display:block;width:100%;min-height:76px;margin-top:14px;border-radius:12px;background:var(--acento);color:var(--blanco);font-size:32px;font-weight:800;line-height:1}
@media (prefers-color-scheme: dark){ .pb-check{color:var(--fondo)} }
.pb-check.pb-empezar{font-size:22px;letter-spacing:.02em}
.pb-nav{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.pb-hecho{font-size:16px;font-weight:800;margin-bottom:10px}
.pb-rec{color:var(--marca);font-size:12px;font-weight:700}
.pb-campos{display:flex;gap:10px;margin-bottom:10px}
.pb-campo{flex:1;border:1px solid var(--linea);border-radius:9px;background:var(--fondo);padding:6px 4px 4px;text-align:center}
.pb-campo:focus-within{border-color:var(--acento);outline:1px solid var(--acento);background:var(--blanco)}
.pb-campo input{width:100%;border:none;background:none;text-align:center;outline:none;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-height:44px}
.pb-campo select{width:100%;border:none;background:none;font-size:14px;font-weight:700;min-height:44px;text-align:center;-webkit-appearance:none;appearance:none}
.pb-campo-sel{flex:1.6}
.pb-campo .etq{display:block}
.pb-sigue{border-top:1px solid var(--linea);padding-top:10px;margin-top:8px}
.pb-sigue-n{font-size:19px;font-weight:800;line-height:1.2;margin-top:2px}
.pb-sigue-img{height:92px;display:flex;align-items:center;justify-content:center;margin-top:8px;background:var(--blanco);border:1px solid var(--linea);border-radius:8px;overflow:hidden}
.pb-sigue-img img{max-width:100%;max-height:92px;object-fit:contain}
.pb-sigue-img svg{max-height:92px;width:100%}
.pb-sigue-img svg.estatico{display:none}
.pb-controles{display:flex;gap:6px;margin-top:12px}
.pb-controles .btn-chico{flex:1}
.pb-fin{text-align:center}
.pb-grande{font-size:26px;font-weight:800;margin-bottom:6px}
.prep-lista{margin-top:10px}
.prep-item{border-top:1px solid var(--linea);padding:9px 0}
.prep-item:first-child{border-top:none}
.prep-tit{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.prep-tit b{font-size:15px}
.prep-tit span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acento);white-space:nowrap}
.prep-item p{font-size:13px;color:var(--suave);margin-top:3px}

/* ============ mapa de recuadros (Avances) ============ */
.mapa{display:grid;grid-template-columns:44px repeat(7,1fr);gap:3px;align-items:center}
.mapa .rot{font-size:9px;font-weight:700;color:var(--suave);text-align:right;padding-right:3px;white-space:nowrap}
.mapa .cab-col{font-size:9px;font-weight:700;color:var(--suave);text-align:center;letter-spacing:.1em}
.mapa .celda-mapa{aspect-ratio:1.4/1;border:1px solid var(--linea);border-radius:5px;background:var(--fondo);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--blanco);padding:0}
.mapa .celda-mapa.futuro{opacity:.35;border-style:dashed}
.mapa .celda-mapa.hoy{outline:2px solid var(--acento);outline-offset:1px}
.mapa .celda-mapa.ok{background:var(--acento);border-color:var(--acento)}
.mapa .celda-mapa.ok.gym{background:var(--marca);border-color:var(--marca)}
.mapa .celda-mapa.ok.adhoc{background:var(--suave);border-color:var(--suave)}
@media (prefers-color-scheme: dark){ .mapa .celda-mapa.ok{color:var(--fondo)} }
.detalle-tit{font-size:13px;color:var(--suave);margin-bottom:6px}
.detalle-ej{border-top:1px solid var(--linea);padding:8px 0}
.detalle-ej-cab b{font-size:14px}
.detalle-series{font-size:13px;font-variant-numeric:tabular-nums;margin-top:3px}
.detalle-series .rec{color:var(--marca);font-weight:700}
.detalle-series small{color:var(--suave);font-size:11px}

/* ============ navegación ============ */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--tarjeta);border-top:1px solid var(--linea);
  z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav-int{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--suave)}
nav button.sel{color:var(--acento)}
nav button svg{width:22px;height:22px}
nav button span{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

/* ============ semana ============ */
.semana-tira{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.dia-celda{border:1px solid var(--linea);border-radius:7px;background:var(--fondo);min-height:58px;padding:5px 3px;text-align:center}

.dia-celda .n{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;margin:1px 0}
.dia-celda.hoy{outline:1px solid var(--acento);border-color:var(--acento)}
.dia-celda.con-ses{cursor:pointer;background:var(--tarjeta)}
.dia-celda.sel{background:var(--acento-tenue);border-color:var(--acento)}
.serie.hecha-fija{gap:8px;flex-wrap:wrap;padding:6px 0}
.s-val{font-size:15px;font-variant-numeric:tabular-nums}
.s-val small{font-size:10px;color:var(--suave);font-weight:700}
.s-niv{font-size:12px;font-weight:700;color:var(--acento)}
.s-nota{font-size:11px;color:var(--suave);font-weight:600}
.dia-celda .m{display:flex;justify-content:center;gap:2px;flex-wrap:wrap}
.marca-ses{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;border-radius:5px;
  font-size:10px;font-weight:800;padding:0 4px;background:var(--acento);color:var(--blanco)}
.marca-ses.gym{background:var(--marca)}
.marca-ses.adhoc{background:var(--suave)}

.fila-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.fila-nav .btn-flecha{width:44px;height:44px;font-size:18px;color:var(--suave)}
.fila-nav .centro{text-align:center}
.fila-nav .tit{font-size:15px;font-weight:800;letter-spacing:.02em}
.grupos{margin-top:8px}
.grupo{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px;min-height:30px;font-size:12.5px}
.grupo .riel{height:10px;border-radius:5px;background:var(--fondo);border:1px solid var(--linea);position:relative;overflow:hidden}
.grupo .riel .banda{position:absolute;top:0;bottom:0;background:var(--ok-tenue)}
.grupo .riel .lleno{position:absolute;top:0;bottom:0;left:0;background:var(--acento);border-radius:5px}
.grupo .riel .lleno.bajo{background:var(--suave)}
.grupo .riel .lleno.alto{background:var(--marca)}
.grupo .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;font-size:12px}
.cardio-fila{display:flex;align-items:center;gap:6px}
.cardio-fila .etq{margin-right:auto}
.cardio-fila button{min-width:44px;min-height:38px;border:1px solid var(--linea);border-radius:7px;background:var(--fondo);font-weight:800}
.cardio-fila button.sel{border-color:var(--acento);color:var(--acento);background:var(--acento-tenue)}
.lista{font-size:13px}
.lista > div{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--linea);align-items:baseline}
.lista > div:last-child{border-bottom:none}
.lista .izq{min-width:0}
.lista .izq small{display:block;color:var(--suave);font-size:11.5px}
.lista .der{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;color:var(--suave);font-size:12px;text-align:right}

/* ============ avances ============ */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--tarjeta);border:1px solid var(--linea);border-radius:10px;padding:10px 12px}
.kpi .num{font-size:26px;line-height:1.1}
.kpi .num small{font-size:12px;font-weight:700;color:var(--suave)}
.bloque-modo{border-top:1px dashed var(--linea);padding-top:8px;margin-top:8px}
.bloque-modo:first-of-type{border-top:none;margin-top:0;padding-top:0}
.antes-ahora{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:6px}
.aa-col .etq{display:block}
.aa-col .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.aa-col .n{font-size:11px;color:var(--suave)}
.aa-pct{font-size:14px;font-weight:800;color:var(--ok);white-space:nowrap;text-align:center}
.aa-pct.neg{color:var(--suave)}
.escalera{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.peldano{display:flex;align-items:center;gap:8px;min-height:26px;font-size:12px;color:var(--suave)}
.peldano i{width:18px;height:18px;border-radius:5px;border:1px solid var(--linea);flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-style:normal;font-weight:800}
.peldano.hecho{color:var(--tinta)}
.peldano.hecho i{background:var(--ok);border-color:var(--ok);color:var(--blanco)}
.peldano.actual{color:var(--tinta);font-weight:800}
.peldano.actual i{background:var(--acento);border-color:var(--acento);color:var(--blanco)}
@media (prefers-color-scheme: dark){ .peldano.hecho i,.peldano.actual i{color:var(--fondo)} }
.carga-ef{font-size:12.5px;margin-top:8px;padding:8px 10px;border-radius:7px;background:var(--fondo);border:1px solid var(--linea)}
.carga-ef b{font-variant-numeric:tabular-nums}
.spark{width:100%;height:56px;margin-top:8px;display:block}
select.sel-ej{width:100%;min-height:44px;border:1px solid var(--linea);border-radius:8px;background:var(--fondo);
  padding:0 10px;font:inherit;font-weight:600;-webkit-appearance:none;appearance:none;margin-bottom:8px}

/* ============ método ============ */
.guia h3{font-size:14px;letter-spacing:.04em;margin:16px 0 6px}

.guia th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.criterio{border-top:1px solid var(--linea);padding:10px 0}

.criterio p{font-size:13px;color:var(--suave);margin-top:4px}
.criterio .estado{font-size:11.5px;font-weight:700;margin-top:4px}
.buscador{width:100%;min-height:48px;border:1px solid var(--linea);border-radius:10px;background:var(--tarjeta);
  padding:0 14px;font-size:15px;margin-bottom:12px;outline:none}
.buscador:focus{border-color:var(--acento)}

/* ============ importar ============ */
textarea.json{width:100%;min-height:150px;border:1px solid var(--linea);border-radius:10px;background:var(--tarjeta);
  padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.4;outline:none;resize:vertical}
textarea.json:focus{border-color:var(--acento)}
.errores{border:1px solid var(--rojo);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
.errores li{margin-left:16px;margin-bottom:3px}
.previa{margin-top:8px}
.previa .fila{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--linea);font-size:13px}
.previa .fila:last-child{border-bottom:none}

/* ============ pantalla de cierre (logros) ============ */
#cierre{position:fixed;inset:0;background:var(--fondo);z-index:50;display:none;overflow-y:auto}
#cierre.abierto{display:block}
.cierre-int{max-width:480px;margin:0 auto;padding:32px 16px 40px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.cierre-frase{font-size:22px;font-weight:800;line-height:1.3}
.cierre-datos{display:flex;gap:8px}
.cierre-datos .kpi{flex:1}
.logro{border:1px solid var(--linea);border-radius:10px;padding:10px 12px;background:var(--tarjeta)}
.logro .etq{display:block;margin-bottom:2px}
.logro b{font-size:15px;display:block}
.logro small{font-size:12.5px;color:var(--suave);display:block;margin-top:2px}
.logro.nivel{border-color:var(--ok);background:var(--ok-tenue)}
.logro.nivel .etq{color:var(--ok)}
.logro.record{border-color:var(--marca)}
.logro.record .etq{color:var(--marca)}
.logro.carga{border-color:var(--acento)}
.logro.carga .etq{color:var(--acento)}
.logro .fila-btn{margin:10px 0 0}
.logro .fila-btn .btn-grande{min-height:46px;font-size:14px}

/* modal (menú de ejercicio, confirmaciones, peso corporal) */
#modal{position:fixed;inset:0;background:var(--scrim);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#modal.abierto{display:flex}
.modal-caja{background:var(--tarjeta);border-radius:12px;padding:18px;max-width:360px;width:100%;max-height:85vh;overflow-y:auto}
.modal-caja h3{font-size:15px;margin-bottom:8px}
.modal-caja p{font-size:13px;color:var(--suave);margin-bottom:12px}
.modal-caja .btn-grande{margin-bottom:8px;min-height:48px;font-size:14px}
.modal-caja input,.modal-caja select,.modal-caja textarea{width:100%;min-height:46px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);padding:0 10px;font-size:17px;font-weight:700;outline:none;margin-bottom:10px}
.modal-caja textarea{min-height:70px;padding:8px 10px;font-size:14px;font-weight:500}
.modal-caja input:focus{border-color:var(--acento)}
.modal-caja label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--suave);margin-bottom:4px}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));
  background:var(--tinta);color:var(--fondo);border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;
  z-index:70;display:none;max-width:90%}
#toast.abierto{display:flex;align-items:center;gap:12px}
.toast-btn{color:var(--toast-link);font-weight:800;font-size:13px;text-decoration:underline;padding:6px 0;min-height:32px;white-space:nowrap}

/* ============ esquemas SVG animados ============ */
.esq .seg{stroke:var(--tinta);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.esq .seg-fino{stroke:var(--tinta);stroke-width:4;stroke-linecap:round;fill:none}
.esq .seg-suave{stroke:var(--linea);stroke-width:3;stroke-linecap:round;fill:none}
.esq .acc-f{fill:var(--acento);stroke:none}
.esq .acc-s{stroke:var(--acento);stroke-width:6;stroke-linecap:round;fill:none}
.esq .etq-esq{fill:var(--suave);font-size:12px;font-weight:600;text-anchor:middle;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.esq.estatico{display:none}
/* los keyframes rotan alrededor de pivotes en coordenadas del lienzo, así que
   el origen tiene que ser la esquina del viewBox, no el centro por defecto */
.esq.animado g{transform-box:view-box;transform-origin:0 0}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .esq.animado{display:none}
  .esq.estatico{display:block}
}

<script>
"use strict";
/* ================================================================
   FIERRO v2 · fuerza en casa y en gimnasio, con progresión por niveles
   Mapa del código:
     1. utilidades y estado (clave fierro.v2, migración desde v1)
     2. biblioteca de ejercicios (LIB) y escaleras de niveles (ESCALERAS)
     3. rutina (RUTINA) y esquemas SVG (ESQ)
     4. lógica: rotación, sugerencias, criterios, récords, carga efectiva
     5. sesión en curso, descanso, guardado y logros
     6. vistas: hoy, semana, avances, método, importar
   ================================================================ */

const $ = s => document.querySelector(s);

/* ============ 1. utilidades ============ */
function hoyISO(){ return new Date().toISOString(); }
function fechaISO(d){
  const x = d ? new Date(d) : new Date();
  return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
}
/* una fecha "YYYY-MM-DD" como Date local a mediodía, para que los cambios de
   horario no la corran de día */
function deFecha(f){ const p = String(f).split("-"); return new Date(+p[0], +p[1] - 1, +p[2] || 1, 12); }
function lunesDe(f){
  const d = deFecha(f);
  const dow = (d.getDay() + 6) % 7;   // lunes = 0
  d.setDate(d.getDate() - dow);
  return fechaISO(d);
}
function sumarDias(f, n){ const d = deFecha(f); d.setDate(d.getDate() + n); return fechaISO(d); }
function diasEntre(a, b){ return Math.round((deFecha(b) - deFecha(a)) / 86400000); }
function num(s){
  if(s == null) return 0;
  let t = String(s).trim();
  /* "1.010" con punto de miles (formato es-CL) son 1010, no 1,01 */
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, "");
  const v = parseFloat(t.replace(",", "."));
  return isFinite(v) && v > 0 ? v : 0;
}
function fmtNum(v){ return (Math.round(v * 10) / 10).toLocaleString("es-CL"); }
function fmtKg(v){ return fmtNum(v) + " kg"; }
function fmtFecha(f){ const d = f && f.length === 10 ? deFecha(f) : new Date(f); return String(d.getDate()).padStart(2, "0") + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function fmtFechaLarga(f){
  const d = f && f.length === 10 ? deFecha(f) : new Date(f);
  const dias = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  const meses = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  return dias[d.getDay()] + " " + d.getDate() + " " + meses[d.getMonth()];
}
function fmtReloj(ms){ const neg = ms < 0; ms = Math.abs(ms); const s = Math.round(ms / 1000); return (neg ? "+" : "") + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function normalizar(s){ return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function esc(s){ return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function slug(s){ return normalizar(s).replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, ""); }

/* ============ estado ============ */
const CLAVE = "fierro.v2";
const SEMILLA = {
  /* verificados con Max el 17-09-2026: dominadas con banda media, remo
     invertido horizontal, fondos libres, elevación de piernas rectas sobre
     90°, flexiones con pies elevados, mancuernas en el tope de carga de la
     casa (10 kg), goblet con la kettlebell de 20 kg y face pull con banda media */
  niveles:{dominadas:3, remo_invertido:3, fondos:3, elev_piernas:3, flexiones:5,
    press_banca:2, press_militar:2, laterales:2, bulgara:2, hip_thrust:2, curl_martillo:2, triceps_ext:2,
    rdl:2, goblet:2, face_pull:1},
  pausados:{curl_martillo:{desde:"2026-09-17", motivo:"Sobrecarga de antebrazo", sustituto:null}},
  pesoCorporal:90
};
function estadoVacio(){
  return {
    v:2, modo:"casa",
    pesoCorporal:[],
    sesiones:[],
    niveles:{},
    pausados:{},
    sesionesAdHoc:[],
    ejerciciosCustom:{},
    cardio:{},
    parametros:{sesgoTironEmpuje:"3:2", notaSesgo:"Corrige déficit de tirón + prioridad estética hombro-cintura"},
    pendiente:null,
    lastre:false,                    /* cinturón de lastre: dominadas y fondos pasan a progresar por kilos */
    logros:{},
    ascensos:[],
    criteriosVistos:{},
    migradoDeV1:null
  };
}
let DB = estadoVacio();

/* toda lectura y escritura del localStorage va con try/catch: la app tiene que
   pintar igual con almacenamiento bloqueado o lleno */
function leerCrudo(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function escribirCrudo(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } }
function guardar(){ escribirCrudo(CLAVE, JSON.stringify(DB)); }
function normalizarEstado(e){
  const base = estadoVacio();
  const out = Object.assign(base, e || {});
  out.v = 2;
  if(out.modo !== "gym") out.modo = "casa";
  ["pesoCorporal", "sesiones", "sesionesAdHoc", "ascensos"].forEach(k => { if(!Array.isArray(out[k])) out[k] = []; });
  ["niveles", "pausados", "ejerciciosCustom", "cardio", "parametros", "logros", "criteriosVistos"].forEach(k => { if(!out[k] || typeof out[k] !== "object") out[k] = {}; });
  if(!out.parametros.sesgoTironEmpuje) out.parametros.sesgoTironEmpuje = "3:2";
  out.sesiones.sort((a, b) => (a.fecha + (a.ts || "")).localeCompare(b.fecha + (b.ts || "")));
  return out;
}
function sembrar(e){
  Object.keys(SEMILLA.niveles).forEach(k => { if(e.niveles[k] == null) e.niveles[k] = SEMILLA.niveles[k]; });
  /* el peso semilla va fechado antes de cualquier sesión (incluidas las de la
     v1), para que la carga efectiva de esas fechas lea 90 y no el peso de hoy */
  if(!e.pesoCorporal.length) e.pesoCorporal.push({ts:"2026-08-01T12:00:00.000Z", kg:SEMILLA.pesoCorporal, semilla:true});
  return e;
}
/* versión de las reglas de migración. Si el teléfono migró con reglas
   anteriores (sin modo por fecha, sin kilos → nivel), las sesiones de origen v1
   se vuelven a traducir desde las claves fz_*, que siguen intactas. */
const MIGRACION_V1 = 3;
function cargar(){
  const crudo = leerCrudo(CLAVE);
  if(crudo){
    try{
      DB = normalizarEstado(JSON.parse(crudo));
      if(DB.migradoDeV1 && DB.migracionV1 !== MIGRACION_V1) remigrarV1();
      return;
    }catch(e){}
  }
  const v1 = migrarDesdeV1();
  if(v1){
    DB = sembrar(normalizarEstado(v1));
    /* el curl martillo parte pausado (semilla), salvo que ya venga decidido */
    Object.keys(SEMILLA.pausados).forEach(k => { if(!DB.pausados[k]) DB.pausados[k] = SEMILLA.pausados[k]; });
  } else {
    DB = sembrar(estadoVacio());
    Object.assign(DB.pausados, SEMILLA.pausados);
  }
  guardar();
}

/* ---- migración desde la v1 (claves fz_*) ----
   La v1 guardaba por semana y sesión: fz_sesion_{w}_{sid} con la fecha, y
   fz_log_{sid}_{k}_s{w} con las rondas. Cada sesión terminada pasa a ser una
   sesión v2 con sus series; el ejercicio se traduce con MAPA_V1 y, si no tiene
   equivalente en la rutina nueva, se conserva como ejercicio "legado" para no
   perder el historial. Las claves viejas no se borran.

   La v1 no distinguía casa de gimnasio. Las vacaciones empezaron el viernes
   11 de septiembre de 2026 y desde el 12 todo se hizo en el gimnasio de un
   hotel (se nota en los kilos convertidos desde libras: 9, 13,5, 15,8, 18, 22).
   En casa solo hay mancuernas de 7,5 y 10 kg, así que los kilos de las series
   de casa se traducen al peldaño de la escalera; una serie de mancuerna sin
   kilos anotados queda marcada como incompleta, no como cero. Las bandas
   registran nivel de banda, nunca kilos. */
const CORTE_HOTEL_V1 = "2026-09-12";
/* ejercicios de la v1 que se hacían con mancuerna o kettlebell: sin kilos, la serie está incompleta */
const V1_CON_CARGA = ["press_banca", "remo_inclinado", "press_hombro", "laterales", "bulgara", "goblet", "goblet_talones", "zancada",
  "remo_una_mano", "press_inclinado", "curl_inclinado", "triceps", "rdl", "hip_thrust", "gemelo"];
const V1_CON_BANDA = {face_pull:1, curl_femoral:null, laterales_banda:null, curl_banda:null};   /* valor = nivel de banda, si aplica */
function nivelDesdeKg(id, kg){
  const x = LIB[id]; if(!x) return null;
  if(x.escalera === "mancuerna") return kg >= 10 ? 2 : kg > 0 ? 1 : null;
  if(x.escalera === "goblet") return kg >= 20 ? 2 : kg > 0 ? 1 : null;
  return null;
}
function v1get(k){ const v = leerCrudo("fz_" + k); if(v == null) return null; try{ return JSON.parse(v); }catch(e){ return null; } }
function migrarDesdeV1(){
  let hay = false;
  try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k && /^fz_sesion_\d+_[A-D]$/.test(k)){ hay = true; break; } } }catch(e){}
  if(!hay) return null;
  const e = estadoVacio();
  const clavesLog = [];
  try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k && k.startsWith("fz_log_")) clavesLog.push(k.slice(3)); } }catch(e2){}
  for(let w = 1; w <= 12; w++) ["A", "B", "C", "D"].forEach(sid => {
    const dato = v1get("sesion_" + w + "_" + sid);
    if(!dato) return;
    const reg = {};
    clavesLog.filter(k => k.startsWith("log_" + sid + "_") && k.endsWith("_s" + w)).forEach(k => {
      const kv1 = k.slice(("log_" + sid + "_").length, -("_s" + w).length);
      const log = v1get(k);
      if(!log || !Array.isArray(log.rondas)) return;
      const m = MAPA_V1[kv1] || {id:kv1, legado:true};
      if(m.legado && !LEGADO_V1[kv1]) return;
      const fecha = fechaISO(dato.fecha);
      const modoSesion = fecha >= CORTE_HOTEL_V1 ? "gym" : "casa";
      const conBanda = kv1 in V1_CON_BANDA;
      const series = log.rondas.filter(r => r && (num(r.reps) > 0 || num(r.seg) > 0)).map(r => {
        const kg = num(r.kg);
        const out = {kg, reps: num(r.seg) > 0 ? num(r.seg) : num(r.reps), nivel: m.nivel == null ? null : m.nivel, modo:modoSesion, rir:null};
        if(conBanda){
          /* una banda es una banda, en la casa o en el hotel: modo casa, nivel de banda, sin kilos */
          out.kg = 0; out.modo = "casa";
          if(V1_CON_BANDA[kv1] != null) out.nivel = V1_CON_BANDA[kv1];
        } else if(modoSesion === "casa" && !m.legado && progDe(m.id, "casa") === "nivel" && out.nivel == null){
          /* en casa las mancuernas eran de 7,5 o 10 kg: se traducen al peldaño */
          out.nivel = nivelDesdeKg(m.id, kg);
          if(out.nivel != null) out.kg = 0;
        }
        if(V1_CON_CARGA.includes(kv1) && kg === 0) out.incompleta = 1;
        /* "Dominadas (o negativas de 5 segundos)" mezclaba dos ejercicios. En
           el hotel no había banda, así que esas series (10, 5 el 12-09) no se
           sabe qué fueron: quedan con nivel desconocido, fuera de Avances y
           de las sugerencias, pero visibles en el detalle de la sesión. */
        if(kv1 === "dominada" && modoSesion === "gym"){ out.nivel = null; out.incompleta = 1; out.nota = "nivel desconocido"; }
        return out;
      });
      if(!series.length) return;
      reg[m.id] = (reg[m.id] || []).concat(series);
    });
    if(!Object.keys(reg).length) return;
    const fechaSes = fechaISO(dato.fecha);
    e.sesiones.push({
      fecha: fechaSes, ts: dato.fecha, dia: sid, modo: fechaSes >= CORTE_HOTEL_V1 ? "gym" : "casa", adhoc:null, reg,
      duracion: dato.duracionReal ? Math.round(dato.duracionReal * 60) : null,
      origen:"v1", semanaV1: w
    });
  });
  const logros = v1get("logros") || {};
  Object.keys(logros).forEach(id => { e.logros[id] = fechaISO(logros[id]); });
  e.migradoDeV1 = hoyISO();
  e.migracionV1 = MIGRACION_V1;
  return e;
}
function remigrarV1(){
  const v1 = migrarDesdeV1();
  if(v1){
    DB.sesiones = DB.sesiones.filter(s => s.origen !== "v1").concat(v1.sesiones);
    DB.sesiones.sort((a, b) => (a.fecha + (a.ts || "")).localeCompare(b.fecha + (b.ts || "")));
  }
  /* la semilla de flexiones cambió de "en manillas" (4) a "pies elevados" (5) */
  if(DB.niveles.flexiones === 4 && !DB.ascensos.some(a => a.ej === "flexiones")) DB.niveles.flexiones = 5;
  DB.migracionV1 = MIGRACION_V1;
  guardar();
}

/* ---- exportar e importar el estado completo ----
   El formato es estable y se describe a sí mismo: además del estado lleva un
   diccionario con los nombres de ejercicios, niveles y días, porque el paso
   siguiente del proyecto es un agente asesor que va a leer este JSON sin tener
   la app al lado. */
function exportarEstado(){
  const dicc = {};
  Object.keys(todaLaBiblioteca()).forEach(id => {
    const x = ej(id);
    dicc[id] = {n:x.n, g:x.g, patron:x.patron, prog:x.prog, pesoCorporal:!!x.pc,
      niveles:(escaleraDe(id) || []).map(n => n.n), legado:!!x.legado};
  });
  /* copia de las sesiones con el nombre legible del nivel en cada serie */
  const sesiones = DB.sesiones.map(s => {
    const reg = {};
    Object.keys(s.reg).forEach(id => { reg[id] = s.reg[id].map(r => Object.assign({}, r, r.nivel != null ? {nivelNombre:nombreNivel(id, r.nivel)} : {})); });
    return Object.assign({}, s, {reg, titulo:tituloSesion(s)});
  });
  const nivelesActuales = {};
  Object.keys(DB.niveles).forEach(id => { if(escaleraDe(id)) nivelesActuales[id] = {i:DB.niveles[id], nombre:nombreNivel(id, DB.niveles[id])}; });
  return JSON.stringify({
    app:"fierro", formato:2, esquema:"fierro-v2.1", exportadoEl:hoyISO(),
    nivelesActuales,
    unidades:{kg:"kilos por mancuerna o carga total según el ejercicio", reps:"repeticiones, o segundos si prog es tiempo", rir:"repeticiones en reserva de la última serie, null si no se anotó", modo:"casa o gym", nivel:"índice en la escalera del ejercicio, null si progresa por peso"},
    dias:{A:"Tirón", B:"Piernas", C:"Empuje", D:"Mixto y acondicionamiento"},
    ejercicios:dicc,
    estado:Object.assign({}, DB, {sesiones})
  }, null, 1);
}
function importarEstado(txt){
  let obj;
  try{ obj = JSON.parse(txt); }catch(e){ return {error:"No es un JSON válido. Pega el texto completo del respaldo, sin recortar."}; }
  const est = obj && obj.estado && obj.app === "fierro" ? obj.estado : obj;
  if(!est || est.v !== 2 || !Array.isArray(est.sesiones)) return {error:"Ese JSON no es un respaldo de Fierro v2."};
  const e = normalizarEstado(est);
  /* los campos legibles del export no se guardan: el estado lleva índices */
  e.sesiones.forEach(s => { delete s.titulo; Object.keys(s.reg).forEach(id => s.reg[id].forEach(r => { delete r.nivelNombre; })); });
  return {estado:e};
}
/* el registro como texto, para pegarlo en una conversación */
function exportarTexto(){
  let txt = "FIERRO · registro de entrenamiento\nExportado el " + fmtFecha(hoyISO()) + " · peso corporal " + fmtKg(pesoActual()) + "\n";
  DB.sesiones.forEach(s => {
    txt += "\n" + s.fecha + " · " + tituloSesion(s) + " · " + (s.modo === "gym" ? "gimnasio" : "casa") +
      (s.duracion ? " · " + Math.round(s.duracion / 60) + " min" : "") + "\n";
    Object.keys(s.reg).forEach(id => {
      const x = ej(id); if(!x) return;
      const niv = s.reg[id].find(r => r.nivel != null);
      txt += "  " + x.n + (niv ? " (" + nombreNivel(id, niv.nivel).toLowerCase() + ")" : "") + ": " +
        s.reg[id].map(r => fmtSerie(id, r) + (r.desc ? " d" + r.desc + "s" : "") + (r.incompleta ? " (" + (r.nota || "sin peso anotado") + ")" : "")).join(", ") + "\n";
    });
  });
  const niv = Object.keys(DB.niveles).filter(id => escaleraDe(id));
  if(niv.length) txt += "\nNIVELES\n" + niv.map(id => "  " + ej(id).n + ": " + nombreNivel(id, DB.niveles[id])).join("\n") + "\n";
  if(DB.lastre) txt += "\nCinturón de lastre activo: dominadas y fondos progresan por kilos.\n";
  const pau = Object.keys(DB.pausados);
  if(pau.length) txt += "\nEN PAUSA\n" + pau.map(id => "  " + (ej(id) ? ej(id).n : id) + " (" + DB.pausados[id].motivo + ", desde " + fmtFecha(DB.pausados[id].desde) + ")").join("\n") + "\n";
  return txt;
}
function copiar(txt, msj){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(() => aviso(msj || "Copiado al portapapeles."), () => aviso("No se pudo copiar."));
  } else aviso("Este navegador no deja copiar directo.");
}
function compartir(txt, msj){
  if(navigator.share){ navigator.share({text:txt}).catch(() => copiar(txt, msj)); }
  else copiar(txt, msj);
}

  p:"El empuje de cadera (hip thrust) se hace con la espalda alta apoyada en un banco, los pies en el suelo y la carga sobre la cadera, subiendo hasta quedar recto de rodillas a hombros. Es el ejercicio con mayor activación medida del glúteo mayor, porque la resistencia actúa en horizontal y el glúteo trabaja al máximo en su posición acortada. Un glúteo desarrollado sostiene la pelvis, descarga la lumbar y, en términos estéticos, marca la transición entre cintura y pierna. En casa se carga con la kettlebell o una mancuerna sobre la cadera y progresa por nivel; en el gimnasio, con barra y por kilos. Repeticiones altas con pausa arriba de un segundo: la evidencia muestra que la contracción sostenida al final del rango es lo que más recluta.",

  how:["Espalda alta apoyada en el banco, pies al ancho de caderas.","Carga cruzada sobre la cadera.","Empuja con los talones y sube hasta quedar recto de rodillas a hombros.","Pausa arriba con el glúteo apretado y baja controlado."]},
prensa:{n:"Prensa de piernas", g:"Cuádriceps", patron:"rodilla", modos:["gym"], prog:{gym:"peso"},
  series:3, min:10, max:15, descanso:90, agarre:false,
  video:yt("prensa de piernas técnica"),
  p:"La prensa de piernas permite acumular volumen pesado de cuádriceps sin que el equilibrio, la espalda baja o el agarre sean el límite. Por eso solo existe en el modo gimnasio: aprovecha lo que el equipo ofrece y que en casa no se puede reproducir. Los estudios que comparan prensa y sentadilla muestran crecimiento similar de cuádriceps cuando el volumen y la cercanía al fallo se igualan, con menor demanda de estabilizadores y de columna en la prensa. Va después de los ejercicios unilaterales y de la bisagra para no gastar en ella la energía que esos requieren. Se hace con rango completo, la parte baja de la espalda pegada al respaldo y los pies a la altura que deje la rodilla en línea con el pie.",
  tec:"Baja hasta donde la cadera se mantenga pegada al respaldo, y empuja con toda la planta."},
elev_piernas:{n:"Elevación de piernas colgado", g:"Core", patron:"core", modos:AMBOS, prog:{casa:"nivel", gym:"nivel"}, escalera:"elev_piernas",
  series:3, min:12, max:15, descanso:60, agarre:true, pc:true,
  video:yt("elevación de piernas colgado técnica"),
  p:"La elevación de piernas colgado trabaja el recto abdominal en su función real, que es enrollar la pelvis hacia las costillas, más los flexores de cadera y el agarre. Se eligió por sobre los abdominales en el suelo porque la carga es la palanca de las piernas y se puede graduar en una escalera clara, de rodillas dobladas a piernas rectas hasta la barra, sin agregar peso ni máquinas. Sobre la parte estética conviene decirlo directo: la cintura estrecha depende de la grasa corporal, no de cuántos abdominales se hagan, y la evidencia no respalda la idea de la reducción localizada. Lo que sí hace este ejercicio es dar un recto abdominal firme y visible cuando la grasa baje, y proteger la lumbar en el resto de la rutina. Se hace sin balanceo, con bajada controlada.",
  tec:"Enrolla la pelvis, no solo subas las piernas. Sin balanceo, y baja en control."},
/* ---------- empuje ---------- */
fondos:{n:"Fondos", g:"Pecho", patron:"empuje-vertical", modos:AMBOS, prog:{casa:"nivel", gym:"nivel"}, escalera:"fondos",

  video:yt("fondos en paralelas técnica"),
  p:"Los fondos en paralelas son el empuje con peso corporal más pesado que existe: bajan el cuerpo entre dos apoyos y lo suben con pecho, tríceps y deltoides anterior. Cargan el pectoral inferior y el tríceps en estiramiento profundo, algo que las flexiones no consiguen porque el suelo corta el recorrido. Abren el día de empuje porque es el movimiento más demandante y el que más rinde con el cuerpo fresco. Los estudios de activación los sitúan a la altura del press de banca en pectoral y por encima en tríceps. Como en este momento ya salen 10 libres, el paso siguiente es lastre, y desde ahí el ejercicio pasa a progresar por kilos. La inclinación del torso reparte el trabajo: más inclinado, más pecho; vertical, más tríceps.",
  tec:"Codos hacia atrás, hombros abajo y lejos de las orejas, baja hasta que el hombro quede a la altura del codo."},
press_banca:{n:"Press de banca con mancuernas", g:"Pecho", patron:"empuje-horizontal", modos:AMBOS, prog:{casa:"nivel", gym:"peso"}, escalera:"mancuerna",
  series:3, min:8, max:12, descanso:150, agarre:false, img:"press_banca.jpg",
  video:yt("press de banca con mancuernas técnica"),
  p:"El press de banca con mancuernas es el empuje horizontal de referencia para pectoral, tríceps y deltoides anterior. Se prefiere a la barra porque las mancuernas dejan bajar más allá del plano del pecho, y el pectoral, como los isquiotibiales, responde más al trabajo en posición estirada: la evidencia reciente sobre rango de movimiento le atribuye una ventaja clara al recorrido completo con estiramiento controlado abajo. También obliga a cada brazo a estabilizar por su cuenta, lo que corrige diferencias entre lados que la barra disimula. En casa, con mancuernas de 10 kilos, progresa por tempo y pausas; en el gimnasio, por kilos, y las dos historias se leen por separado. Va después de los fondos y con un rango de 8 a 12 repeticiones: es el ejercicio donde más volumen de pecho se acumula sin castigar el hombro.",
  tec:"Omóplatos atrás y abajo, baja hasta el estiramiento del pecho con los codos a 45 grados, empuja sin rebotar.",
  how:["Acuéstate en el banco con un pie firme a cada lado.","Mancuernas a la altura del pecho, muñecas rectas.","Baja controlado hasta sentir el estiramiento del pecho.","Empuja hasta estirar los brazos, sin chocar las mancuernas arriba."]},
press_militar:{n:"Press militar con mancuernas", g:"Hombro", patron:"empuje-vertical", modos:AMBOS, prog:{casa:"nivel", gym:"peso"}, escalera:"mancuerna",
  series:3, min:10, max:12, descanso:90, agarre:false, img:"press_hombro.jpg",
  video:yt("press militar mancuernas técnica"),
  p:"El press militar con mancuernas empuja la carga desde las orejas hasta arriba de la cabeza y es el ejercicio principal del deltoides anterior y medio, con el tríceps y el trapecio superior de apoyo. Está en la rutina porque el hombro ancho de la proporción que se busca necesita masa en el deltoides, y el press vertical es el único empuje que lo carga en todo su recorrido. Con mancuernas en lugar de barra la trayectoria se adapta a cada hombro y la demanda de estabilidad es mayor, lo que la evidencia asocia con activación algo más alta del deltoides medio. En casa progresa por nivel; en el gimnasio, por kilos. El rango de 10 a 12 repeticiones cuida la articulación, que en este movimiento trabaja en su posición más comprometida.",
  tec:"Sube en línea recta, costillas abajo, y no arquees la espalda baja para empujar.",
  how:["Mancuernas a la altura de las orejas, antebrazos verticales.","Aprieta el abdomen y empuja vertical hasta estirar los codos.","Baja controlado de vuelta a las orejas."]},
laterales:{n:"Elevaciones laterales", g:"Hombro", patron:"aislado", modos:AMBOS, prog:{casa:"nivel", gym:"peso"}, escalera:"mancuerna",
  series:3, min:12, max:15, descanso:60, agarre:false, img:"laterales.jpg",
  video:yt("elevaciones laterales técnica"),
  p:"Las elevaciones laterales aíslan el deltoides medio, que es el músculo que define el ancho de hombros visto de frente y, con eso, la relación hombro-cintura que este programa persigue. Ningún press lo carga tanto en su función principal, que es separar el brazo del cuerpo, por eso se trabaja aparte. Es un músculo pequeño que responde a repeticiones altas, series cercanas al fallo y bajada lenta. La evidencia sobre hipertrofia con cargas livianas es clara: mientras la serie llegue cerca del fallo, 12 a 20 repeticiones crecen tanto como 6 a 8, y aquí la carga liviana además protege la articulación. Con las mancuernas de casa se progresa con tempo, pausa arriba y parciales en la parte alta; en el gimnasio, con incrementos pequeños de peso. Se sube hasta la horizontal, no más.",
  tec:"Sube el codo, no la mano, hasta la horizontal, con una pausa breve arriba y bajada lenta.",
  how:["De pie, mancuernas a los costados, codos apenas doblados.","Sube los brazos hasta la horizontal, como sirviendo dos jarras.","Pausa breve arriba.","Baja lento, resistiendo la caída."]},
triceps_ext:{n:"Extensión de tríceps", g:"Tríceps", patron:"aislado", modos:AMBOS, prog:{casa:"nivel", gym:"peso"}, escalera:"mancuerna",
  series:3, min:10, max:12, descanso:60, agarre:false, img:"triceps.jpg",
  video:yt("extensión de tríceps sobre la cabeza técnica"),
  p:"La extensión de tríceps sobre la cabeza estira la cabeza larga del tríceps, que cruza el hombro y solo llega a su longitud completa con el brazo arriba. Esa cabeza es dos tercios del volumen del músculo y la que más se nota en el brazo relajado. Los estudios que comparan extensión sobre la cabeza y extensión en polea con el codo al costado encuentran alrededor de un 40 por ciento más de crecimiento con la versión estirada. El tríceps ya trabaja en fondos y en todos los press, así que aquí el volumen es moderado y el objetivo es el rango completo. En casa se hace con una mancuerna tomada con las dos manos; en el gimnasio, con cuerda en polea alta o baja, y en ambos casos los codos apuntan al techo y no se abren.",
  tec:"Codos al techo y quietos, baja hasta el estiramiento profundo y estira sin mover el brazo.",
  how:["Toma la mancuerna con las dos manos por debajo del disco superior.","Súbela sobre la cabeza, codos apuntando al techo.","Baja por detrás de la cabeza hasta sentir el estiramiento.","Estira los codos sin mover los brazos."]},

remo_polea:{n:"Remo en polea", g:"Espalda", patron:"tiron-horizontal", modos:["gym"], prog:{gym:"peso"},

goblet:{n:"Sentadilla goblet", g:"Cuádriceps", patron:"rodilla", modos:AMBOS, prog:{casa:"nivel", gym:"peso"}, escalera:"goblet",
  series:3, min:12, max:15, descanso:90, agarre:false, img:"goblet.jpg",

flexiones:{n:"Flexiones", g:"Pecho", patron:"empuje-horizontal", modos:AMBOS, prog:{casa:"nivel", gym:"nivel"}, escalera:"flexiones",

plancha_lateral:{n:"Plancha lateral", g:"Core", patron:"core", modos:AMBOS, prog:{casa:"tiempo", gym:"tiempo"},
  series:3, min:30, max:45, lado:"por lado", descanso:60, agarre:false, pc:true,

burpees:{n:"Intervalos de burpees", g:"Acond", patron:"acond", modos:AMBOS, prog:{casa:"reps", gym:"reps"},

/* acceso unificado a la biblioteca: rutina, personalizados (por JSON) y legado */
function ej(id){
  if(LIB[id]) return LIB[id];
  const c = DB.ejerciciosCustom && DB.ejerciciosCustom[id];
  if(c) return c;
  if(LEGADO_V1[id]) return Object.assign({legado:true, modos:[], id}, LEGADO_V1[id]);
  return null;
}
function todaLaBiblioteca(){
  const out = {};
  Object.keys(LIB).forEach(k => { out[k] = LIB[k]; });
  Object.keys(DB.ejerciciosCustom || {}).forEach(k => { out[k] = DB.ejerciciosCustom[k]; });
  Object.keys(LEGADO_V1).forEach(k => { if(!out[k] && DB.sesiones.some(s => s.reg[k])) out[k] = ej(k); });
  return out;
}
function escaleraDe(id){
  const x = ej(id); if(!x) return null;
  if(Array.isArray(x.niveles) && x.niveles.length) return x.niveles;
  if(x.escalera && ESCALERAS[x.escalera]) return ESCALERAS[x.escalera];
  return null;
}
/* el tipo de progresión de un ejercicio en un modo: peso | nivel | tiempo | reps */
function progDe(id, modo){
  const x = ej(id); if(!x) return "reps";
  if(x.legado) return x.prog || "reps";
  /* con el cinturón de lastre, dominadas y fondos progresan por kilos; la
     escalera queda archivada, no borrada */
  if(x.lastre && DB.lastre) return "peso";
  const p = x.prog || {};
  const m = modo || DB.modo;
  if(p[m]) return p[m];
  if(p.adhoc) return p.adhoc;
  const cualquiera = Object.keys(p)[0];
  return cualquiera ? p[cualquiera] : (escaleraDe(id) ? "nivel" : "reps");
}
function nivelActual(id){
  const esc = escaleraDe(id); if(!esc) return null;
  const n = DB.niveles[id];
  return n == null ? 0 : Math.max(0, Math.min(esc.length - 1, n));
}
function nombreNivel(id, i){
  const esc = escaleraDe(id);
  if(!esc || i == null || !esc[i]) return "";
  return esc[i].n;
}
function criterioDe(id, i){
  const esc = escaleraDe(id), x = ej(id);
  const n = esc && esc[i];
  if(!n) return null;
  if(n.pasaAPeso || i >= esc.length - 1) return null;
  if(n.crit) return n.crit;
  return {s:x.series || 3, r:x.max || 10};
}
function textoCriterio(id, i){
  const c = criterioDe(id, i); if(!c) return "";
  const esc = escaleraDe(id);
  if(esc[i].criterio) return esc[i].criterio;
  const t = progDe(id) === "tiempo";
  return c.s + " series de " + c.r + (t ? " segundos" : " repeticiones");
}

/* ============ 3. rutina ============
   Cuatro días en rotación global A → B → C → D. El modo (casa o gym) decide
   qué ejercicio ocupa cada casilla; la estructura es la misma. Una casilla
   puede tener un id distinto por modo (curl nórdico en casa, máquina en el
   gym), el mismo en los dos, o faltar en uno (la prensa solo existe en el gym).
   Series y rango se heredan de la ficha salvo que la casilla los cambie. */
const DIAS = ["A", "B", "C", "D"];
const RUTINA = {
  A:{n:"Tirón", items:[
    {casa:"dominadas", gym:"dominadas"},
    {casa:"remo_invertido", gym:"remo_invertido"},
    {casa:"face_pull", gym:"face_pull"},

    {casa:"curl_martillo", gym:"curl_martillo"}
  ]},
  B:{n:"Piernas", items:[
    {casa:"bulgara", gym:"bulgara"},
    {casa:"rdl", gym:"rdl"},
    {casa:"nordico", gym:"curl_femoral_maq"},
    {casa:"hip_thrust", gym:"hip_thrust"},
    {casa:null, gym:"prensa"},
    {casa:"elev_piernas", gym:"elev_piernas"}
  ]},
  C:{n:"Empuje", items:[
    {casa:"fondos", gym:"fondos"},
    {casa:"press_banca", gym:"press_banca"},
    {casa:"press_militar", gym:"press_militar"},
    {casa:"laterales", gym:"laterales"},
    {casa:"triceps_ext", gym:"triceps_ext"}
  ]},

    {casa:"goblet", gym:"goblet"},
    {casa:"flexiones", gym:"flexiones"},

    {casa:"burpees", gym:"burpees"}
  ]}
};
const SUGERIDO_DIA = {A:"lunes", B:"martes", C:"jueves", D:"viernes"};

/* la lista de casillas de una sesión (día de rutina o ad hoc) en un modo */
function casillaDe(id, item){
  const x = ej(id); if(!x) return null;
  return {
    id, series: item.series || x.series || 3,
    min: item.min != null ? item.min : (x.min || 8),
    max: item.max != null ? item.max : (x.max || 12),
    lado: item.lado || x.lado || "", unidad: x.unidad || "",
    maxLibre: !!x.maxLibre
  };
}
function casillasDeDia(dia, modo){
  const d = RUTINA[dia]; if(!d) return [];
  return d.items.map(it => it[modo] ? casillaDe(it[modo], it) : null).filter(Boolean);
}
function adHocDe(id){ return DB.sesionesAdHoc.find(s => s.id === id) || null; }
function casillasAdHoc(ad){
  return (ad.ejercicios || []).map(e => {
    const id = e.ref || (e.nuevo && e.nuevo.id);
    return id ? casillaDe(id, e) : null;
  }).filter(Boolean);
}
function casillasDe(sel, modo){
  return sel.adhoc ? (adHocDe(sel.adhoc) ? casillasAdHoc(adHocDe(sel.adhoc)) : []) : casillasDeDia(sel.dia, modo);
}
function tituloSesion(s){
  if(s.adhoc){ const ad = adHocDe(s.adhoc); return ad ? ad.nombre : s.adhoc; }
  return "Día " + s.dia + " · " + (RUTINA[s.dia] ? RUTINA[s.dia].n : "");
}

/* ============ esquemas SVG propios ============
   Para los ejercicios sin imagen de banco abierto. Un esquema se declara como
   geometría: `fijo` son las piezas quietas y `piezas` las que se mueven, cada
   una con su pivote y su ángulo final (o una escala). El motor arma el SVG y
   genera los @keyframes. Los pivotes van en coordenadas del lienzo 0 0 200 200:
   ese viewBox no se toca y el encuadre se hace con un <g> envolvente. */
const SUELO = 172;
function ln(a, b, c){ return '<line class="' + (c || "seg") + '" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>'; }
function circ(p, r, c){ return '<circle class="' + (c || "seg") + '" cx="' + p[0] + '" cy="' + p[1] + '" r="' + r + '"/>'; }
function suelo(x1, x2){ return ln([x1 || 15, SUELO], [x2 || 185, SUELO], "seg-suave"); }
function apoyo(x, y, w){ return '<rect class="seg-suave" x="' + (x - w/2) + '" y="' + y + '" width="' + w + '" height="' + (SUELO - y) + '" rx="2"/>'; }
function pathNS(d, c){ return '<path class="' + (c || "seg") + '" vector-effect="non-scaling-stroke" d="' + d + '"/>'; }
function angCaida(radio, caida){ return -Math.round(Math.asin(Math.min(0.95, caida / radio)) * 180 / Math.PI); }

/* flexiones: un solo rig, cambia la altura de las manos y de los pies */
function rigFlex(o){
  const xMano = o.xMano || 58, xPie = 165;
  const yMano = o.yMano, yPie = o.yPie == null ? SUELO - 6 : o.yPie;
  const yHombro = yMano - 30, xHombro = xMano + 8;
  const radio = Math.hypot(xPie - xHombro, yPie - yHombro);
  const piezas = [
    {id:"cuerpo", pivote:[xPie, yPie], ang:angCaida(radio, o.caida || 22),
     d: ln([xPie, yPie], [xHombro, yHombro]) + ln([xPie, yPie], [xPie + 6, SUELO]) + circ([xHombro - 17, yHombro - 8], 9)},
    {id:"brazo", pivote:[xMano, yMano], ang:-14, escY:0.42,
     d: pathNS("M " + xMano + " " + yMano + " L " + (xMano + 3) + " " + (yMano - 14) + " L " + xHombro + " " + yHombro) + circ([xMano + 3, yMano - 14], 5, "acc-f")}
  ];
  const fijo = suelo() + (o.alturaApoyo ? apoyo(xMano, yMano, 26) : "") + (o.pieElevado ? apoyo(xPie, yPie, 30) : "");
  return {fijo, piezas, caja:[13, yHombro - 19, 187, SUELO + 8]};
}

const ESQ = {
  curl_martillo:  {rig:rigCurl},
  jalon:          {rig:rigJalon},
  remo_polea:     {rig:rigRemoPolea},
  fondos:         {rig:rigFondos},
